<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#1e293b"/>
</linearGradient>
<linearGradient id="entry1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1e40af"/>
<stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="entry2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#7e22ce"/>
<stop offset="100%" stop-color="#9333ea"/>
</linearGradient>
<linearGradient id="user" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0e7490"/>
<stop offset="100%" stop-color="#0891b2"/>
</linearGradient>
<linearGradient id="kern" x1="0" y1="0" x2="0" y2="1">
