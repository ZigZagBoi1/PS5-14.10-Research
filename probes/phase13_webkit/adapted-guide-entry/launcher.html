<!DOCTYPE html><html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 Research</title>
<style>
body{background:#1a1a2e;color:#e0e0e0;font-family:sans-serif;margin:0;padding:20px;text-align:center}
h2{color:#fff;margin-top:40px}
.btn{display:inline-block;margin:12px 8px;padding:18px 32px;font-size:18px;border:none;border-radius:8px;cursor:pointer;color:#fff;text-decoration:none;min-width:200px}
.btn-primary{background:#0f3460}
.btn-secondary{background:#16213e}
.btn:active{opacity:0.7}
.status{margin-top:30px;font-size:14px;color:#888}
pre{text-align:left;font-size:11px;color:#666;margin-top:40px;padding:10px}
</style>
</head>
<body>
<h2>Select Probe</h2>

<a class="btn btn-primary" href="/probes/p636-capability-scan.html">p636: Capability Scan</a><br>
<a class="btn btn-primary" href="/probes/p635k-slim.html">p635k: WebKit APIs</a><br>
<a class="btn btn-primary" href="/probes/p635l-slim.html">p635l: BMR Spray</a><br>

<div class="status" id="st">Ready</div>
<script>
// Minimal: just beacon that launcher loaded
try{
  var x=new XMLHttpRequest();
  x.open('POST','/api/beacon',false);
  x.setRequestHeader('Content-Type','application/json');
  x.send(JSON.stringify({stage:'launcher',msg:'LAUNCHER-LOADED',level:'info',sid:'launch-'+Date.now(),ua:navigator.userAgent}));
  document.getElementById('st').textContent='Connected';
}catch(e){
  document.getElementById('st').textContent='Beacon offline';
}
</script>
</body></html>
