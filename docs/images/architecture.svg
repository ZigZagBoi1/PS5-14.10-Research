<text x="400" y="56" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">Firmware 14.10 · FreeBSD r230171 · 16KB pages · 2703 probes · 3058 results</text>

