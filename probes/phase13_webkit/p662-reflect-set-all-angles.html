  else emit('B1-VERDICT','normal (own prop on objB)');

  // B2: Reflect.set with TypedArray proto, receiver = the child object
  var taB2=new Float64Array(10);
  taB2[5]=555.555;

  Reflect.set(objB2,5,666.666,objB2);
  emit('B2-RESULT','objB2[5]='+objB2[5]+',taB2[5]='+taB2[5]);

  // Patched: objB4[0]=888.888 (write goes to receiver)
  if(taB4[0]===888.888) emit('B4-VERDICT','VULNERABLE-ta-written');
  else emit('B4-VERDICT','patched-receiver-written');

  var taC=new Float64Array(10);

  var taC4=new Float64Array(4);

// ================================================================

// If DFG tracks that the write goes to TA (buggy), it might
