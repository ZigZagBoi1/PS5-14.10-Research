  (b) Function with 38M bytecodes never reaches the first callback

    try { new Image().src = '/beacon/' + encodeURIComponent('SYNC-FAIL-' + m); } catch(e2){}
  }
}

var OP_CALL_COUNT = 38348816;

b('P615B-START');

// Phase 1: Build source (same as p615)
b('P615B-SOURCE-BUILD');
var source;
try {
  source = 'x();'.repeat(OP_CALL_COUNT);
} catch(e) {
  b('P615B-SOURCE-OOM');
  try {
    var chunks = [];
    var CHUNK = 100000;
    var full = Math.floor(OP_CALL_COUNT / CHUNK);
    var rem = OP_CALL_COUNT % CHUNK;
    var one = 'x();'.repeat(CHUNK);
    for (var i = 0; i < full; i++) chunks.push(one);
    if (rem > 0) chunks.push('x();'.repeat(rem));

  fn(function() {

      b('P615B-CALL-' + callCount);

      b('P615B-BAIL-AT-5');

  b('P615B-CATCH=' + String(e).slice(0, 100));

if (callCount === 5) {

if (callCount === 5) {
