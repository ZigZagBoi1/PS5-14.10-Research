<!--
  launcher.html — PS5 browser probe launcher.
  
  Serves as the index page (/) and lets you select which probe to run
  without typing URLs. Each probe button navigates to the corresponding
  probe page.
  
  Usage: Open https://<SERVER_IP>/ in the PS5 browser, then click the
  probe you want to run.
-->

.probe-btn {

  text-align: left;
}
.probe-btn:hover { background: #0f0; color: #000; }
.probe-btn.active { background: #0a0; color: #000; }
.info { color: #888; font-size: 12px; margin: 10px 0; }
.status { color: #ff0; font-size: 12px; margin: 10px 0; }
</style>
</head><body>

<script>
function navigate(url) {
  // Show status
  var status = document.createElement('div');
  status.className = 'status';
  status.textContent = 'Loading ' + url + '...';
  document.body.appendChild(status);
  
  // Navigate after a short delay
  setTimeout(function() {
    window.location.href = url;
  }, 500);
}
</script>
