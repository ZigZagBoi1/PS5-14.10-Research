<!--

  Pre-fills spray buffers so engine doesn't crash when it walks our lane.

  Safety fields (from vincenzoiacovone 14.10 bench, issue #168):
    +0x00: rc=2 (engine bumps to 3 = hit witness)
    +0x58: 0 (null table, engine writes T here)
    +0x60: opCount=0 (prevent amortizedCleanupIfNeeded)
    +0x64: maxOp=0xFFFFFFFF (prevent cleanup threshold)
    +0x68: 0 (engine writes W here)
    +0x82: 3 (Status::Success, pump is no-op)

  Two scans at 60ms and 400ms (vincenzoiacovone timing).
  Reports the triple: rc, T(+0x58), W(+0x68), kc(+0x50).

  Expected beacons:
    G         = start
    PC        = pre-churn done
    F         = font freed inside getter
    S<n>      = spray done
    H<i>,rc=<d>,T=<hex>,W=<hex>,kc=<d>  = hit at buffer i
    MISS      = no hit at this scan
    ALIVE     = survived 500ms
    ALIVE2    = survived 2000ms

  CRASH_CLASS: HIGH
-->
