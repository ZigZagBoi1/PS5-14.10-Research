# PS5 Research VPS - nginx config
# Serves probes ONLY to PS5 consoles on firmware 14.00+
# Blocks PC browsers, curl, wget, scrapers, and older PS5 firmware

server {
    listen 80;
    listen 443 ssl;
    server_name manuals.playstation.net;

    # Bootstrap with the distro snakeoil cert so nginx starts on a fresh host.
    # certbot --nginx replaces these with the ps5research lineage after issuance.
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # --- PS5 VERIFICATION ---
    # PS5 User-Agent: Mozilla/5.0 (PlayStation; PlayStation 5/XX.XX) AppleWebKit/605.1.15
    # Only allow PS5 on firmware 14.00+

    set $allowed 0;

    # Match PS5 firmware 14.xx, 15.xx, 16.xx, etc.
    if ($http_user_agent ~* "PlayStation 5/(1[4-9]|[2-9][0-9])\.") {
        set $allowed 1;
    }

    # Allow our own testing IPs (13.60 dev console)
    # Replace with your actual IPs
    if ($remote_addr = "REPLACE_WITH_YOUR_HOME_IP") {
        set $allowed 1;
    }

    # Let HTTP-01 challenges through the PS5 gate: Let's Encrypt validators
    # arrive with their own User-Agent and would hit the 403 below before
    # any certbot-added location block applies.
    if ($uri ~ ^/\.well-known/acme-challenge/) {
        set $allowed 1;
    }

    # Block everything else
    if ($allowed = 0) {
        return 403 "Access restricted.";
    }

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; connect-src *;" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # --- PROBE SERVING ---
    root /var/www/ps5research;

    # User Guide entry point
    location /document/gb/ps5/ {
        try_files /launcher.html =404;
    }

    location /document/gb/ps5/probe-modules.html {
        try_files /probe-modules.html =404;
    }

    # --- BEACON COLLECTION ---
    location /beacon/ {
        access_log /var/log/nginx/ps5_beacons.log;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 "ok";
    }

    # Stage scripts for the tester hub (operator-deployed; none ship in this
    # repo). The server-level PS5 user-agent gate above still applies.
    location /probes/ {
        try_files $uri =404;
    }

    # Block everything else
    location / {
        return 403 "Access restricted.";
    }
}
