<!--
  p608i: Ultra-fine iteration beacons between 3850-3900

  p608h: crash is between iteration 3850 and 3900 (2/2 runs consistent).
  This probe adds beacons every 5 iterations in that range.
  Also confirms I3850 arrival and checks I3900 absence.

  CRASH_CLASS: MODERATE (5th function will crash)
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p608i</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+encodeURIComponent(m),false);x.send();}catch(e){}}

function main(){
b('P608I-ULTRA-FINE');

function t1(sv,fo){var ab=new ArrayBuffer(0x100,{"maxByteLength":0x1000});var ta=new Uint32Array(ab);var v=0;var a=fo[0];var c=fo[1];var d=fo[2];var e=fo[3];var f=fo[4];ta[3]=sv;a.y={};c.y={};d.y={};e.y={};f.y={};return v;}
function t2(sv,fo){var ab=new ArrayBuffer(0x100,{"maxByteLength":0x1000});var ta=new Uint32Array(ab);var v=0;var a=fo[0];var c=fo[1];var d=fo[2];var e=fo[3];var f=fo[4];ta[3]=sv;a.y={};c.y={};d.y={};e.y={};f.y={};return v;}
function t3(sv,fo){var ab=new ArrayBuffer(0x100,{"maxByteLength":0x1000});var ta=new Uint32Array(ab);var v=0;var a=fo[0];var c=fo[1];var d=fo[2];var e=fo[3];var f=fo[4];ta[3]=sv;a.y={};c.y={};d.y={};e.y={};f.y={};return v;}
function t4(sv,fo){var ab=new ArrayBuffer(0x100,{"maxByteLength":0x1000});var ta=new Uint32Array(ab);var v=0;var a=fo[0];var c=fo[1];var d=fo[2];var e=fo[3];var f=fo[4];ta[3]=sv;a.y={};c.y={};d.y={};e.y={};f.y={};return v;}

var fns=[t1,t2,t3,t4];
for(var n=0;n<4;n++){
    var fl=[];for(var i=0;i<8;i++)fl.push({x:1});
    for(var i=0;i<0x1000;i++) fns[n](42,fl);
}
b('FN1-4-WARMED');

function t5(sv,fo){
    var ab=new ArrayBuffer(0x100,{"maxByteLength":0x1000});
    var ta=new Uint32Array(ab);
    var v=0;
    var a=fo[0];var c=fo[1];var d=fo[2];var e=fo[3];var f=fo[4];
    ta[3]=sv;
    a.y={};c.y={};d.y={};e.y={};f.y={};
    return v;
}

var fl5=[];for(var i=0;i<8;i++)fl5.push({x:1});

b('FN5-START');

for(var i=0;i<0x1000;i++){
    if(i===3800) b('I3800');
    if(i===3840) b('I3840');
    if(i===3845) b('I3845');
    if(i===3850) b('I3850');
    if(i===3855) b('I3855');
    if(i===3860) b('I3860');
    if(i===3865) b('I3865');
    if(i===3870) b('I3870');
    if(i===3875) b('I3875');
    if(i===3880) b('I3880');
    if(i===3885) b('I3885');
    if(i===3890) b('I3890');
    if(i===3895) b('I3895');
    if(i===3900) b('I3900');
    if(i===3910) b('I3910');
    if(i===3950) b('I3950');
    if(i===4000) b('I4000');
    if(i===4090) b('I4090');

    t5(42,fl5);
}
b('FN5-DONE');
b('P608I-COMPLETE');
}

setTimeout(main,200);
</script></head><body>p608i: ultra fine iteration</body></html>
