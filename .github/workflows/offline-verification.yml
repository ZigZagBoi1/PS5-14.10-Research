name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-console:
    name: no-console (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run bounded standard-library verifier
        run: python tools/verify_offline.py
      - name: Verify committed evidence ledger
        run: python3 tools/audit_research.py
      - name: Verify fault-oracle boundary capture evidence
        run: python -B tools/check_fault_oracle_boundary.py
      - name: Run offline verifier self-tests
        run: python -m unittest -v tests.test_offline_verification
      - name: Verify progress artifacts
        run: python tools/render_progress.py --check

  lua-syntax:
    name: Lua 5.1 probe syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Lua 5.1 runtime
        run: python -m pip install lupa==2.6
      - name: Compile every probe with Lua 5.1
        run: python tools/check_lua_syntax.py

  shell-syntax:
    name: Bash script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every tracked shell script
        run: |
          git ls-files -z '*.sh' | while IFS= read -r -d '' file; do
            bash -n "$file"
          done
