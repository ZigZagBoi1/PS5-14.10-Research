<!--
  p608e: Count resizable+fill DFG compilations to crash

  p608d showed: plain functions don't trigger the crash (Section A survived).
  Section B (5 resizable+fill in batch) crashes, but we need the exact count.

  This probe warms resizable+fill functions ONE AT A TIME with beacons between
  each to identify the exact DFG compilation count that triggers the crash.

  Each function is structurally identical (Uint32Array + resizable + 5 fillers)
  but declared separately so the DFG compiles each independently.

  CRASH_CLASS: MODERATE
-->
