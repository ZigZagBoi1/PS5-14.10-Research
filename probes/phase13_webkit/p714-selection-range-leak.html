<!--
  p714: Selection/Range API internal pointer leak

  The Selection and Range APIs operate on the live DOM tree through
  C++ Range objects. Each Range holds start/end {node, offset} pairs
  as C++ pointers. Range operations (compareBoundaryPoints, cloneRange,
  extractContents, surroundContents) create internal C++ objects whose
  allocation patterns are heap-dependent.

  Key insight: Range.compareBoundaryPoints traverses the DOM ancestor
  chain for two boundary points. The traversal time depends on the
  tree depth AND the memory layout of the DOM nodes (cache behavior).
  By measuring comparison timing for ranges at different tree depths,
  we can infer whether DOM nodes are contiguous in memory.

  Attack angles:
  A) Range creation timing -- creating ranges in different parts of
     a large DOM tree. Timing reveals node memory layout.
  B) compareBoundaryPoints timing -- compare ranges at varying
     tree depths and positions. Ancestor traversal depends on memory.
  C) cloneRange + deleteContents timing -- forces node copying and
     deletion, revealing allocator behavior.
  D) Selection.addRange ordering -- adding multiple ranges to a
     selection. Internal list management reveals heap layout.
  E) createTreeWalker + Range interaction -- TreeWalker traversal
     over a range-bounded subtree. Traversal order reveals node
     memory contiguity.
  F) Range.toString vs Range.cloneContents -- toString walks DOM
     and concatenates text; cloneContents deep-clones nodes. Timing
     difference reveals node vs text allocation patterns.

  CRASH_CLASS: LOW (DOM API usage, no mutation of critical state)
  prior art: p713 (MutationObserver + DOM internals)
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p714</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+encodeURIComponent(m),false);x.send();}catch(e){}}

function main(){
  b('P714-START:SELECTION-RANGE-LEAK');
  var results = [];

  // Build a large DOM tree for testing
  var container = document.createElement('div');
  container.style.cssText = 'position:absolute;left:-9999px;';
  document.body.appendChild(container);

  // Build tree with known structure: 10 branches, each 20 levels deep
  function buildTree(parent, depth, maxDepth, branchId) {
    if (depth >= maxDepth) return;
    var div = document.createElement('div');
    div.className = 'node-d' + depth + '-b' + branchId;
    div.textContent = 'D' + depth + 'B' + branchId + ' ';
    parent.appendChild(div);
    buildTree(div, depth + 1, maxDepth, branchId);
  }

  for (var br = 0; br < 10; br++) {
    buildTree(container, 0, 20, br);
  }

  // === SECTION A: Range creation timing across tree positions ===
  b('A:RANGE-CREATION-TIMING');
  try {
    var allDivs = container.querySelectorAll('div');
    b('A:TOTAL-NODES=' + allDivs.length);

    // Create ranges at different positions and measure timing
    var positions = [0, 10, 25, 50, 75, 100, 150, 190];
    var createTimes = [];

    for (var p = 0; p < positions.length; p++) {
      var idx = Math.min(positions[p], allDivs.length - 1);
      var node = allDivs[idx];

      var t0 = performance.now();
      for (var i = 0; i < 10000; i++) {
        var r = document.createRange();
        r.selectNodeContents(node);
        r.detach();
      }
      var dt = performance.now() - t0;
      createTimes.push(idx + ':' + dt.toFixed(2));
    }
    b('A:CREATE-TIMES:' + createTimes.join(','));

    // Check for position-dependent timing
    var times = createTimes.map(function(t) { return parseFloat(t.split(':')[1]); });
    var minT = Math.min.apply(null, times);
    var maxT = Math.max.apply(null, times);
    b('A:RANGE:min=' + minT.toFixed(2) + ',max=' + maxT.toFixed(2) + ',ratio=' + (maxT/minT).toFixed(3));
    if (maxT / minT > 1.2) {
      results.push('A:position-dependent-timing');
    }
  } catch(e) {
    b('A:ERR:' + e.message);
  }

  // === SECTION B: compareBoundaryPoints timing ===
  b('B:COMPARE-BOUNDARY-TIMING');
  try {
    var allDivs = container.querySelectorAll('div');

    // Create ranges at varying distances
    var compareTimes = [];
    var distances = [1, 5, 10, 20, 50, 100];

    for (var d = 0; d < distances.length; d++) {
      var dist = distances[d];
      if (dist >= allDivs.length) break;

      var r1 = document.createRange();
      r1.selectNodeContents(allDivs[0]);
      var r2 = document.createRange();
      r2.selectNodeContents(allDivs[dist]);

      var t0 = performance.now();
      for (var i = 0; i < 10000; i++) {
        r1.compareBoundaryPoints(Range.START_TO_START, r2);
        r1.compareBoundaryPoints(Range.END_TO_END, r2);
        r1.compareBoundaryPoints(Range.START_TO_END, r2);
        r1.compareBoundaryPoints(Range.END_TO_START, r2);
      }
      var dt = performance.now() - t0;
      compareTimes.push(dist + ':' + dt.toFixed(2));

      r1.detach();
      r2.detach();
    }
    b('B:COMPARE-TIMES:' + compareTimes.join(','));

    // Deeper ranges (same branch)
    var branch0 = container.querySelector('.node-d0-b0');
    var deepNodes = branch0.querySelectorAll('div');
    var depthTimes = [];

    for (var d = 0; d < Math.min(deepNodes.length, 15); d += 3) {
      var r1 = document.createRange();
      r1.selectNodeContents(deepNodes[0]);
      var r2 = document.createRange();
      r2.selectNodeContents(deepNodes[d]);

      var t0 = performance.now();
      for (var i = 0; i < 10000; i++) {
        r1.compareBoundaryPoints(Range.START_TO_START, r2);
      }
      var dt = performance.now() - t0;
      depthTimes.push(d + ':' + dt.toFixed(2));

      r1.detach();
      r2.detach();
    }
    b('B:DEPTH-TIMES:' + depthTimes.join(','));
  } catch(e) {
    b('B:ERR:' + e.message);
  }

  // === SECTION C: cloneRange + deleteContents timing ===
  b('C:CLONE-DELETE-TIMING');
  try {
    var cloneTimes = [];
    var sizes = [1, 5, 10, 20, 50];

    for (var s = 0; s < sizes.length; s++) {
      var tempContainer = document.createElement('div');
      for (var i = 0; i < sizes[s]; i++) {
        var el = document.createElement('span');
        el.textContent = 'item' + i;
        tempContainer.appendChild(el);
      }
      container.appendChild(tempContainer);

      var range = document.createRange();
      range.selectNodeContents(tempContainer);

      // Clone timing
      var t0 = performance.now();
      for (var i = 0; i < 1000; i++) {
        var cloned = range.cloneContents();
      }
      var cloneDt = performance.now() - t0;

      // toString timing for comparison
      var t1 = performance.now();
      for (var i = 0; i < 1000; i++) {
        var str = range.toString();
      }
      var strDt = performance.now() - t1;

      cloneTimes.push(sizes[s] + ':clone=' + cloneDt.toFixed(2) + ',str=' + strDt.toFixed(2));
      range.detach();
    }
    b('C:CLONE-TIMES:' + cloneTimes.join('|'));
  } catch(e) {
    b('C:ERR:' + e.message);
  }

  // === SECTION D: Selection.addRange ordering ===
  b('D:SELECTION-ADDRANGE');
  try {
    var sel = window.getSelection();
    if (sel) {
      sel.removeAllRanges();

      var allDivs = container.querySelectorAll('div');
      var addTimes = [];

      // Add ranges one by one and measure cumulative timing
      for (var i = 0; i < Math.min(20, allDivs.length); i++) {
        var r = document.createRange();
        r.selectNodeContents(allDivs[i * 5]);

        var t0 = performance.now();
        try {
          sel.addRange(r);
        } catch(e2) {
          // Some browsers limit multi-range selection
        }
        var dt = performance.now() - t0;
        addTimes.push(i + ':' + dt.toFixed(4));
      }
      b('D:ADD-TIMES:' + addTimes.slice(0, 10).join(','));
      b('D:RANGE-COUNT=' + sel.rangeCount);

      // Check if multi-range is supported
      if (sel.rangeCount > 1) {
        b('D:MULTI-RANGE-SUPPORTED');
        results.push('D:multi-range');
      } else {
        b('D:SINGLE-RANGE-ONLY');
      }

      sel.removeAllRanges();
    } else {
      b('D:NO-SELECTION-API');
    }
  } catch(e) {
    b('D:ERR:' + e.message);
  }

  // === SECTION E: TreeWalker + Range interaction ===
  b('E:TREEWALKER-RANGE');
  try {
    var allDivs = container.querySelectorAll('div');

    // TreeWalker over entire tree
    var t0 = performance.now();
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_ELEMENT);
    var walkCount = 0;
    while (walker.nextNode()) walkCount++;
    var fullDt = performance.now() - t0;
    b('E:FULL-WALK:count=' + walkCount + ',time=' + fullDt.toFixed(2));

    // TreeWalker with NodeFilter that checks range containment
    if (allDivs.length >= 50) {
      var testRange = document.createRange();
      testRange.setStart(allDivs[10], 0);
      testRange.setEnd(allDivs[40], 0);

      var t1 = performance.now();
      var walker2 = document.createTreeWalker(container, NodeFilter.SHOW_ELEMENT, {
        acceptNode: function(node) {
          try {
            if (testRange.comparePoint(node, 0) === 0) {
              return NodeFilter.FILTER_ACCEPT;
            }
          } catch(e2) {}
          return NodeFilter.FILTER_SKIP;
        }
      });
      var filteredCount = 0;
      while (walker2.nextNode()) filteredCount++;
      var filteredDt = performance.now() - t1;
      b('E:FILTERED-WALK:count=' + filteredCount + ',time=' + filteredDt.toFixed(2));
      b('E:OVERHEAD=' + (filteredDt / fullDt).toFixed(2) + 'x');

      testRange.detach();
    }
  } catch(e) {
    b('E:ERR:' + e.message);
  }

  // === SECTION F: Range.toString vs cloneContents deep comparison ===
  b('F:TOSTRING-VS-CLONE');
  try {
    // Build a text-heavy subtree
    var textContainer = document.createElement('div');
    for (var i = 0; i < 100; i++) {
      var p = document.createElement('p');
      p.textContent = 'Paragraph ' + i + ' with some text content that makes the range operations meaningful. ';
      textContainer.appendChild(p);
    }
    container.appendChild(textContainer);

    var range = document.createRange();
    range.selectNodeContents(textContainer);

    // toString (text extraction only)
    var toStringTimes = [];
    for (var round = 0; round < 10; round++) {
      var t0 = performance.now();
      for (var i = 0; i < 500; i++) {
        var s = range.toString();
      }
      toStringTimes.push((performance.now() - t0).toFixed(2));
    }
    b('F:TOSTRING-TIMES:' + toStringTimes.join(','));

    // cloneContents (deep DOM clone)
    var cloneTimes = [];
    for (var round = 0; round < 10; round++) {
      var t0 = performance.now();
      for (var i = 0; i < 500; i++) {
        var frag = range.cloneContents();
      }
      cloneTimes.push((performance.now() - t0).toFixed(2));
    }
    b('F:CLONE-TIMES:' + cloneTimes.join(','));

    var avgStr = toStringTimes.reduce(function(a,b){return a+parseFloat(b)},0) / toStringTimes.length;
    var avgClone = cloneTimes.reduce(function(a,b){return a+parseFloat(b)},0) / cloneTimes.length;
    b('F:AVG-STR=' + avgStr.toFixed(2) + ',AVG-CLONE=' + avgClone.toFixed(2) + ',RATIO=' + (avgClone/avgStr).toFixed(2));

    range.detach();
  } catch(e) {
    b('F:ERR:' + e.message);
  }

  document.body.removeChild(container);

  // === RESULTS ===
  if (results.length > 0) {
    b('P714-RESULT:HITS=' + results.join(';'));
  } else {
    b('P714-RESULT:NO-LEAK-DETECTED');
  }
  b('P714-DONE');
}

setTimeout(main, 200);
</script>
</head><body style="margin:0"><pre id="log">p714: Selection/Range API internal pointer leak</pre></body></html>
