              bs('SWAP-pk'+PK+'<-s'+SW+',pk2'+PK2+'<-s'+SW2);
              if(PK3>=0&&PK3<16){var poison3=(SW3>=0&&SW3<16)?slots[SW3]:slots[PK3];put64(sk,8+PK3*8,poison3);bs('SWAP3-pk'+PK3+'<-s'+SW3);}

             the REPLANT phase below restores it. */

                   empty like eb=1. Survives => the kill needs impl->get()

                put64(wc,0xA8,FO+0x20n);

                put64(wc,0xA8,firstSpAddr+0x88n);

            }

          bs('LAY-OK-coop='+COOP+',cli='+CLI+',vptr='+hex(vptrTarget)+(NC?'-NOCLI':'')+((CE&&COOP===2&&firstSpAddr!==0n)?'-CE@'+hex(firstSpAddr+0x88n):''));

        catch(e){bs('FAM-ERR-'+String(e&&e.message||e).slice(0,40));}
