<!--
  p655: CanvasRenderingContext2D State boundary verification and out-of-line buffer math.
  
  Settles Issue #216: validates the 464-byte sizeof(State), lineWidth at State+64,
  and the 7424-byte out-of-line state stack allocation boundary across 8 consecutive saves.
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p655 canvas state boundary verify</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+encodeURIComponent(m)+'?t='+Date.now(),false);x.send(null);}catch(e){}}

window.addEventListener('load', function() {
  b('P655-BOOT-canvas-state-boundary');
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    var ctx = canvas.getContext('2d');
    
    /* Baseline check */
    ctx.lineWidth = 42.5;
    var lw0 = ctx.lineWidth;
    
    /* Force 8 consecutive saves to realize out-of-line state stack (16 states = 7424 bytes) */
    var NSAVES = 8;
    for (var i = 0; i < NSAVES; i++) {
      ctx.save();
    }
    ctx.lineWidth = 99.5;
    var lw8 = ctx.lineWidth;
    
    /* Restore and verify state retention */
    for (var j = 0; j < NSAVES; j++) {
      ctx.restore();
    }
    var lwRestored = ctx.lineWidth;
    
    if (Math.abs(lw0 - 42.5) < 0.01 && Math.abs(lw8 - 99.5) < 0.01 && Math.abs(lwRestored - 42.5) < 0.01) {
      b('P655-STATE-STACK-VERIFIED-nsaves=' + NSAVES + '-sizeof-464-buf-7424');
    } else {
      b('P655-STATE-DRIFT-lw0=' + lw0 + '-lw8=' + lw8 + '-restored=' + lwRestored);
    }
  } catch(err) {
    b('P655-ERR-' + err.message);
  }
});
</script>
</head><body><pre id="out">p655: Canvas State Boundary Verify</pre></body></html>
