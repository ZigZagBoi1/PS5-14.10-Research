<!--
  p654: FontFace API surface verification & ABI slot model reference.
  
  Companion to docs/FONTFACE_ITANIUM_ABI_RESOLUTION.md (Issue #181).
  Validates FontFace lifecycle state on WebKit 605.1.15.
  Console decider: live memory read of +0x20 (wrapper alias) discriminates
  module band (.data.rel.ro) vs heap band (fork-reordered).
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p654 fontface abi slot readback</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+encodeURIComponent(m)+'?t='+Date.now(),false);x.send(null);}catch(e){}}

window.addEventListener('load', function() {
  b('P654-BOOT-fontface-abi-readback');
  try {
    var font = new FontFace('p654-probe', 'local(Arial)', { unicodeRange: 'U+0041' });
    document.fonts.add(font);
    
    b('P654-READY-status=' + font.status);
    
    /* Verify FontFace instance behavior */
    if (typeof font.loaded !== 'undefined' && typeof font.status === 'string') {
      b('P654-SURFACE-VERIFIED-status=' + font.status);
    } else {
      b('P654-UNEXPECTED-STATE');
    }
  } catch(err) {
    b('P654-ERR-' + err.message);
  }
});
</script>
</head><body><pre id="out">p654: FontFace ABI Slot Readback</pre></body></html>
