<rect x="60" y="78" width="310" height="84" rx="10" fill="url(#entry1)" filter="url(#shadow)" opacity="0.75"/>
<text x="80" y="102" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#93c5fd" letter-spacing="1">ENTRY VECTOR 1</text>
<text x="80" y="122" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Lua 5.1 Loader</text>
<text x="80" y="142" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#bfdbfe">TCP 9026 · Kernel surface exhausted · Userland primitives only</text>

<!-- Entry Vector 2: WebKit (PRIMARY) -->
<rect x="430" y="78" width="310" height="84" rx="10" fill="url(#entry2)" filter="url(#shadow)" opacity="0.95"/>
<rect x="430" y="78" width="310" height="84" rx="10" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 3"/>
<text x="450" y="102" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#d8b4fe" letter-spacing="1">ENTRY VECTOR 2 · PRIMARY</text>
<text x="450" y="122" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">WebKit 605.1.15</text>
<text x="450" y="142" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#e9d5ff">Safari 17.0 fork · RIP control on 14.00 · V88 forge designed</text>

